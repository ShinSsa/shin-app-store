version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<serviço>_1
      APP_HOST: shin-ramotion_web_1
      APP_PORT: 8790

  web:
    image: ghcr.io/shinssa/ramotion:1.0.0
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      RAMOTION_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
