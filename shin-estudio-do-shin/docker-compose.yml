version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<serviço>_1
      APP_HOST: shin-estudio-do-shin_web_1
      APP_PORT: 8787
      # o Claude (mcp.mjs) entra sem a tela de login do Umbrel
      PROXY_AUTH_WHITELIST: "/api/mcp"

  web:
    image: ghcr.io/shinssa/estudio-do-shin:1.0.20
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      SHIN_DATA: /data
      SHIN_ROOT: /umbrel/Estúdio do Shin
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # pasta Home do app Arquivos do Umbrel
      - ${UMBREL_ROOT}/home:/umbrel
