# Monta a imagem Docker do app Feira sempre que algo em src/feira-do-shin muda.
# A versão vem do arquivo src/feira-do-shin/VERSION.
name: Feira (imagem Docker)
on:
  push:
    branches: [master, main]
    paths: ["src/feira-do-shin/**", ".github/workflows/feira-do-shin.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat src/feira-do-shin/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/feira-do-shin
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/shinssa/feira-do-shin:${{ steps.v.outputs.version }}
            ghcr.io/shinssa/feira-do-shin:latest
