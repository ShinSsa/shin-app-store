version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<serviço>_1
      APP_HOST: shin-financequest_web_1
      APP_PORT: 8796

  web:
    image: ghcr.io/shinssa/financequest:1.0.1
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      HOST: 0.0.0.0
      PORT: 8796
      FQ_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
