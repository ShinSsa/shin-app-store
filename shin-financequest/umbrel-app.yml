manifestVersion: 1
id: shin-financequest
name: FinanceQuest
tagline: Finanças pessoais em poucos toques, com cartão, fixas e metas gamificadas
icon: https://raw.githubusercontent.com/ShinSsa/shin-app-store/master/assets/financequest.png
category: finance
version: "1.0.0"
port: 8796
description: >-
  Controle financeiro pessoal feito para o dia a dia ser rápido: digite o
  valor e toque na categoria. Mostra quanto está livre para gastar no mês
  e por dia, contas fixas com pagar em 1 toque (inclusive parceladas com
  data de término), cartão de crédito com limite, faturas, compras
  parceladas e antecipação com desconto.


  Para motivar a guardar dinheiro: caixinhas com foto para cada sonho,
  reserva de emergência com marcos, "pague-se primeiro" quando entra
  dinheiro, sequência semanal, níveis e troféus por atitudes.


  Os dados ficam salvos no Umbrel e aparecem iguais no iPhone, no Mac e em
  qualquer aparelho da rede. Sem conexão, o app continua salvando no
  aparelho e envia quando o Umbrel voltar. O Umbrel guarda uma cópia de
  segurança por dia (últimos 30 dias).
developer: Ramon (ShinSsa)
website: https://github.com/ShinSsa/shin-app-store
submitter: ShinSsa
submission: https://github.com/ShinSsa/shin-app-store
repo: https://github.com/ShinSsa/shin-app-store
support: https://github.com/ShinSsa/shin-app-store/issues
gallery: []
releaseNotes: >-
  Primeira versão no Umbrel, com sincronização entre aparelhos.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
