// "Estou no Atacadão": every price typed goes to that market; turns off when you leave or finish the list.
const MM_KEY = 'marketMode';
const MM_TTL = 12*3600000; // forgets after 12 h without use
function getMarketMode(){
  let m = null;
  try{ m = JSON.parse(ls.get(MM_KEY,'null')); }catch(e){}
  if(!m) return null;
  const l = listById(m.listId);
  if(Date.now()-m.at > MM_TTL || !l || l.status!=='active' || !placeById(m.placeId)){ ls.del(MM_KEY); return null; }
  return m;
}
const mmFor = list => { const m = getMarketMode(); return m && list && m.listId===list.id ? m : null; };
function mmTouch(){ const m = getMarketMode(); if(m){ m.at = Date.now(); ls.set(MM_KEY, JSON.stringify(m)); } }
const isUnavailable = (it, placeId) => (it.unavailable||[]).includes(placeId);

window.pickMarketMode = (listId) => {
  if(!cache.places.length) return toast('Cadastre um local na aba Locais');
  const list = listById(listId);
  openSheet(`
    <h3>Onde você está?</h3>
    <div class="tiny muted" style="margin-top:-10px;margin-bottom:14px">Os preços que você anotar vão direto pra esse lugar.</div>
    ${cache.places.map(pl=>{
      const items = (list.items||[]).filter(it=>productById(it.productId));
      const done = items.filter(it=>(it.quotes||[]).some(q=>q.placeId===pl.id) || isUnavailable(it, pl.id)).length;
      const tipo = placeTypeLabel(pl);
      return `<div class="card tap" onclick="setMarketMode('${listId}','${pl.id}')"><div class="row between">
        <div><div style="font-weight:600">${escapeHtml(pl.name)}</div><div class="tiny muted">${escapeHtml(tipo)}</div></div>
        ${items.length?`<span class="tiny muted num">${done}/${items.length} orçados</span>`:''}
      </div></div>`;
    }).join('')}
    <button class="btn full" style="margin-top:8px" onclick="closeSheet()">Cancelar</button>`);
};
window.setMarketMode = (listId, placeId) => {
  ls.set(MM_KEY, JSON.stringify({listId, placeId, at:Date.now()}));
  ls.set('lastCartPlace', placeId);
  closeSheet();
  render.list();
  window.scrollTo(0,0);
  toast(`Orçando em ${placeById(placeId)?.name||''}`);
};
window.stopMarketMode = () => {
  ls.del(MM_KEY);
  render.list();
  window.scrollTo(0,0);
  toast('Modo mercado desligado');
};

function renderMarketMode(list, mm){
  const place = placeById(mm.placeId);
  const items = (list.items||[]).filter(it=>productById(it.productId));
  const here = it => (it.quotes||[]).find(q=>q.placeId===mm.placeId);
  const pending = items.filter(it=>!it.cart && !here(it) && !isUnavailable(it, mm.placeId));
  const quoted = items.filter(it=>!it.cart && here(it));
  const inCart = items.filter(it=>it.cart);
  const missing = items.filter(it=>!it.cart && !here(it) && isUnavailable(it, mm.placeId));
  const totalHere = items.filter(here).reduce((s,it)=>s + here(it).unitPrice*(it.cart?.qty ?? it.qty ?? 0), 0);
  const quotedCount = items.filter(here).length;
  const row = (it, kind) => {
    const p = productById(it.productId);
    const q = here(it);
    const qty = it.cart ? it.cart.qty : it.qty;
    let right;
    if(it.cart) right = `<div class="price best">${fmtBRL(itemTotal(it))}</div><div class="tiny muted" style="text-align:right">${escapeHtml(placeById(it.cart.placeId)?.name||'')}</div>`;
    else if(kind==='quoted') right = `<div class="price">${fmtBRL(q.unitPrice)}</div><div class="tiny muted" style="text-align:right">/${unitShort(p)}</div>`;
    else if(kind==='missing') right = `<span class="chip tiny">não tem</span>`;
    else right = `<div class="chip" style="padding:5px 12px">Anotar</div>`;
    const last = kind==='pending' && !it.cart ? lastSeenAt(p.id, mm.placeId) : null;
    return `<div class="list-item ${it.cart?'checked':''}" onclick="openQuickQuote('${list.id}','${it.id}')">
      <div class="row between">
        <div class="row" style="gap:12px;flex:1;min-width:0">
          ${kind==='missing'?'<div style="width:24px"></div>':`<button class="check ${it.cart?'checked':''}" onclick="event.stopPropagation();toggleCart('${list.id}','${it.id}')" aria-label="${it.cart?'Tirar do carrinho':'Pôr no carrinho'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></button>`}
          <div style="flex:1;min-width:0">
            <div class="title">${escapeHtml(p.name)}${p.brand?` <span class="muted tiny">· ${escapeHtml(p.brand)}</span>`:''}</div>
            <div class="meta"><span>${fmtQty(qty,p.sellBy)} ${unitShort(p)}</span>${last?`<span class="hint-line">da última vez aqui: ${fmtBRL(last.unitPrice)}, ${daysAgo(last.date)}</span>`:''}</div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">${right}</div>
      </div>
    </div>`;
  };
  let html = `
    <div class="card mm-bar">
      <div style="min-width:0">
        <div class="tiny" style="color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em">📍 Estou em</div>
        <div style="font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(place.name)}</div>
        <div class="tiny muted">${quotedCount} anotado${quotedCount===1?'':'s'} · ${pending.length} falta${pending.length===1?'':'m'}${missing.length?` · ${missing.length} não tem`:''}</div>
      </div>
      <div class="col" style="gap:6px;align-items:flex-end;flex-shrink:0">
        <button class="btn sm" onclick="pickMarketMode('${list.id}')">Trocar</button>
        <button class="btn sm primary" onclick="stopMarketMode()">Sair</button>
      </div>
    </div>
    <div class="check-progress" style="margin:10px 0 4px"><div style="width:${items.length?(items.length-pending.length)/items.length*100:0}%"></div></div>
    <div class="row between tiny muted" style="margin:0 2px 12px"><span>Total aqui (itens anotados)</span><strong class="num" style="color:var(--text)">${fmtBRL(totalHere)}</strong></div>`;
  if(!items.length){
    html += `<div class="empty"><h3>Lista vazia</h3><p>Adicione produtos pra orçar.</p><button class="btn primary" onclick="addItemToList()">Adicionar produto</button></div>`;
    return html;
  }
  if(pending.length){
    html += `<div class="section-head"><h2>Falta anotar</h2><span class="tiny muted">${pending.length}</span></div>`;
    pending.forEach(it=>html+=row(it,'pending'));
  } else {
    html += `<div class="warn-banner" style="margin-top:4px">Tudo orçado em ${escapeHtml(place.name)}. Toque em <strong>Sair</strong> pra comparar com os outros mercados.</div>`;
  }
  if(quoted.length){
    html += `<div class="section-head"><h2>Anotado aqui</h2><span class="tiny muted">${quoted.length}</span></div>`;
    quoted.forEach(it=>html+=row(it,'quoted'));
  }
  if(missing.length){
    html += `<div class="section-head"><h2>Não tem aqui</h2><span class="tiny muted">${missing.length}</span></div>`;
    missing.forEach(it=>html+=row(it,'missing'));
  }
  if(inCart.length){
    html += `<div class="section-head cart-head"><h2>✓ No carrinho</h2><span class="tiny muted num">${inCart.length} · ${fmtBRL(sumTotals(inCart))}</span></div>`;
    inCart.slice().sort((a,b)=>(b.cart.date||0)-(a.cart.date||0)).forEach(it=>html+=row(it, here(it)?'quoted':'pending'));
  }
  html += `<button class="btn ghost full" style="margin-top:10px" onclick="addItemToList()">+ Adicionar item</button>`;
  return html;
}

window.saveQuickQuote = async (listId, itemId) => {
  const list = listById(listId);
  const item = findItem(list, itemId);
  const mm = mmFor(list);
  if(!item || !mm) return closeSheet();
  const price = parseNum(document.getElementById('f-qq').value);
  if(!(price>0)) return toast('Digite o preço da etiqueta');
  await upsertQuote(list, item, mm.placeId, price, document.getElementById('f-qqpromo').classList.contains('active'));
  await dbPut('lists', list);
  mmTouch();
  await reload();
  closeSheet();
  render.list();
  toast(`${productById(item.productId)?.name}: ${fmtBRL(price)}`);
};
window.markUnavailable = async (listId, itemId) => {
  const list = listById(listId);
  const item = findItem(list, itemId);
  const mm = mmFor(list);
  if(!item || !mm) return closeSheet();
  item.unavailable = [...new Set([...(item.unavailable||[]), mm.placeId])];
  const q = (item.quotes||[]).find(x=>x.placeId===mm.placeId);
  if(q){ item.quotes = item.quotes.filter(x=>x!==q); if(item.placeId===mm.placeId) item.placeId = null; }
  await dbPut('lists', list);
  mmTouch();
  await reload();
  closeSheet();
  render.list();
  toast(`Marcado: não tem em ${placeById(mm.placeId)?.name||''}`);
};
window.clearUnavailable = async (listId, itemId, placeId) => {
  const list = listById(listId);
  const item = findItem(list, itemId);
  if(!item) return;
  item.unavailable = (item.unavailable||[]).filter(x=>x!==placeId);
  await dbPut('lists', list);
  await reload();
  render.list();
  openListItem(listId, itemId);
};

window.suggestBestPlaces = () => {
  const list = getCurrentList();
  const pending = (list?.items||[]).filter(it=>!it.cart && productById(it.productId));
  if(!pending.length) return toast(list?.items?.length ? 'Tudo já está no carrinho' : 'Lista vazia');
  const placeTotals = cache.places.map(pl=>{
    let total = 0, covered = 0; const missing = [];
    pending.forEach(it=>{
      const q = (it.quotes||[]).find(x=>x.placeId===pl.id);
      if(!q){ missing.push(productById(it.productId).name + (isUnavailable(it, pl.id)?' (não tem)':'')); return; }
      total += q.unitPrice*(it.qty||0); covered++;
    });
    return {place:pl, total, covered, missing};
  }).filter(x=>x.covered>0).sort((a,b)=> b.covered-a.covered || a.total-b.total);
  const perItem = pending.map(it=>{ const q = sortedQuotes(it)[0]; return q ? {it, q, total:q.unitPrice*(it.qty||0)} : null; }).filter(Boolean);
  const hybridTotal = perItem.reduce((s,x)=>s+x.total,0);
  const distinct = [...new Set(perItem.map(x=>x.q.placeId))];
  const noQuote = pending.length - perItem.length;

  let html = `<h3>Onde comprar?</h3>
    <div class="tiny muted" style="margin-top:-10px;margin-bottom:12px">${pending.length} ${pending.length===1?'item falta':'itens faltam'}${noQuote?` · ${noQuote} sem preço anotado`:''}</div>`;
  if(!perItem.length){
    html += `<div class="empty tiny">Anote preços nos itens pra ver a comparação.</div>`;
  }
  if(placeTotals.length){
    html += `<div class="section-head" style="margin-top:0"><h2>Tudo num lugar só</h2></div>`;
    placeTotals.slice(0,5).forEach((x,i)=>{
      html += `<div class="card"><div class="row between">
        <div style="min-width:0">
          <div style="font-weight:700">${escapeHtml(x.place.name)} ${i===0?'<span class="chip best tiny">melhor</span>':''}</div>
          <div class="tiny muted">${x.covered}/${pending.length} itens com preço${x.missing.length?` · falta: ${x.missing.slice(0,3).map(escapeHtml).join(', ')}${x.missing.length>3?` +${x.missing.length-3}`:''}`:''}</div>
        </div>
        <div class="num" style="font-weight:700;font-size:17px">${fmtBRL(x.total)}</div>
      </div></div>`;
    });
  }
  if(distinct.length>1){
    html += `<div class="section-head"><h2>Rota de economia</h2></div><div class="card">
      <div class="tiny muted" style="margin-bottom:8px">Menor preço de cada item, em ${distinct.length} lugares:</div>
      ${distinct.map(pid=>{
        const its = perItem.filter(x=>x.q.placeId===pid);
        return `<div style="padding:8px 0;border-top:1px solid var(--border)">
          <div class="row between"><div style="font-weight:600">${escapeHtml(placeById(pid)?.name||'')}</div><div class="num" style="font-weight:700">${fmtBRL(its.reduce((s,x)=>s+x.total,0))}</div></div>
          <div class="tiny muted">${its.map(x=>escapeHtml(productById(x.it.productId).name)).join(', ')}</div>
        </div>`;
      }).join('')}
      <div class="row between" style="margin-top:10px;padding-top:10px;border-top:2px solid var(--border)">
        <div style="font-weight:700">Total</div><div class="num" style="font-weight:800;color:var(--accent);font-size:18px">${fmtBRL(hybridTotal)}</div>
      </div>
      ${placeTotals[0] && placeTotals[0].covered===perItem.length ? `<div class="tiny muted" style="margin-top:8px">Economia vs. só ${escapeHtml(placeTotals[0].place.name)}: <strong style="color:var(--ok)">${fmtBRL(placeTotals[0].total-hybridTotal)}</strong></div>`:''}
    </div>`;
  }
  html += `<button class="btn full" style="margin-top:12px" onclick="closeSheet()">Fechar</button>`;
  openSheet(html);
};

  const input = document.getElementById('prod-search');
  input.addEventListener('input', ()=>{ prodQuery = input.value; document.getElementById('prod-clear').style.display = prodQuery ? '' : 'none'; renderProductResults(); });
  document.getElementById('prod-clear').addEventListener('click', ()=>{ prodQuery = ''; input.value = ''; document.getElementById('prod-clear').style.display = 'none'; renderProductResults(); input.focus(); });
  bindChips('prod-cats', v => { prodCat = v || ''; renderProductResults(); });
  renderProductResults();
};
const normTxt = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function renderProductResults(){
  const box = document.getElementById('prod-results');
  if(!box) return;
  const q = normTxt(prodQuery.trim());
  const list = cache.products.filter(p => (!prodCat || (p.category||'outro')===prodCat) && (!q || normTxt(p.name).includes(q) || normTxt(p.brand).includes(q)));
  let html = `<div class="row between" style="margin:2px 2px 4px">
    <div class="tiny muted">${list.length} de ${cache.products.length} ${cache.products.length===1?'produto':'produtos'}</div>
  </div>`;
  if(!list.length){
    html += `<div class="empty" style="padding:24px 10px"><p>Nada encontrado${prodQuery?` pra "${escapeHtml(prodQuery)}"`:''}.</p>
      <button class="btn primary" onclick="editProduct(null,{name:prodQuery})">+ Cadastrar ${prodQuery?`"${escapeHtml(prodQuery)}"`:'produto'}</button></div>`;
    box.innerHTML = html;
    return;
  }
  const byCat = {};
  list.forEach(p => (byCat[p.category||'outro']=byCat[p.category||'outro']||[]).push(p));
  CATEGORIES.forEach(cat => {
    if(!byCat[cat.id]) return;
    html += `<div class="section-head"><h2>${cat.name}</h2><span class="chip cat-${cat.id} tiny">${byCat[cat.id].length}</span></div>`;
    byCat[cat.id].forEach(p => {
      const best = latestByPlace(p.id)[0];
      html += `<div class="card tap" onclick="editProduct('${p.id}')">
        <div style="font-weight:600">${escapeHtml(p.name)}${p.brand?` <span class="muted tiny">· ${escapeHtml(p.brand)}</span>`:''}</div>
        <div class="tiny muted">${SELL_UNITS.find(s=>s.id===p.sellBy)?.name||''}${p.packSize?` · ${fmtQty(p.packSize,'kg')} ${p.packUnit}`:''}${best?` · menor ${fmtBRL(best.unitPrice)}/${unitShort(p)} em ${escapeHtml(placeById(best.placeId)?.name||'')}, ${daysAgo(best.date)}`:''}</div>
      </div>`;
    });
  });
  box.innerHTML = html;
}

  // also drop its quotes from active lists
  for(const l of cache.lists.filter(x=>x.status==='active')){
    let changed = false;
    (l.items||[]).forEach(it=>{
      const before = (it.quotes||[]).length;
      it.quotes = (it.quotes||[]).filter(q=>q.placeId!==id);
      if(it.placeId===id){ it.placeId = null; changed = true; }
      if(it.quotes.length!==before) changed = true;
    });

  }
  await dbDel('places', id);
  await reload();
  closeSheet();
  toast('Local excluído');

};

/* ===================== HISTORY ===================== */
render.history = () => {
  const c = document.getElementById('history-container');
  let html = '';

  // monthly spending: only what actually went into the cart, from finished lists
  const now = new Date();
  const months = [];
  for(let i=11;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:`${d.getFullYear()}-${d.getMonth()}`, label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), v:0});
  }
  cache.lists.filter(l=>l.status==='done').forEach(l=>{
    const d = new Date(l.finishedAt||l.date);
    const m = months.find(x=>x.key===`${d.getFullYear()}-${d.getMonth()}`);
    if(m) m.v += sumTotals((l.items||[]).filter(i=>i.cart));
  });
  const thisMonth = months[11].v, lastMonth = months[10].v;
  const total12 = months.reduce((s,m)=>s+m.v,0);
  const diff = lastMonth>0 ? (thisMonth-lastMonth)/lastMonth*100 : null;
  const maxV = Math.max(...months.map(m=>m.v), 1);

  if(cache.prices.length || total12>0){
    html += `<div class="stats-grid" style="margin-bottom:14px">
      <div class="stat"><div class="label">Mês atual</div><div class="value">${fmtBRL(thisMonth)}</div>
        ${diff!=null?`<div class="delta" style="color:${diff>0?'var(--bad)':'var(--ok)'}">${diff>0?'+':''}${diff.toFixed(0)}% vs mês passado</div>`:''}</div>
      <div class="stat"><div class="label">Total 12 meses</div><div class="value">${fmtBRL(total12)}</div></div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:2px">Gasto mensal</div>
      <div class="tiny muted" style="margin-bottom:12px">o que foi pro carrinho em compras encerradas</div>
      <div class="bars">${months.map(m=>`<div class="bar-col"><div class="bar" style="height:${Math.max(m.v/maxV*100, m.v>0?4:2)}%;opacity:${m.v>0?.9:.18}" title="${fmtBRL(m.v)}"></div><div class="bar-label">${m.label}</div></div>`).join('')}</div>
    </div>`;
  }

  // inflation: compare first vs last non-promo price inside the SAME place, then average across places
  const inflation = cache.products.map(p=>{
    const perPlace = [];
    cache.places.forEach(pl=>{
      const rs = cache.prices.filter(r=>r.productId===p.id && r.placeId===pl.id && !r.isPromo).sort((a,b)=>a.date-b.date);
      if(rs.length<2) return;
      const first = rs[0], last = rs[rs.length-1];
      if(!(first.unitPrice>0) || last.date-first.date < 86400000) return; // need at least a day apart
      perPlace.push({pl, first, last, pct:(last.unitPrice-first.unitPrice)/first.unitPrice*100});
    });
    if(!perPlace.length) return null;
    return {p, perPlace, pct: perPlace.reduce((s,x)=>s+x.pct,0)/perPlace.length};
  }).filter(Boolean);
  const card = (d, up) => `<div class="card tap" onclick="showProductHistory('${d.p.id}')">
    <div class="row between" style="margin-bottom:6px">
      <div style="font-weight:600">${escapeHtml(d.p.name)}</div>
      <span class="chip ${up?'up':'down'}">${up?'+':''}${d.pct.toFixed(0)}%</span>
    </div>
    ${d.perPlace.slice(0,3).map(x=>`<div class="row between tiny"><span class="muted">${escapeHtml(x.pl.name)} · ${fmtShortDate(x.first.date)} → ${fmtShortDate(x.last.date)}</span><span class="num">${fmtBRL(x.first.unitPrice)} → <strong style="color:${x.pct>0?'var(--bad)':'var(--ok)'}">${fmtBRL(x.last.unitPrice)}</strong></span></div>`).join('')}
  </div>`;
  const inflated = inflation.filter(x=>x.pct>0.5).sort((a,b)=>b.pct-a.pct).slice(0,10);
  const deflated = inflation.filter(x=>x.pct<-0.5).sort((a,b)=>a.pct-b.pct).slice(0,6);
  if(inflated.length){ html += `<div class="section-head"><h2>Subiu de preço</h2><span class="tiny muted">mesmo local</span></div>`; inflated.forEach(d=>html+=card(d,true)); }
  if(deflated.length){ html += `<div class="section-head"><h2>Baixou de preço</h2></div>`; deflated.forEach(d=>html+=card(d,false)); }

  // cheapest places: latest price here vs cheapest latest elsewhere, same product
  const placeAvg = cache.places.map(pl=>{
    const diffs = [];
    cache.products.forEach(p=>{
      const latest = latestByPlace(p.id);
      const here = latest.find(r=>r.placeId===pl.id);
      const others = latest.filter(r=>r.placeId!==pl.id);
      if(!here || !others.length) return;
      const minOther = Math.min(...others.map(r=>r.unitPrice));
      if(minOther>0) diffs.push((here.unitPrice-minOther)/minOther*100);
    });
    return diffs.length ? {pl, avg:diffs.reduce((a,b)=>a+b,0)/diffs.length, n:diffs.length} : null;
  }).filter(Boolean).sort((a,b)=>a.avg-b.avg);
  if(placeAvg.length){
    html += `<div class="section-head"><h2>Locais mais econômicos</h2></div>`;
    placeAvg.slice(0,6).forEach(x=>{
      html += `<div class="card"><div class="row between">
        <div><div style="font-weight:600">${escapeHtml(x.pl.name)}</div><div class="tiny muted">${x.n} ${x.n===1?'produto comparado':'produtos comparados'} · vs. o mais barato de cada</div></div>
        <span class="chip ${x.avg<=0.5?'best':x.avg>5?'up':''}">${x.avg>0.5?'+'+x.avg.toFixed(0)+'%':'mais barato'}</span>
      </div></div>`;
    });
  }

  if(!html){
    html += `<div class="empty"><h3>Sem histórico ainda</h3><p>Os preços que você anotar e as compras encerradas aparecem aqui.</p></div>`;
  }

  // backup is always available (needed to restore on a fresh phone)
  html += `<div id="backup-card"></div>`;
  c.innerHTML = html;
  backupCardHtml().then(b=>{ const el = document.getElementById('backup-card'); if(el) el.innerHTML = b; });
};

window.showProductHistory = (productId) => {
  const p = productById(productId);
  const all = cache.prices.filter(r=>r.productId===productId && placeById(r.placeId)).sort((a,b)=>a.date-b.date);
  if(!p || !all.length) return toast('Sem histórico');
  const min = Math.min(...all.map(r=>r.unitPrice)), max = Math.max(...all.map(r=>r.unitPrice));
  const range = max-min || 1;
  const t0 = all[0].date, t1 = all[all.length-1].date, tRange = t1-t0 || 1;
  const colors = ['var(--accent)','var(--info)','var(--warn)','var(--promo)','var(--bad)','var(--ok)'];
  const byPlace = {}; all.forEach(r=>(byPlace[r.placeId]=byPlace[r.placeId]||[]).push(r));
  const color = {}; let ci = 0; let marks = '';
  const xy = r => [((r.date-t0)/tRange*92+4), (100-(r.unitPrice-min)/range*84-8)];
  Object.entries(byPlace).forEach(([pid, rs])=>{
    color[pid] = colors[ci++ % colors.length];
    if(rs.length>1) marks += `<polyline points="${rs.map(r=>xy(r).join(',')).join(' ')}" fill="none" stroke="${color[pid]}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    rs.forEach(r=>{ const [x,y] = xy(r); marks += `<circle cx="${x}" cy="${y}" r="1.6" fill="${r.isPromo?'var(--promo)':color[pid]}"/>`; });
  });
  openSheet(`
    <h3>${escapeHtml(p.name)}</h3>
    <div class="tiny muted" style="margin-top:-10px;margin-bottom:14px">Histórico em R$/${unitShort(p)}</div>
    <div class="chart">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:160px">${marks}</svg>
      <div class="chart-legend"><span>${fmtBRL(min)} → ${fmtBRL(max)}</span><span>${fmtDate(t0)} → ${fmtDate(t1)}</span></div>
    </div>
    <div style="margin-bottom:10px">${Object.keys(byPlace).map(pid=>`<div class="row" style="gap:8px;padding:3px 0;font-size:13px"><div style="width:10px;height:10px;border-radius:50%;background:${color[pid]}"></div><span>${escapeHtml(placeById(pid)?.name||'?')}</span></div>`).join('')}</div>
    <div class="section-head" style="margin-top:8px"><h2>Registros</h2><span class="tiny muted">toque pra editar</span></div>
    ${all.slice().reverse().map(r=>`<div class="list-item" onclick="editPrice('${r.id}')">
      <div class="row between">
        <div><div style="font-weight:600">${escapeHtml(placeById(r.placeId)?.name||'?')} ${r.isPromo?'<span class="chip promo tiny">promo</span>':''}</div>
        <div class="tiny muted">${fmtFullDate(r.date)}${r.note?' · '+escapeHtml(r.note):''}</div></div>
        <div class="num" style="font-weight:700">${fmtBRL(r.unitPrice)}/${unitShort(p)}</div>
      </div></div>`).join('')}
    <button class="btn full" style="margin-top:10px" onclick="closeSheet()">Fechar</button>`);
};

function empty(title, desc, btnText, btnFn){
  return `<div class="empty"><h3>${title}</h3><p>${desc}</p><button class="btn primary" onclick="${btnFn}">${btnText}</button></div>`;
}

/* ===================== BACKUP ===================== */
const BACKUP_NAME = 'feira-shin-backup.json';
const BACKUP_EVERY_DAYS = 6;
const canPickFile = () => 'showSaveFilePicker' in window;
async function metaGet(key, d=null){ try{ const r = await dbGet('meta', key); return r ? r.value : d; }catch(e){ return d; } }
async function metaSet(key, value){ try{ await dbPut('meta', {key, value}); }catch(e){} }
function backupBlob(){
  const data = {app:'feira-shin', version:SCHEMA, exportedAt:Date.now(),
    products:cache.products, places:cache.places, prices:cache.prices, lists:cache.lists};
  return new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
}
async function markBackup(){
  await metaSet('lastBackup', Date.now());
  await metaSet('backupSnooze', 0);
}
// Returns true when the backup went out.
//  - Chrome/Edge on computer: first time you pick the file, next times it overwrites the same file silently.
//  - iPhone/Android: opens the share sheet with a fixed name; "Salvar em Arquivos" in the same folder replaces it.
//  - otherwise: plain download.
window.exportData = async (opts={}) => {
  const blob = backupBlob();
  if(canPickFile()){
    try{
      let handle = opts.choose ? null : await metaGet('backupHandle');
      if(handle){
        let perm = await handle.queryPermission({mode:'readwrite'});
        if(perm!=='granted') perm = await handle.requestPermission({mode:'readwrite'});
        if(perm!=='granted') handle = null;
      }
      if(!handle){
        handle = await window.showSaveFilePicker({suggestedName:BACKUP_NAME, types:[{description:'Backup JSON', accept:{'application/json':['.json']}}]});
        await metaSet('backupHandle', handle);
      }
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
      await markBackup();
      toast(`Backup salvo em ${handle.name}`);
      rerenderIfHistory();
      return true;
    }catch(e){
      if(e.name==='AbortError') return false;
      // saved file was moved/deleted: forget it and fall back
      await metaSet('backupHandle', null);
    }
  }
  const file = new File([blob], BACKUP_NAME, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'Backup Feira'});
      await markBackup();
      toast('Backup enviado');
      rerenderIfHistory();
      return true;
    }catch(e){
      if(e.name==='AbortError') return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = BACKUP_NAME;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 500);
  await markBackup();
  toast('Backup baixado');
  rerenderIfHistory();
  return true;
};
const rerenderIfHistory = () => { if(currentTab()==='history') render.history(); };

async function checkBackupReminder(){
  if(SERVER_SYNC) return;
  if(!cache.products.length && !cache.lists.length) return;
  const last = await metaGet('lastBackup', 0);
  const snooze = await metaGet('backupSnooze', 0);
  if(Date.now() - last < BACKUP_EVERY_DAYS*86400000 || Date.now() < snooze) return;
  if(sheetBack.classList.contains('open')) return;
  const hasHandle = canPickFile() && !!(await metaGet('backupHandle'));
  const how = canPickFile()
    ? (hasHandle ? 'Vou substituir o arquivo de backup que você escolheu da última vez.' : 'Na primeira vez você escolhe onde salvar. Depois eu substituo o mesmo arquivo automaticamente.')
    : 'Vai abrir o menu de compartilhar: toque em <strong>Salvar em Arquivos</strong> e escolha a mesma pasta. O iPhone pergunta se quer substituir: toque em <strong>Substituir</strong>.';
  openSheet(`
    <h3>Hora do backup</h3>
    <p class="muted" style="margin:0 0 10px">Último backup: <strong>${last ? daysAgo(last) : 'nunca'}</strong>. Seus dados ficam só neste navegador: se ele for limpo, sem backup tudo se perde.</p>
    <div class="warn-banner">${how}</div>
    <div class="row" style="gap:8px">
      <button class="btn full" onclick="snoozeBackup()">Lembrar amanhã</button>
      <button class="btn primary full" onclick="closeSheet();exportData()">Salvar backup</button>
    </div>`);
}
window.snoozeBackup = async () => {
  await metaSet('backupSnooze', Date.now() + 86400000);
  closeSheet();
  toast('Lembro amanhã');
};
async function backupCardHtml(){
  const last = await metaGet('lastBackup', 0);
  const handle = canPickFile() ? await metaGet('backupHandle') : null;
  return `<div class="section-head"><h2>Dados</h2></div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:4px">Backup</div>
      <div class="tiny muted" style="margin-bottom:12px">${SERVER_SYNC
        ? `Versão ${APP_VERSION}. Os dados ficam no Umbrel e aparecem iguais em todos os aparelhos. O Umbrel guarda uma cópia por dia (últimos 30 dias). ${sync.lastOk?`Última conexão: ${daysAgo(sync.lastOk)==='hoje'?'agora há pouco':daysAgo(sync.lastOk)}. `:''}Exportar serve pra levar os dados pra fora. Fotos não entram.`
        : `Último: <strong>${last ? daysAgo(last) : 'nunca'}</strong>${handle?` · arquivo <strong>${escapeHtml(handle.name)}</strong>`:''}. Lembrete automático a cada ${BACKUP_EVERY_DAYS} dias. Fotos não entram no backup.`}</div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn sm primary" onclick="exportData()">Salvar backup</button>
        ${canPickFile()?`<button class="btn sm" onclick="exportData({choose:true})">Trocar arquivo</button>`:''}
        <button class="btn sm" onclick="importData()">Importar</button>
        <button class="btn sm danger" onclick="wipeAll()">Apagar tudo</button>
      </div>
    </div>`;
}
window.importData = () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const data = JSON.parse(await file.text());
      if(!Array.isArray(data.products)) throw new Error('arquivo não é um backup do app Feira');
      if(!confirm(`Importar ${data.products.length} produtos, ${data.places?.length||0} locais, ${data.prices?.length||0} preços e ${data.lists?.length||0} listas? Os dados atuais serão SUBSTITUÍDOS.`)) return;
      const clean = (data.version||1) < SCHEMA ? migrateData(data) : data;
      await replaceAll(clean);
      await dbPut('meta',{key:'schema', value:SCHEMA});
      ls.del('currentListId'); setListView('index');
      await reload();
      schedulePush(true);
      rerender();
      toast('Backup importado');
    }catch(err){ alert('Erro ao importar: '+err.message); }
  };
  input.click();
};
window.wipeAll = async () => {
  if(!confirm('Apagar TODOS os dados? Isso não pode ser desfeito.')) return;
  if(!confirm('Tem certeza? Faça um backup antes.')) return;
  for(const s of DATA_STORES) await dbClear(s);
  await dbClear('photos').catch(()=>{});
  ls.del('currentListId'); setListView('index');
  await reload();
  schedulePush(true);
  rerender();
  toast('Tudo apagado');
};

/* ===================== SINCRONIZAÇÃO COM O UMBREL ===================== */
// Only active in the Umbrel build (SERVER_SYNC = true). The phone keeps its own copy (IndexedDB) and
// exchanges the whole data set with the Umbrel server. The server keeps a version number (savedAt):
// a device only overwrites the server when it saw the latest version, so two devices never erase each other.
const SERVER_SYNC = true;
const sync = {rev:0, pushing:false, again:false, force:false, timer:null, online:null, lastOk:0, applying:false, pulling:false, lastPull:0};
function markDirty(store){
  if(!SERVER_SYNC || sync.applying || !DATA_STORES.includes(store)) return;
  sync.rev++;
  ls.set('syncDirty','1');
  schedulePush();
}
function schedulePush(force){
  if(!SERVER_SYNC) return;
  if(force) sync.force = true;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushServer, 700);
  setSyncStatus('saving');
}
async function snapshot(){
  const data = {app:'feira-shin', version:SCHEMA};
  for(const s of DATA_STORES) data[s] = await dbAll(s);
  return data;
}
const hasLocalData = () => cache.products.length || cache.places.length || cache.lists.length || cache.prices.length;
async function pushServer(){
  if(!SERVER_SYNC) return;
  if(sync.pushing){ sync.again = true; return; }
  sync.pushing = true;
  const startRev = sync.rev;
  const force = sync.force; sync.force = false;
  try{
    const base = Number(ls.get('syncBase','0')) || 0;
    const r = await fetch('api/state', {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({base, force, data: await snapshot()})});
    if(r.status===409){
      sync.pushing = false;
      return handleConflict(await r.json());
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    ls.set('syncBase', String(j.savedAt));
    if(sync.rev===startRev) ls.del('syncDirty');
    sync.lastOk = Date.now();
    setSyncStatus('ok');
  }catch(e){
    setSyncStatus('offline'); // stays marked as not sent; goes out on the next try
  }finally{
    sync.pushing = false;
    if(sync.again){ sync.again = false; schedulePush(); }
  }
}
async function fetchServer(){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 5000);
  try{
    const r = await fetch('api/state', {cache:'no-store', signal:ctrl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json(); // {savedAt, data} or null
  }finally{ clearTimeout(t); }
}
async function pullServer(){
  if(!SERVER_SYNC || sync.pulling) return;
  sync.pulling = true; sync.lastPull = Date.now();
  try{
    const j = await fetchServer();
    sync.lastOk = Date.now();
    const base = Number(ls.get('syncBase','0')) || 0;
    const dirty = ls.get('syncDirty')==='1';
    if(!j || !j.data){
      // server still empty: this device sends what it has
      if(hasLocalData()) schedulePush(); else setSyncStatus('ok');
      return;
    }
    if(j.savedAt===base){
      if(dirty) schedulePush(); else setSyncStatus('ok');
      return;
    }
    if(!dirty || !hasLocalData()) return await applyRemote(j, true);
    return handleConflict(j);
  }catch(e){
    setSyncStatus('offline');
  }finally{
    sync.pulling = false;
  }
}
async function applyRemote(j, quiet){
  sync.applying = true;
  try{
    const d = (j.data.version||1) < SCHEMA ? migrateData(j.data) : j.data;
    await replaceAll(d);
    await dbPut('meta',{key:'schema', value:SCHEMA});
  }finally{ sync.applying = false; }
  ls.set('syncBase', String(j.savedAt));
  ls.del('syncDirty');
  await reload();
  if(ls.get('currentListId') && !getCurrentList()) setListView('index');
  if(!sheetBack.classList.contains('open')) rerender();
  setSyncStatus('ok');
  if(!quiet) toast('Atualizado com o Umbrel');
}
function handleConflict(j){
  setSyncStatus('conflict');
  const when = j?.savedAt ? new Date(j.savedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '?';
  const pl = (n, one, many) => `${n} ${n===1?one:many}`;
  const count = d => `${pl((d?.lists||[]).length,'lista','listas')} · ${pl((d?.products||[]).length,'produto','produtos')} · ${pl((d?.prices||[]).length,'preço','preços')}`;
  window._syncConflict = j;
  openSheet(`
    <h3>Dados diferentes</h3>
    <p class="muted" style="margin:0 0 12px">Este aparelho tem alterações que ainda não foram pro Umbrel, e o Umbrel também mudou por outro aparelho. Escolha qual versão vale.</p>
    <div class="card"><div style="font-weight:700">Versão do Umbrel</div><div class="tiny muted">salva em ${when} · ${count(j?.data)}</div></div>
    <div class="card"><div style="font-weight:700">Versão deste aparelho</div><div class="tiny muted">${count(cache)}</div></div>
    <div class="col" style="gap:8px;margin-top:6px">
      <button class="btn primary full" onclick="resolveConflict('server')">Usar a do Umbrel</button>
      <button class="btn full" onclick="resolveConflict('local')">Manter a deste aparelho</button>
    </div>
    <div class="tiny muted" style="margin-top:10px">A outra versão é descartada. Se precisar recuperar algo, o Umbrel guarda uma cópia por dia.</div>`);
}
window.resolveConflict = async (which) => {
  const j = window._syncConflict;
  closeSheet();
  if(which==='server' && j) await applyRemote(j);
  else { ls.set('syncBase', String(j?.savedAt||0)); schedulePush(true); toast('Mantida a versão deste aparelho'); }
};
function setSyncStatus(s){
  if(!SERVER_SYNC) return;
  sync.online = s!=='offline';
  const el = document.querySelector('header.app .sub');
  if(!el) return;
  const txt = {
    ok: '<span class="sync-dot ok"></span>Sincronizado com o Umbrel',
    saving: '<span class="sync-dot saving"></span>Salvando no Umbrel…',
    offline: '<span class="sync-dot off"></span>Sem conexão com o Umbrel · salvo neste aparelho',
    conflict: '<span class="sync-dot off"></span>Escolha qual versão manter',
  }[s] || '';
  el.innerHTML = txt;
}
function setupServerSync(){
  if(!SERVER_SYNC) return;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && Date.now()-sync.lastPull > 3000) pullServer();
    if(document.visibilityState==='hidden' && ls.get('syncDirty')==='1') pushServer();
  });
  window.addEventListener('online', ()=>pullServer());
  // a light check every 30 s while the app is on screen
  setInterval(()=>{ if(document.visibilityState==='visible' && !sheetBack.classList.contains('open')) pullServer(); }, 30000);
}

const APP_VERSION = '1.0.1';
/* ===================== INIT ===================== */
(async () => {
  try{
    await openDB();
    await reload();
    if(SERVER_SYNC){ setSyncStatus('saving'); await pullServer(); setupServerSync(); }
  }catch(err){
    document.getElementById('list-container').innerHTML = `<div class="empty"><h3>Não consegui abrir o banco de dados</h3><p>${escapeHtml(err?.message||err)}</p></div>`;
    return;
  }
  if(!cache.products.length && !cache.places.length && !cache.lists.length && ls.get('seedAsked')!=='1'){
    ls.set('seedAsked','1');
    await new Promise(r=>setTimeout(r,300));
    if(confirm('Quer adicionar alguns produtos e locais de exemplo pra começar?')){
      const ex = [
        ['Arroz','mercearia','un',5,'kg'],['Feijão','mercearia','un',1,'kg'],['Óleo de soja','mercearia','un',900,'ml'],
        ['Café','mercearia','un',500,'g'],['Leite','laticinios','un',1,'L'],['Ovos (dúzia)','laticinios','un'],
        ['Tomate','hortifruti','kg'],['Cebola','hortifruti','kg'],['Banana','hortifruti','kg'],['Melão','hortifruti','kg'],
        ['Detergente','limpeza','un',500,'ml'],['Sabão em pó','limpeza','un',1.6,'kg'],
      ];
      for(const [name,category,sellBy,packSize,packUnit] of ex) await dbPut('products',{id:uid(),name,brand:'',category,sellBy,packSize:packSize||null,packUnit:packUnit||null});
      for(const [name,type] of [['Atacadão','atacarejo'],['Mercado do Bairro','mercado'],['Barraca da Feira','feira']]) await dbPut('places',{id:uid(),name,type,address:'',fairDay:null});
      await reload();
    }
  }
  switchTab('list');
  await cleanupPhotos();
  setTimeout(checkBackupReminder, 600);
})();
