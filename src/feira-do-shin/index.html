<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feira">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Feira</title>
<style>
:root{
  --bg:#0a0a0c;
  --surface:#131318;
  --surface-2:#1c1c24;
  --surface-3:#25252e;
  --border:#2a2a35;
  --text:#f0f0f5;
  --text-2:#9a9aa8;
  --text-3:#56565e;
  --accent:#b8f048;
  --accent-2:#87cf2e;
  --accent-glow:rgba(184,240,72,.18);
  --ok:#4ade80;
  --warn:#fbbf24;
  --bad:#f87171;
  --info:#60a5fa;
  --promo:#c084fc;
  --r:14px;
  --r-sm:10px;
  --r-lg:20px;
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --safe-bottom:env(safe-area-inset-bottom,0);
  --safe-top:env(safe-area-inset-top,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;overscroll-behavior-y:none}
body{padding-bottom:calc(150px + var(--safe-bottom));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input:not([type=checkbox]):not([type=radio]),select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;width:100%;outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface-3)}
input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
::placeholder{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums}

/* HEADER */
header.app{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(10,10,12,.95),rgba(10,10,12,.75));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:calc(12px + var(--safe-top)) 16px 12px;
}
header.app h1{
  margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;
  display:flex;align-items:baseline;gap:8px;
}
header.app h1 .mark{color:var(--accent)}
header.app .sub{font-size:12px;color:var(--text-2);margin-top:2px;letter-spacing:.02em}

/* TABS */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(13,13,17,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:8px 4px calc(8px + var(--safe-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
}
nav.tabs button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;border-radius:var(--r-sm);
  color:var(--text-3);font-size:10.5px;font-weight:600;letter-spacing:.02em;
  transition:color .15s;
}
nav.tabs button svg{width:22px;height:22px;stroke-width:1.8}
nav.tabs button.active{color:var(--accent)}
nav.tabs button:active{background:var(--surface-2)}

/* CONTENT */
main{padding:16px;max-width:760px;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* LIST TABS (multi-list selector) */
.list-tabs{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.list-tabs::-webkit-scrollbar{display:none}
.list-tab{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:9px 13px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);
  flex-shrink:0;min-width:80px;cursor:pointer;transition:all .15s;
  text-align:left;
}
.list-tab:active{transform:scale(.97)}
.list-tab.active{background:var(--accent-glow);border-color:var(--accent)}
.list-tab.active .list-tab-name{color:var(--accent)}
.list-tab.new-tab{align-items:center;justify-content:center;min-width:64px;color:var(--text-2)}
.list-tab-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.list-tab-meta{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:border-color .15s,transform .1s}
.card.tap:active{transform:scale(.99);border-color:var(--surface-3)}
.list-row{display:flex;align-items:center;padding:0;overflow:hidden}
.list-row-tap{flex:1;min-width:0;padding:13px 6px 13px 14px;cursor:pointer;transition:opacity .12s}
.list-row-tap:active{opacity:.7}
.list-row-right{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px;flex-shrink:0}
.icon-btn{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);background:transparent;cursor:pointer;
  transition:background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;outline:none;
}
.icon-btn:active{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:var(--r-sm);font-weight:600;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#0a0a0c;border-color:var(--accent)}
.btn.primary:active{background:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.3)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
.btn svg{width:16px;height:16px;stroke-width:2.2}

/* SECTIONS */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:18px 4px 10px;
}
.section-head h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
}
.chip.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.chip.cat-hortifruti{color:#86efac;border-color:rgba(134,239,172,.3)}
.chip.cat-acougue{color:#fca5a5;border-color:rgba(252,165,165,.3)}
.chip.cat-mercearia{color:#fdba74;border-color:rgba(253,186,116,.3)}
.chip.cat-limpeza{color:#7dd3fc;border-color:rgba(125,211,252,.3)}
.chip.cat-higiene{color:#c4b5fd;border-color:rgba(196,181,253,.3)}
.chip.cat-bebidas{color:#67e8f9;border-color:rgba(103,232,249,.3)}
.chip.cat-padaria{color:#fde047;border-color:rgba(253,224,71,.3)}
.chip.cat-laticinios{color:#fef08a;border-color:rgba(254,240,138,.3)}
.chip.cat-congelados{color:#a5f3fc;border-color:rgba(165,243,252,.3)}
.chip.cat-outro{color:var(--text-2)}
.chip.type-mercado{color:#86efac}
.chip.type-atacarejo{color:#fdba74}
.chip.type-feira{color:#fde047}
.chip.type-sacolao{color:#7dd3fc}
.chip.type-padaria{color:#fda4af}
.chip.type-outro{color:var(--text-2)}
.chip.promo{background:rgba(192,132,252,.12);color:var(--promo);border-color:rgba(192,132,252,.3)}
.promo-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-3);
  flex-shrink:0;cursor:pointer;transition:all .15s;
  font-family:inherit;outline:none;-webkit-tap-highlight-color:transparent;
}
.promo-chip:focus,.promo-chip:focus-visible{outline:none}
.promo-chip.active{background:rgba(192,132,252,.15);border-color:var(--promo);color:var(--promo)}
.promo-chip:active{transform:scale(.95)}
.chip.best{background:rgba(74,222,128,.12);color:var(--ok);border-color:rgba(74,222,128,.3)}
.chip.up{background:rgba(248,113,113,.1);color:var(--bad);border-color:rgba(248,113,113,.25)}
.chip.down{background:rgba(74,222,128,.1);color:var(--ok);border-color:rgba(74,222,128,.25)}

/* INPUT GROUPS */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* MODAL / SHEET */
.sheet-back{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
}
.sheet-back.open{display:flex;animation:fadeIn .15s ease}
.sheet{
  width:100%;max-width:760px;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  border-top:1px solid var(--border);
  max-height:92vh;overflow-y:auto;
  padding:8px 16px calc(20px + var(--safe-bottom));
  animation:slideUp .22s cubic-bezier(.2,.8,.2,1);
}
.sheet .grip{width:36px;height:4px;background:var(--surface-3);border-radius:2px;margin:8px auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:700}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:.5}to{transform:translateY(0);opacity:1}}

/* LIST ITEMS */
.list-item{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;margin-bottom:8px;
}
.list-item.checked{opacity:.55}
.list-item .title{font-weight:600;font-size:15px}
.list-item .meta{font-size:12px;color:var(--text-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list-item.product{cursor:pointer}
.list-item .price{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.list-item .price.best{color:var(--ok)}

/* CHECKBOX */
.check{
  width:26px;height:26px;border:2px solid var(--border);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);flex-shrink:0;transition:all .15s;
  position:relative;
}
.check::before{content:'';position:absolute;inset:-12px -14px -12px -12px}
.check.checked{background:var(--accent);border-color:var(--accent)}
.check.checked svg{display:block}
.check svg{display:none;width:14px;height:14px;color:#0a0a0c;stroke-width:3.5}

/* STATS */
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;display:flex;flex-direction:column;gap:4px;
}
.stat .label{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat .value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .delta{font-size:12px;font-weight:600}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* EMPTY STATE */
.empty{
  text-align:center;padding:40px 20px;color:var(--text-3);
}
.empty .icon{
  width:56px;height:56px;margin:0 auto 14px;
  border-radius:50%;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);
}
.empty h3{margin:0 0 6px;color:var(--text);font-size:16px}
.empty p{margin:0 0 16px;font-size:13.5px}

/* CHART */
.chart{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:10px;overflow:hidden;
}
.chart svg{display:block;width:100%;height:auto}
.chart-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:8px;font-variant-numeric:tabular-nums}

/* PRICE COMPARISON */
.price-row{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  padding:10px 0;border-top:1px solid var(--border);
  align-items:center;
}
.price-row:first-of-type{border-top:none;padding-top:0}
.price-row .place-name{font-weight:600}
.price-row .place-meta{font-size:11.5px;color:var(--text-3);margin-top:2px}
.price-row .price-info{text-align:right}
.price-row .price-info .main{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.price-row .price-info .perbase{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.price-row.best .price-info .main{color:var(--ok)}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));
  transform:translateX(-50%);z-index:200;
  background:var(--surface-3);color:var(--text);
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;
  border:1px solid var(--border);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* FAB */
.fab{
  position:fixed;right:16px;bottom:calc(88px + var(--safe-bottom));z-index:55;
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#0a0a0c;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px var(--accent-glow),0 4px 12px rgba(0,0,0,.3);
  transition:transform .12s;
}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;stroke-width:2.5}

/* MISC */
.muted{color:var(--text-2)}
.tiny{font-size:11.5px}
.tag-day{
  display:inline-block;padding:2px 8px;border-radius:6px;
  background:var(--surface-3);font-size:11px;font-weight:600;color:var(--text-2);
}
.divider{height:1px;background:var(--border);margin:14px 0}
.warn-banner{
  background:linear-gradient(135deg,rgba(184,240,72,.06),rgba(184,240,72,.02));
  border:1px solid rgba(184,240,72,.2);
  border-radius:var(--r);padding:12px 14px;margin-bottom:14px;
  font-size:13px;color:var(--text);
}
.warn-banner strong{color:var(--accent)}


/* ---- v2 additions ---- */
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper button{width:52px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);font-size:22px;font-weight:600;color:var(--text)}
.stepper button:active{background:var(--surface-3)}
.stepper input{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.quote-row{display:flex;align-items:center;padding:0;margin-bottom:6px;overflow:hidden}
.quote-row.selected{border-color:var(--accent);background:rgba(184,240,72,.06)}
.quote-tap{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 6px 11px 13px;cursor:pointer}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent)}
.link-btn{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:12px}
.menu-btn{margin-bottom:8px;justify-content:flex-start}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0}
.bar-label{font-size:10px;color:var(--text-3);margin-top:5px;white-space:nowrap}
.warn-banner{line-height:1.5}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--text-3)}
.sync-dot.ok{background:var(--ok)}
.sync-dot.saving{background:var(--warn)}
.sync-dot.off{background:var(--bad)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3);pointer-events:none}
.search-wrap #prod-search{padding-left:40px;padding-right:40px}
.search-wrap input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;color:var(--text-2);font-size:20px}
.cat-filter{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.cat-filter::-webkit-scrollbar{display:none}
.cart-head h2{color:var(--ok)}
.chip.type-hortifruti{color:#86efac}
.chip.type-acougue{color:#fca5a5}
.chip.type-farmacia{color:#7dd3fc}
.chip.type-petshop{color:#fdba74}
.chip.type-loja{color:#c4b5fd}
.chip.type-online{color:#67e8f9}
.mm-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-color:var(--accent);background:rgba(184,240,72,.06);margin-bottom:0}
.calc-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--accent);font-size:10.5px;font-weight:700;flex-shrink:0}
.calc-btn svg{width:22px;height:22px}
.calc-btn:active{background:var(--surface-2)}
.calc-opt{padding:12px}
.calc-label{font-weight:700;background:transparent;border-color:transparent;padding:6px 8px;margin-left:-8px}
.calc-label:focus{background:var(--surface-2)}
.stepper.sm{align-items:center}
.stepper.sm button{width:40px;height:36px;font-size:18px}
.stepper.sm span{min-width:30px;text-align:center;font-weight:800;font-size:16px}
.calc-best{border-color:var(--accent);background:rgba(184,240,72,.06)}
.calc-bar{height:8px;border-radius:4px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.calc-bar div{height:100%;border-radius:4px}
.check-row.ok{border-color:rgba(74,222,128,.45)}
.check-row.diff{border-color:rgba(248,113,113,.55)}
.chk-ok.on{background:rgba(74,222,128,.16);border-color:var(--ok);color:var(--ok)}
.chk-diff.on{background:rgba(248,113,113,.14);border-color:var(--bad);color:var(--bad)}
.check-progress{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.check-progress div{height:100%;background:var(--accent);transition:width .2s}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th{text-align:left;font-size:11px;color:var(--text-3);font-weight:600;padding:8px 4px;text-transform:uppercase;letter-spacing:.04em}
table.rep td{padding:8px 4px;border-top:1px solid var(--border);vertical-align:top}
table.rep td.num{text-align:right;white-space:nowrap}
.photo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.photo-row img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:zoom-in}
.photo-view{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.photo-view img{max-width:100%;max-height:85vh;border-radius:8px}
.chip{white-space:nowrap}
.meta .hint-line{flex-basis:100%;color:var(--text-3)}
</style>
</head>
<body>

<header class="app">
  <div class="row between" style="align-items:center">
    <div>
      <h1><span class="mark">●</span> Feira</h1>
      <div class="sub">lista, preços e histórico do seu bairro</div>
    </div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ===================== CONFIG ===================== */
const CATEGORIES = [
  {id:'hortifruti', name:'Hortifrúti'},
  {id:'acougue', name:'Açougue'},
  {id:'mercearia', name:'Mercearia'},
  {id:'laticinios', name:'Laticínios'},
  {id:'padaria', name:'Padaria'},
  {id:'bebidas', name:'Bebidas'},
  {id:'congelados', name:'Congelados'},
  {id:'limpeza', name:'Limpeza'},
  {id:'higiene', name:'Higiene'},
  {id:'outro', name:'Outro'},
];
const PLACE_TYPES = [
  {id:'mercado', name:'Mercado'},
  {id:'atacarejo', name:'Atacarejo'},
  {id:'feira', name:'Feira'},
  {id:'sacolao', name:'Sacolão'},
  {id:'hortifruti', name:'Hortifrúti'},
  {id:'acougue', name:'Açougue'},
  {id:'padaria', name:'Padaria'},
  {id:'farmacia', name:'Farmácia'},
  {id:'petshop', name:'Pet shop'},
  {id:'loja', name:'Loja'},
  {id:'online', name:'Online'},
  {id:'outro', name:'Outro'},
];
const placeTypeLabel = pl => (pl?.type==='outro' && pl.typeName) ? pl.typeName : (PLACE_TYPES.find(t=>t.id===pl?.type)?.name || 'Outro');
const WEEKDAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
// how a product is sold: price is always "R$ per one of these"
const SELL_UNITS = [
  {id:'kg', name:'Preço por kg'},
  {id:'L',  name:'Preço por litro'},
  {id:'un', name:'Preço do pacote / unidade'},
];
// optional package content (only for products sold by unit) to show R$/kg or R$/L
const PACK_UNITS = [
  {id:'un', base:'un', factor:1},
  {id:'m',  base:'m',  factor:1},
  {id:'g',  base:'kg', factor:0.001},
  {id:'kg', base:'kg', factor:1},
  {id:'ml', base:'L',  factor:0.001},
  {id:'L',  base:'L',  factor:1},
];
const SCHEMA = 2;

/* ===================== DB ===================== */
const DB_NAME = 'feira-shin';
const DB_VERSION = 2;
let db;

function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('products')){
        const s = d.createObjectStore('products',{keyPath:'id'});
        s.createIndex('name','name');
        s.createIndex('category','category');
      }
      if(!d.objectStoreNames.contains('places')){
        const s = d.createObjectStore('places',{keyPath:'id'});
        s.createIndex('name','name');
      }
      if(!d.objectStoreNames.contains('prices')){
        const s = d.createObjectStore('prices',{keyPath:'id'});
        s.createIndex('productId','productId');
        s.createIndex('placeId','placeId');
        s.createIndex('date','date');
      }
      if(!d.objectStoreNames.contains('lists')){
        const s = d.createObjectStore('lists',{keyPath:'id'});
        s.createIndex('status','status');
        s.createIndex('date','date');
      }
      if(!d.objectStoreNames.contains('meta')){
        d.createObjectStore('meta',{keyPath:'key'});
      }
      if(!d.objectStoreNames.contains('photos')){
        const s = d.createObjectStore('photos',{keyPath:'id'});
        s.createIndex('date','date');
      }
    };
    req.onsuccess = ()=>{db = req.result; res(db);};
    req.onerror = ()=>rej(req.error);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function req2promise(r){ return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }
const dbGet   = (store,key) => req2promise(tx(store).get(key));
const dbAll   = (store) => req2promise(tx(store).getAll());
const dbPut   = (store,obj) => { markDirty(store); return req2promise(tx(store,'readwrite').put(obj)); };
const dbDel   = (store,key) => { markDirty(store); return req2promise(tx(store,'readwrite').delete(key)); };
const dbClear = (store) => { markDirty(store); return req2promise(tx(store,'readwrite').clear()); };
const DATA_STORES = ['products','places','prices','lists'];

/* ===================== SAFE LOCAL STORAGE ===================== */
const ls = {
  get(k, d){ try{ const v = localStorage.getItem('feira-shin:'+k); return v==null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('feira-shin:'+k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem('feira-shin:'+k); }catch(e){} },
};

/* ===================== UTILS ===================== */
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const round2 = v => Math.round(v*100)/100;
const fmtBRL = v => (v==null||isNaN(v)) ? '—' : 'R$ '+v.toFixed(2).replace('.',',');
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const fmtFullDate = ts => new Date(ts).toLocaleDateString('pt-BR');
const fmtShortDate = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const daysAgo = ts => {
  const d = Math.floor((Date.now()-ts)/86400000);
  if(d<=0) return 'hoje';
  if(d===1) return 'ontem';
  if(d<30) return `há ${d} dias`;
  if(d<365){ const m = Math.floor(d/30); return `há ${m} ${m>1?'meses':'mês'}`; }
  const y = Math.floor(d/365); return `há ${y} ano${y>1?'s':''}`;
};
const escapeHtml = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// accepts "1,7", "1.7", "R$ 12,90", "1.234,56"
function parseNum(str){
  if(str==null) return NaN;
  let s = String(str).trim().replace(/[^\d.,-]/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  return parseFloat(s);
}
const numToInput = v => (v==null||isNaN(v)) ? '' : String(round2(v)).replace('.',',');
function fmtQty(q, sellBy){
  if(q==null || isNaN(q)) return '—';
  if(sellBy==='un') return String(Math.round(q*1000)/1000).replace('.',',');
  return (Math.round(q*1000)/1000).toString().replace('.',',');
}
const unitShort = p => p?.sellBy==='un' && p?.packSize ? 'pct' : (p?.sellBy || 'un');

function toast(msg){
  const t = document.getElementById('toast');
  t.style.pointerEvents = '';
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'),2400);
}

/* ===================== MIGRATION (v1 -> v2) ===================== */
const OLD_UNITS = {g:{f:0.001},kg:{f:1},ml:{f:0.001},L:{f:1},un:{f:1}};
function oldPerBase(r){
  const u = OLD_UNITS[r.packageUnit];
  if(!u || !r.packageSize || r.price==null) return null;
  const q = r.packageSize*u.f;
  return q>0 ? r.price/q : null;
}
function packBaseQty(p){
  if(!p || p.sellBy!=='un' || !p.packSize || !p.packUnit) return null;
  const u = PACK_UNITS.find(x=>x.id===p.packUnit);
  return u ? p.packSize*u.factor : null;
}
function packBaseUnit(p){
  const u = PACK_UNITS.find(x=>x.id===p?.packUnit);
  return u ? u.base : null;
}
function migrateData(data){
  const prodById = {};
  const products = (data.products||[]).map(p=>{
    if(p.sellBy){ prodById[p.id] = p; return p; }
    const unit = p.packageUnit || p.baseUnit || 'kg';
    const size = p.packageSize || 1;
    const np = {id:p.id, name:p.name, brand:p.brand||'', category:p.category||'outro'};
    if(unit==='un' || p.baseUnit==='un') np.sellBy = 'un';
    else if((unit==='kg'||unit==='L') && size===1) np.sellBy = unit;
    else { np.sellBy = 'un'; np.packSize = size; np.packUnit = unit; }
    prodById[p.id] = np;
    return np;
  });
  const toUnit = (prodId, perBase) => {
    const p = prodById[prodId];
    if(!p || perBase==null || isNaN(perBase)) return null;
    if(p.sellBy==='un'){ const q = packBaseQty(p); return q ? perBase*q : perBase; }
    return perBase;
  };
  const prices = (data.prices||[]).map(r=>{
    if(r.unitPrice!=null) return r;
    const u = toUnit(r.productId, oldPerBase(r));
    if(u==null) return null;
    return {id:r.id, productId:r.productId, placeId:r.placeId, unitPrice:round2(u), isPromo:!!r.isPromo, note:r.note||'', date:r.date||Date.now()};
  }).filter(Boolean);
  const latest = {};
  prices.forEach(r=>{ const k = r.productId+'|'+r.placeId; if(!latest[k] || latest[k].date < r.date) latest[k] = r; });
  const lists = (data.lists||[]).map(l=>{
    if(l.schema===SCHEMA) return l;
    const items = (l.items||[]).map(it=>{
      const p = prodById[it.productId];
      let qty = it.qty || 1;
      if(p && p.sellBy==='un'){ const q = packBaseQty(p); if(q) qty = Math.max(1, Math.round(qty/q)); }
      const ni = {id:uid(), productId:it.productId, qty, quotes:[], placeId:it.placeId||null, cart:null};
      if(l.status==='active'){
        Object.values(latest).filter(r=>r.productId===it.productId)
          .forEach(r=>ni.quotes.push({placeId:r.placeId, unitPrice:r.unitPrice, isPromo:!!r.isPromo, date:r.date}));
      }
      if(it.checked){
        const up = it.paidPrice!=null ? toUnit(it.productId, it.paidPrice) : null;
        ni.cart = {placeId:it.placeId||null, unitPrice: up!=null ? round2(up) : null, qty, date:l.date};
      }
      return ni;
    });
    return {id:l.id, name:l.name, date:l.date, status:l.status, finishedAt: l.status==='done' ? l.date : null, items, schema:SCHEMA};
  });
  return {products, places:data.places||[], prices, lists};
}
async function replaceAll(d){
  for(const s of DATA_STORES){
    await dbClear(s);
    for(const x of (d[s]||[])) await dbPut(s, x);
  }
}

/* ===================== STATE / CACHE ===================== */
const cache = {products:[], places:[], prices:[], lists:[]};
async function reload(){
  const meta = await dbGet('meta','schema');
  if(!meta || meta.value < SCHEMA){
    const raw = {};
    for(const s of DATA_STORES) raw[s] = await dbAll(s);
    if(raw.products.length || raw.prices.length || raw.lists.length){
      await replaceAll(migrateData(raw));
    }
    await dbPut('meta',{key:'schema', value:SCHEMA});
  }
  const [p, pl, pr, l] = await Promise.all(DATA_STORES.map(dbAll));
  // guard: every list item needs an id
  for(const list of l){
    let changed = false;
    (list.items||[]).forEach(it=>{ if(!it.id){ it.id = uid(); changed = true; } if(!it.quotes){ it.quotes = []; changed = true; } });
    if(changed) await dbPut('lists', list);
  }
  cache.products = p.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  cache.places = pl.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  cache.prices = pr.sort((a,b)=>b.date-a.date);
  cache.lists = l.sort((a,b)=>b.date-a.date);
}
const productById = id => cache.products.find(x=>x.id===id);
const placeById = id => cache.places.find(x=>x.id===id);
const listById = id => cache.lists.find(x=>x.id===id);
const findItem = (list, itemId) => (list?.items||[]).find(i=>i.id===itemId);

/* ===================== PRICE HELPERS ===================== */
function lastSeen(productId){
  return cache.prices.find(r=>r.productId===productId && placeById(r.placeId)) || null; // prices sorted newest first
}
function lastSeenAt(productId, placeId){
  return cache.prices.find(r=>r.productId===productId && r.placeId===placeId) || null;
}
function latestByPlace(productId){
  const out = {};
  cache.prices.forEach(r=>{
    if(r.productId!==productId || !placeById(r.placeId)) return;
    if(!out[r.placeId]) out[r.placeId] = r; // newest first
  });
  return Object.values(out).sort((a,b)=>a.unitPrice-b.unitPrice);
}
function perBaseHint(p, unitPrice){
  const q = packBaseQty(p);
  if(!q || unitPrice==null) return '';
  return `${fmtBRL(unitPrice/q)}/${packBaseUnit(p)}`;
}

/* ===================== LIST ITEM HELPERS ===================== */
function sortedQuotes(it){
  return (it.quotes||[]).filter(q=>q.unitPrice!=null && placeById(q.placeId)).slice().sort((a,b)=>a.unitPrice-b.unitPrice);
}
function activeQuote(it){
  const qs = sortedQuotes(it);
  if(it.placeId){ const q = qs.find(x=>x.placeId===it.placeId); if(q) return q; }
  return qs[0] || null;
}
function itemPlaceId(it){
  if(it.cart) return it.cart.placeId;
  const q = activeQuote(it);
  return q ? q.placeId : null;
}
function itemUnit(it){
  if(it.cart) return it.cart.unitPrice;
  const q = activeQuote(it);
  return q ? q.unitPrice : null;
}
function itemTotal(it){
  if(it.cart){
    if(it.cart.unitPrice==null) return null;
    return it.cart.unitPrice * (it.cart.qty||0) - discountValue(it.cart);
  }
  const q = activeQuote(it);
  return q ? q.unitPrice * (it.qty||0) : null;
}
const sumTotals = items => items.reduce((s,it)=> s + (itemTotal(it) ?? 0), 0);

/* ===================== SHEET (MODAL) ===================== */
const sheetBack = document.getElementById('sheet-back');
const sheetEl = document.getElementById('sheet');
let pressedOnOverlay = false;
sheetBack.addEventListener('mousedown', e => { pressedOnOverlay = (e.target === sheetBack); });
sheetBack.addEventListener('mouseup', e => { if (pressedOnOverlay && e.target === sheetBack) closeSheet(); pressedOnOverlay = false; });
sheetBack.addEventListener('touchstart', e => { pressedOnOverlay = (e.target === sheetBack); }, {passive:true});
sheetBack.addEventListener('touchend', e => {
  if (pressedOnOverlay && e.target === sheetBack){
    e.preventDefault(); // stops the browser's emulated click from hitting the item behind the overlay
    closeSheet();
  }
  pressedOnOverlay = false;
}, {passive:false});
function openSheet(html){
  sheetEl.innerHTML = '<div class="grip"></div>'+html;
  sheetBack.classList.add('open');
  document.body.style.overflow = 'hidden';
  sheetEl.scrollTop = 0;
}
function closeSheet(){
  sheetBack.classList.remove('open');
  document.body.style.overflow = '';
}
function bindChips(groupId, onChange){
  document.querySelectorAll(`#${groupId} .chip`).forEach(c => c.addEventListener('click', ()=>{
    document.querySelectorAll(`#${groupId} .chip`).forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    if(onChange) onChange(c.dataset.val);
  }));
}
const chipVal = groupId => document.querySelector(`#${groupId} .chip.active`)?.dataset.val;

/* ===================== TAB ROUTING ===================== */
const tabs = document.querySelectorAll('nav.tabs button');
tabs.forEach(b => b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
const currentTab = () => document.querySelector('nav.tabs button.active')?.dataset.tab || 'list';
function switchTab(name){
  tabs.forEach(b => b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id==='view-'+name));
  document.getElementById('fab').style.display = name==='history' ? 'none' : '';
  render[name]();
  window.scrollTo(0,0);
}
const rerender = () => render[currentTab()]();

document.getElementById('fab').addEventListener('click', ()=>{
  const t = currentTab();
  if(t==='list'){
    if(getListView()==='open' && getCurrentList()) addItemToList();
    else newList();
  }
  else if(t==='products') editProduct();
  else if(t==='places') editPlace();
});

/* ===================== LIST NAVIGATION ===================== */
function getListView(){ return ls.get('listView','index'); }
function setListView(v){ ls.set('listView', v==='open' ? 'open' : 'index'); }
function getCurrentList(){
  const id = ls.get('currentListId', null);
  return id ? (cache.lists.find(x=>x.id===id && x.status==='active') || null) : null;
}
window.openListById = (id) => {
  ls.set('currentListId', id);
  setListView('open');
  if(currentTab()!=='list') switchTab('list'); else render.list();
  window.scrollTo(0,0);
};
window.backToIndex = () => {
  setListView('index');
  render.list();
  window.scrollTo(0,0);
};
function reuseName(name){
  const base = String(name||'Lista').replace(/\s*\(cópia\)/gi,'').replace(/\s*·\s*\d{2}\/\d{2}$/,'').trim() || 'Lista';
  return `${base} · ${fmtShortDate(Date.now())}`;
}
function freshItemsFrom(src){
  // same products and quantities, no prices: you quote again
  return (src.items||[]).filter(it=>productById(it.productId)).map(it => ({
    id:uid(), productId:it.productId, qty: it.cart?.qty ?? it.qty ?? 1, quotes:[], placeId:null, cart:null,
  }));
}
window.reuseList = async (id) => {
  const src = listById(id);
  if(!src) return;
  const obj = {id:uid(), name:reuseName(src.name), date:Date.now(), status:'active', items:freshItemsFrom(src), schema:SCHEMA};
  await dbPut('lists', obj);
  await reload();
  closeSheet();
  toast('Lista reaproveitada, sem preços');
  openListById(obj.id);
};

/* ===================== RENDER ===================== */
const render = {};

render.list = () => {
  const c = document.getElementById('list-container');
  const current = getCurrentList();
  if(getListView()==='index' || !current) return renderListIndex(c);

  const items = current.items || [];
  const total = sumTotals(items);
  const cartItems = items.filter(it=>it.cart);
  const totalCart = sumTotals(cartItems);
  const unquoted = items.filter(it=>!it.cart && !activeQuote(it)).length;

  let html = `
    <div class="row" style="gap:10px;align-items:center;margin-bottom:12px">
      <button class="btn sm ghost" onclick="backToIndex()" style="padding:7px 12px;flex-shrink:0" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(current.name)}</div>
        <div class="tiny muted">${fmtFullDate(current.date)} · ${cartItems.length}/${items.length} no carrinho</div>
      </div>
      <button class="btn sm" onclick="listMenu()" style="flex-shrink:0" aria-label="Opções">···</button>
    </div>`;
  const mm = mmFor(current);
  if(mm){
    c.innerHTML = html + renderMarketMode(current, mm);
    return;
  }
  html += `
    <div class="row" style="gap:8px;margin-bottom:14px">
      <button class="btn sm full" onclick="pickMarketMode('${current.id}')">📍 Estou no mercado</button>
      <button class="btn sm full" onclick="suggestBestPlaces()">Onde comprar</button>
    </div>
    <div class="stats-grid" style="margin-bottom:14px">
      <div class="stat">
        <div class="label">Estimado</div>
        <div class="value">${fmtBRL(total)}</div>
        ${unquoted?`<div class="delta" style="color:var(--text-3)">${unquoted} sem preço</div>`:''}
      </div>
      <div class="stat">
        <div class="label">No carrinho</div>
        <div class="value" style="color:var(--accent)">${fmtBRL(totalCart)}</div>
      </div>
    </div>
  `;

  const groupBy = ls.get('groupBy','place');
  if(items.length){
    html += `<div class="chips" style="margin-bottom:12px">
      <div class="chip ${groupBy==='place'?'active':''}" onclick="setListGroupBy('place')">por mercado</div>
      <div class="chip ${groupBy==='category'?'active':''}" onclick="setListGroupBy('category')">por categoria</div>
    </div>`;
  }

  const todo = items.filter(it=>!it.cart);
  const inCartItems = items.filter(it=>it.cart);
  if(!items.length){
    html += `<div class="empty"><h3>Lista vazia</h3><p>Adicione produtos pra começar.</p><button class="btn primary" onclick="addItemToList()">Adicionar produto</button></div>`;
  } else if(!todo.length){
    html += `<div class="warn-banner">Tudo no carrinho. Quando terminar, toque em <strong>Encerrar compra</strong>.</div>`;
  } else if(groupBy==='place'){
    const byPlace = {}; const noprice = [];
    todo.forEach(it=>{
      const pid = itemPlaceId(it);
      if(pid && placeById(pid)) (byPlace[pid]=byPlace[pid]||[]).push(it);
      else noprice.push(it);
    });
    Object.keys(byPlace)
      .sort((a,b)=>placeById(a).name.localeCompare(placeById(b).name,'pt-BR'))
      .forEach(pid => {
        const place = placeById(pid);
        const gi = byPlace[pid];
        const tipo = {id: PLACE_TYPES.some(t=>t.id===place.type) ? place.type : 'outro', name: placeTypeLabel(place)};
        html += `<div class="section-head">
          <h2>${escapeHtml(place.name)}</h2>
          <div class="row" style="gap:6px;align-items:center">
            ${tipo?`<span class="chip type-${tipo.id} tiny" style="padding:1px 7px">${tipo.name}</span>`:''}
            <span class="tiny muted num">${gi.length} ${gi.length===1?'falta':'faltam'} · ${fmtBRL(sumTotals(gi))}</span>
          </div>
        </div>`;
        gi.forEach(it => html += renderListItem(it, current, 'place'));
      });
    if(noprice.length){
      html += `<div class="section-head"><h2 style="color:var(--text-3)">Sem preço</h2><span class="tiny muted">${noprice.length}</span></div>`;
      noprice.forEach(it => html += renderListItem(it, current, 'place'));
    }
  } else {
    const byCat = {};
    todo.forEach(it=>{ const cat = productById(it.productId)?.category || 'outro'; (byCat[cat]=byCat[cat]||[]).push(it); });
    CATEGORIES.forEach(cat => {
      if(!byCat[cat.id]) return;
      html += `<div class="section-head"><h2>${cat.name}</h2><span class="tiny muted">${byCat[cat.id].length} ${byCat[cat.id].length===1?'item':'itens'}</span></div>`;
      byCat[cat.id].forEach(it => html += renderListItem(it, current, 'category'));
    });
  }
  if(inCartItems.length){
    html += `<div class="section-head cart-head"><h2>✓ No carrinho</h2><span class="tiny muted num">${inCartItems.length} · ${fmtBRL(totalCart)}</span></div>`;
    inCartItems.slice().sort((a,b)=>(b.cart.date||0)-(a.cart.date||0)).forEach(it => html += renderListItem(it, current, 'category'));
  }

  if(items.length){
    html += `<button class="btn ghost full" style="margin-top:10px" onclick="addItemToList()">+ Adicionar item</button>`;
    html += `<button class="btn primary full" style="margin-top:8px" onclick="finishList()">Encerrar compra</button>`;
  }
  c.innerHTML = html;
};

function renderListItem(it, list, groupBy){
  const p = productById(it.productId);
  if(!p) return `<div class="list-item"><div class="row between"><span class="muted">Produto excluído</span><button class="btn sm danger" onclick="removeListItem('${list.id}','${it.id}')">Remover</button></div></div>`;
  const qs = sortedQuotes(it);
  const total = itemTotal(it);
  const unit = itemUnit(it);
  const inCart = !!it.cart;
  const qty = inCart ? it.cart.qty : it.qty;
  let meta = `<span>${fmtQty(qty, p.sellBy)} ${unitShort(p)}</span>`;
  if(!inCart && !qs.length && (it.unavailable||[]).length){
    meta += `<span class="hint-line">não tem em ${(it.unavailable||[]).map(id=>escapeHtml(placeById(id)?.name||'')).join(', ')}</span>`;
  } else if(!inCart && !qs.length){
    const last = lastSeen(p.id);
    meta += last
      ? `<span class="hint-line">último ${fmtBRL(last.unitPrice)}/${unitShort(p)} em ${escapeHtml(placeById(last.placeId)?.name||'')}, ${daysAgo(last.date)}</span>`
      : `<span class="hint-line">toque pra anotar preço</span>`;
  } else if(!inCart && qs.length>1){
    meta += `<span class="chip tiny" style="padding:1px 7px">${qs.length} preços</span>`;
  }
  if(groupBy==='category'){
    const pid = itemPlaceId(it);
    if(pid) meta += `<span>· ${escapeHtml(placeById(pid)?.name||'')}</span>`;
  }
  if(inCart && it.cart.unitPrice==null) meta += `<span class="chip tiny">sem preço</span>`;
  if(inCart && discountValue(it.cart)>0) meta += `<span class="chip best tiny" style="padding:1px 7px">−${fmtBRL(discountValue(it.cart))}</span>`;
  if(inCart && it.cart.photoId) meta += `<span title="tem foto">📷</span>`;
  const right = total!=null
    ? `<div class="price ${inCart?'best':''}">${fmtBRL(total)}</div><div class="tiny muted num" style="text-align:right;font-weight:500">${fmtBRL(unit)}/${unitShort(p)}</div>`
    : `<div class="chip" style="padding:5px 12px">Orçar</div>`;
  return `
    <div class="list-item ${inCart?'checked':''}" onclick="openListItem('${list.id}','${it.id}')">
      <div class="row between">
        <div class="row" style="gap:12px;flex:1;min-width:0">
          <button class="check ${inCart?'checked':''}" onclick="event.stopPropagation();toggleCart('${list.id}','${it.id}')" aria-label="${inCart?'Tirar do carrinho':'Pôr no carrinho'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </button>
          <div style="flex:1;min-width:0">
            <div class="title">${escapeHtml(p.name)}${p.brand?` <span class="muted tiny">· ${escapeHtml(p.brand)}</span>`:''}</div>
            <div class="meta">${meta}</div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">${right}</div>
      </div>
    </div>`;
}

function renderListIndex(container){
  const activeLists = cache.lists.filter(l=>l.status==='active').sort((a,b)=>b.date-a.date);
  const doneLists = cache.lists.filter(l=>l.status==='done').sort((a,b)=>(b.finishedAt||b.date)-(a.finishedAt||a.date));
  const dots = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`;
  let html = `
    <div class="row between" style="margin-bottom:14px;align-items:flex-start">
      <div>
        <div style="font-size:20px;font-weight:800;letter-spacing:-.01em">Minhas listas</div>
        <div class="tiny muted">${activeLists.length} em andamento · ${doneLists.length} encerrada${doneLists.length===1?'':'s'}</div>
      </div>
      <button class="btn primary sm" onclick="newList()">+ Nova lista</button>
    </div>`;
  if(!activeLists.length && !doneLists.length){
    html += `<div class="empty">
      <h3>Sem listas ainda</h3>
      <p>Crie sua primeira lista pra começar a orçar.</p>
      <button class="btn primary" onclick="newList()">Nova lista</button>
    </div>`;
    container.innerHTML = html;
    return;
  }
  if(activeLists.length){
    html += `<div class="section-head"><h2>Em andamento</h2><span class="tiny muted">${activeLists.length}</span></div>`;
    activeLists.forEach(l=>{
      const items = l.items||[];
      const inCart = items.filter(i=>i.cart).length;
      const total = sumTotals(items);
      html += `<div class="card list-row">
        <div class="list-row-tap" onclick="openListById('${l.id}')">
          <div style="font-weight:600">${escapeHtml(l.name)}</div>
          <div class="tiny muted">${fmtFullDate(l.date)} · ${items.length} ${items.length===1?'item':'itens'}${inCart?` · ${inCart} no carrinho`:''}</div>
          ${listCheckBadge(l)?`<div style="margin-top:6px">${listCheckBadge(l)}</div>`:''}
        </div>
        <div class="list-row-right">
          ${total>0?`<div class="num" style="font-weight:700;font-size:15px">${fmtBRL(total)}</div>`:''}
          <button class="icon-btn" onclick="openListActionMenu('${l.id}')" aria-label="Opções">${dots}</button>
        </div>
      </div>`;
    });
  }
  if(doneLists.length){
    html += `<div class="section-head" style="margin-top:18px"><h2>Encerradas</h2><span class="tiny muted">${doneLists.length}</span></div>`;
    doneLists.slice(0,30).forEach(l=>{
      const bought = (l.items||[]).filter(i=>i.cart);
      html += `<div class="card list-row">
        <div class="list-row-tap" onclick="openOldList('${l.id}')">
          <div style="font-weight:600">${escapeHtml(l.name)}</div>
          <div class="tiny muted">${fmtFullDate(l.finishedAt||l.date)} · ${bought.length} comprado${bought.length===1?'':'s'}</div>
          ${listCheckBadge(l)?`<div style="margin-top:6px">${listCheckBadge(l)}</div>`:''}
        </div>
        <div class="list-row-right">
          <div class="num" style="font-weight:700">${fmtBRL(sumTotals(bought))}</div>
          <button class="icon-btn" onclick="openListActionMenu('${l.id}')" aria-label="Opções">${dots}</button>
        </div>
      </div>`;
    });
  }
  container.innerHTML = html;
}

function renderAddResults(){
  const list = getCurrentList();
  const listEl = document.getElementById('f-prodlist');
  const inputEl = document.getElementById('f-search');
  if(!list || !listEl) return;
  const q = inputEl.value.trim();
  const ql = q.toLowerCase();
  const inList = new Set((list.items||[]).map(i=>i.productId));
  const matches = cache.products.filter(p => !ql || p.name.toLowerCase().includes(ql) || (p.brand||'').toLowerCase().includes(ql));
  const exact = cache.products.some(p=>p.name.toLowerCase()===ql);
  let html = '';
  if(q && !exact){
    html += `<div class="list-item" onclick="createProductFromSearch()">
      <div class="row between"><div><div style="font-weight:600;color:var(--accent)">+ Cadastrar "${escapeHtml(q)}"</div><div class="tiny muted">novo produto, já entra na lista</div></div></div>
    </div>`;
  }
  if(!matches.length && !q) html += `<div class="empty tiny">Nenhum produto cadastrado ainda. Digite o nome acima.</div>`;
  html += matches.map(p => {
    const already = inList.has(p.id);
    const last = lastSeen(p.id);
    return `<div class="list-item" ${already?'':`onclick="addProductToList('${p.id}')"`} style="${already?'opacity:.45':''}">
      <div class="row between">
        <div style="min-width:0">
          <div style="font-weight:600">${escapeHtml(p.name)}${p.brand?` <span class="muted tiny">· ${escapeHtml(p.brand)}</span>`:''}</div>
          <div class="tiny muted">${CATEGORIES.find(c=>c.id===p.category)?.name||''} · ${SELL_UNITS.find(s=>s.id===p.sellBy)?.name||''}${last?` · último ${fmtBRL(last.unitPrice)}`:''}</div>
        </div>
        ${already?'<span class="chip tiny">na lista ✓</span>':'<span style="color:var(--accent);font-size:24px;font-weight:300;padding:0 4px">+</span>'}
      </div>
    </div>`;
  }).join('');
  listEl.innerHTML = html;
}

function qtyField(p, value, id='f-iqty'){

      <div class="stepper">
        <button type="button" onclick="stepQty('${id}',-1)" aria-label="Menos">−</button>
        <input id="${id}" type="text" inputmode="numeric" value="${fmtQty(value,'un')}">
        <button type="button" onclick="stepQty('${id}',1)" aria-label="Mais">+</button>
      </div></div>`;
  }
  const u = p.sellBy==='L' ? 'L' : 'kg';
  return `<div class="field"><label>${u==='kg'?'Peso':'Volume'} (${u})</label>
    <input id="${id}" type="text" inputmode="decimal" value="${fmtQty(value,u)}" placeholder="Ex: 1,7">
    <div class="hint">${u==='kg'?'Ex: melão de 1,7 kg → digite 1,7. O total é peso × preço do kg.':'Ex: 1,5 L → digite 1,5.'}</div>

}
window.stepQty = (id, d) => {
  const el = document.getElementById(id);
  const v = parseNum(el.value);
  el.value = String(Math.max(1, Math.round((isNaN(v)?1:v)+d)));
  el.dispatchEvent(new Event('input'));
};
function readQty(id='f-iqty'){
  const v = parseNum(document.getElementById(id)?.value);
  return v>0 ? v : null;
}
async function saveQtyFromSheet(item){
  const q = readQty();

  const p = productById(item.productId);
  if(!p) return;
  const u = unitShort(p);

  const quoted = new Set(qs.map(q=>q.placeId));
  const mmNow = mmFor(list);
  const defaultPlace = (mmNow && placeById(mmNow.placeId)) || cache.places.find(pl=>!quoted.has(pl.id) && !isUnavailable(item, pl.id)) || cache.places[0];
  const missingAt = (item.unavailable||[]).map(placeById).filter(Boolean);
  const last = defaultPlace ? lastSeenAt(p.id, defaultPlace.id) : null;
  const done = list.status!=='active';

  const quotesHtml = qs.length ? qs.map((q,i)=>{
    const pl = placeById(q.placeId);
    const sel = active && active.placeId===q.placeId;
    const hint = perBaseHint(p, q.unitPrice);
    return `<div class="card quote-row ${sel?'selected':''}">
      <div class="quote-tap" onclick="selectQuotePlace('${listId}','${itemId}','${q.placeId}')">

// Save one observed price: updates the list quote and records it in the global history.
async function upsertQuote(list, item, placeId, unitPrice, isPromo){
  const now = Date.now();
  const prev = (item.quotes||[]).find(q=>q.placeId===placeId);
  // same place re-entered on the same day = correction: replace the history record instead of duplicating
  if(prev?.priceId && new Date(prev.date).toDateString()===new Date(now).toDateString()){
    await dbDel('prices', prev.priceId);
  }
  const rec = {id:uid(), productId:item.productId, placeId, unitPrice:round2(unitPrice), isPromo:!!isPromo, note:'', date:now, listId:list.id};
  await dbPut('prices', rec);
  item.quotes = (item.quotes||[]).filter(q=>q.placeId!==placeId);
  item.quotes.push({placeId, unitPrice:rec.unitPrice, isPromo:rec.isPromo, date:now, priceId:rec.id});
  item.unavailable = (item.unavailable||[]).filter(x=>x!==placeId);
}

window.addQuote = async (listId, itemId) => {
  const list = listById(listId);
  const item = findItem(list, itemId);

  const placeId = document.getElementById('f-qplace').value;
  const price = parseNum(document.getElementById('f-qprice').value);
  if(!(price>0)) return toast('Digite o preço');
  const isPromo = document.getElementById('f-qpromo').classList.contains('active');
  await saveQtyFromSheet(item);
  await upsertQuote(list, item, placeId, price, isPromo);
  await dbPut('lists', list);

  render.list();
  openListItem(listId, itemId);
  toast(`Preço anotado: ${fmtBRL(price)}`);
};
window.removeQuote = async (listId, itemId, placeId) => {
  const list = listById(listId);
  const item = findItem(list, itemId);
  if(!item) return;
  const q = (item.quotes||[]).find(x=>x.placeId===placeId);
  if(!q) return;
  if(!confirm(`Remover o preço de ${placeById(placeId)?.name||'este local'} desta lista?`)) return;
  if(q.priceId) await dbDel('prices', q.priceId); // typo or wrong entry: drop it from history too
  await saveQtyFromSheet(item);
  item.quotes = item.quotes.filter(x=>x.placeId!==placeId);
  if(item.placeId===placeId) item.placeId = null;
  await dbPut('lists', list);
  await reload();
  render.list();
  openListItem(listId, itemId);
};

function discountValue(cart){
  if(!cart || !cart.discount || !(cart.discount.value>0) || cart.unitPrice==null) return 0;
  const sub = cart.unitPrice * (cart.qty||0);
  const v = cart.discount.type==='pct' ? sub*cart.discount.value/100 : cart.discount.value;
  return Math.min(round2(v), round2(sub));
}

function toastUndo(msg, undo){
  const t = document.getElementById('toast');
  t.innerHTML = `${escapeHtml(msg)} <button type="button" class="link-btn" style="margin-left:8px;font-size:13px">Desfazer</button>`;
  t.style.pointerEvents = 'auto';
  t.querySelector('button').onclick = async ()=>{ t.classList.remove('show'); await undo(); };
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.classList.remove('show'); t.style.pointerEvents = ''; }, 4000);
  t.querySelector('button').addEventListener('click', ()=>{ t.style.pointerEvents = ''; });
}

const photoUrls = {};
async function photoUrl(id){
  if(photoUrls[id]) return photoUrls[id];
  const rec = await dbGet('photos', id).catch(()=>null);
  if(!rec?.blob) return null;
  return (photoUrls[id] = URL.createObjectURL(rec.blob));
}
// shrink camera photos so a week of them stays small (≈150–300 KB each)
function resizeImage(file, max=1400, quality=0.72){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('falha ao processar a foto')), 'image/jpeg', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('não consegui abrir a foto')); };
    img.src = url;
  });
}
window.onCartPhoto = async (input) => {

/* ===================== RECEIPT CHECK (conferência do cupom) ===================== */
// list.checks[placeId] = {items:{[itemId]:{status:'ok'|'diff', charged:number|null}}, extras:[{id,name,value}], receiptTotal, resolved, date}
const cartItemsAt = (list, placeId) => (list.items||[]).filter(it=>it.cart && it.cart.placeId===placeId && productById(it.productId));
function cartPlaces(list){
  const ids = [...new Set((list.items||[]).filter(it=>it.cart && it.cart.placeId).map(it=>it.cart.placeId))];
  return ids.filter(placeById);
}
function getCheck(list, placeId){
  list.checks = list.checks || {};
  return list.checks[placeId] = list.checks[placeId] || {items:{}, extras:[], receiptTotal:null, resolved:false, date:Date.now()};
}
function checkSummary(list, placeId){
  const ch = list.checks?.[placeId];
  const items = cartItemsAt(list, placeId);
  const rows = items.map(it=>{
    const c = ch?.items?.[it.id];
    const expected = round2(itemTotal(it) ?? 0);
    const charged = c?.status==='diff' && c.charged!=null ? round2(c.charged) : (c?.status==='ok' ? expected : null);
    return {it, p:productById(it.productId), status:c?.status||null, expected, charged, diff: charged!=null ? round2(charged-expected) : 0};
  });
  const extras = (ch?.extras||[]).filter(x=>x.value>0);
  const over = rows.filter(r=>r.diff>0.004);
  const under = rows.filter(r=>r.diff<-0.004);
  const toCharge = round2(over.reduce((s,r)=>s+r.diff,0) + extras.reduce((s,x)=>s+x.value,0));
  const inFavor = round2(-under.reduce((s,r)=>s+r.diff,0));
  const expectedTotal = round2(rows.reduce((s,r)=>s+r.expected,0));
  const done = rows.filter(r=>r.status).length;
  return {rows, extras, over, under, toCharge, inFavor, expectedTotal, done, total:rows.length,
    receiptTotal: ch?.receiptTotal ?? null, resolved: !!ch?.resolved, started: !!ch};
}
// overall badge for the lists index
function listCheckBadge(list){
  const places = cartPlaces(list);
  if(!places.length) return '';
  let toCharge = 0, allDone = true, anyStarted = false, open = false;
  places.forEach(pid=>{
    const s = checkSummary(list, pid);
    if(s.started) anyStarted = true;
    if(s.done < s.total) allDone = false;
    if(s.toCharge>0 && !s.resolved){ toCharge += s.toCharge; open = true; }
  });
  if(open) return `<span class="chip up tiny">${fmtBRL(toCharge)} a cobrar</span>`;
  if(anyStarted && allDone) return `<span class="chip best tiny">cupom conferido</span>`;
  return '';
}

window.openCheck = (listId, placeId) => {

  if(!list) return;
  const places = cartPlaces(list);

          <div><div style="font-weight:600">${escapeHtml(placeById(pid).name)}</div>
          <div class="tiny muted">${s.done}/${s.total} conferidos · ${fmtBRL(s.expectedTotal)}</div></div>
          ${s.toCharge>0?`<span class="chip up tiny">${fmtBRL(s.toCharge)}</span>`:(s.done===s.total&&s.started?'<span class="chip best tiny">ok</span>':'')}

function diffText(diff){
  if(diff==null) return '<span class="muted">Digite o valor do cupom</span>';
  if(diff>0.004) return `<strong style="color:var(--bad)">Cobrou ${fmtBRL(diff)} a mais</strong>`;
  if(diff<-0.004) return `<strong style="color:var(--ok)">Cobrou ${fmtBRL(-diff)} a menos</strong>`;
  return '<span style="color:var(--ok)">Igual ao esperado</span>';
}
window.previewDiff = (input, expected) => {
  const v = parseNum(input.value);
  const line = input.parentElement.querySelector('.diff-line');
  if(line) line.innerHTML = diffText(v>=0 ? round2(v-expected) : null);
};
async function saveCheck(list){
  await dbPut('lists', list);
  await reload();
  rerender();
}
window.setCheck = async (listId, placeId, itemId, status) => {
  const list = listById(listId);
  const ch = getCheck(list, placeId);
  const cur = ch.items[itemId] || {};
  ch.items[itemId] = {status: cur.status===status ? null : status, charged: status==='diff' ? (cur.charged ?? null) : null};
  if(!ch.items[itemId].status) delete ch.items[itemId];
  ch.resolved = false;
  await saveCheck(list);
  renderCheck(listId, placeId, true);
  if(status==='diff' && ch.items[itemId]) document.querySelector(`#chk-${itemId} input`)?.focus();
};
window.setCharged = async (listId, placeId, itemId, value) => {
  const list = listById(listId);
  const ch = getCheck(list, placeId);
  const v = parseNum(value);
  ch.items[itemId] = {status:'diff', charged: v>=0 ? round2(v) : null};
  await saveCheck(list);
};
window.addExtra = async (listId, placeId) => {
  const list = listById(listId);
  const ch = getCheck(list, placeId);
  ch.extras = ch.extras || [];
  ch.extras.push({id:uid(), name:'', value:null});
  await saveCheck(list);
  renderCheck(listId, placeId, true);
  const inputs = sheetEl.querySelectorAll('input[placeholder="Descrição"]');

};
window.setExtra = async (listId, placeId, id, field, value) => {
  const list = listById(listId);
  const x = (getCheck(list, placeId).extras||[]).find(e=>e.id===id);
  if(!x) return;
  if(field==='value'){ const v = parseNum(value); x.value = v>0 ? round2(v) : null; }
  else x.name = value.trim();
  await saveCheck(list);
};
window.removeExtra = async (listId, placeId, id) => {
  const list = listById(listId);
  const ch = getCheck(list, placeId);
  ch.extras = (ch.extras||[]).filter(e=>e.id!==id);
  await saveCheck(list);
  renderCheck(listId, placeId, true);
};
window.setReceiptTotal = async (listId, placeId, value) => {
  const list = listById(listId);
  const v = parseNum(value);
  getCheck(list, placeId).receiptTotal = v>0 ? round2(v) : null;

      <div class="card" style="padding:4px 10px;overflow-x:auto"><table class="rep"><thead><tr><th>Item</th><th>Esperado</th><th>Cupom</th><th>Dif.</th></tr></thead><tbody>${s.over.map(row).join('')}</tbody></table></div>`:''}
    ${s.extras.length?`<div class="section-head"><h2>Cobrado sem ter levado</h2></div>
      <div class="card">${s.extras.map(x=>`<div class="row between" style="padding:4px 0"><span>${escapeHtml(x.name||'Item sem descrição')}</span><strong class="num" style="color:var(--bad)">+${fmtBRL(x.value)}</strong></div>`).join('')}</div>`:''}
    ${s.under.length?`<div class="section-head"><h2>Cobrado abaixo</h2></div>
      <div class="card" style="padding:4px 10px;overflow-x:auto"><table class="rep"><tbody>${s.under.map(row).join('')}</tbody></table></div>`:''}
    ${!s.over.length && !s.extras.length && s.done ? `<div class="empty tiny" style="padding:16px"><h3 style="color:var(--ok)">Tudo certo</h3><p>Nenhuma cobrança acima da etiqueta.</p></div>`:''}
    <div class="card">
      <div class="row between tiny"><span class="muted">Esperado pelos itens</span><span class="num">${fmtBRL(s.expectedTotal)}</span></div>
      ${s.receiptTotal!=null?`<div class="row between tiny"><span class="muted">Total do cupom</span><span class="num">${fmtBRL(s.receiptTotal)}</span></div>
      <div class="row between tiny" style="margin-top:4px"><span>Diferença no total</span><strong class="num" style="color:${totalGap>0.004?'var(--bad)':'var(--ok)'}">${totalGap>0?'+':''}${fmtBRL(totalGap)}</strong></div>

function reportText(listId, placeId){
  const list = listById(listId);
  const place = placeById(placeId);
  const s = checkSummary(list, placeId);
  const L = [];
  L.push(`CONFERÊNCIA DE CUPOM — ${place.name}`);
  L.push(`Data da compra: ${fmtFullDate(s.rows[0]?.it.cart.date || list.date)}`);
  L.push('');
  if(s.over.length){
    L.push('Itens cobrados acima do preço da etiqueta:');
    s.over.forEach(r=>{
      L.push(`• ${r.p.name} (${fmtQty(r.it.cart.qty,r.p.sellBy)} ${unitShort(r.p)} × ${fmtBRL(r.it.cart.unitPrice)}${discountValue(r.it.cart)>0?`, desconto ${fmtBRL(discountValue(r.it.cart))}`:''})`);
      L.push(`  Esperado: ${fmtBRL(r.expected)} | Cupom: ${fmtBRL(r.charged)} | Diferença: +${fmtBRL(r.diff)}${r.it.cart.photoId?' | tenho foto da etiqueta':''}`);
    });
    L.push('');
  }
  if(s.extras.length){
    L.push('Cobrado sem ter levado:');
    s.extras.forEach(x=>L.push(`• ${x.name||'Item'}: +${fmtBRL(x.value)}`));
    L.push('');
  }
  L.push(`TOTAL A DEVOLVER: ${fmtBRL(s.toCharge)}`);
  if(s.receiptTotal!=null) L.push(`Total do cupom: ${fmtBRL(s.receiptTotal)} | Esperado: ${fmtBRL(s.expectedTotal)}`);
  L.push('');
  L.push('O preço anunciado na gôndola obriga o fornecedor (CDC, arts. 30 e 31). Havendo divergência, o consumidor paga o menor valor.');
  return L.join('\n');
}
window.copyReport = async (listId, placeId) => {
  const text = reportText(listId, placeId);
  try{ await navigator.clipboard.writeText(text); toast('Relatório copiado'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Relatório copiado'); }catch(_){ toast('Não consegui copiar'); }
    ta.remove();
  }
};
window.shareReport = async (listId, placeId) => {
  const text = reportText(listId, placeId);
  if(navigator.share){
    try{ await navigator.share({title:'Conferência de cupom', text}); return; }catch(e){ if(e.name==='AbortError') return; }

};
window.toggleResolved = async (listId, placeId) => {

/* ===================== CALCULADORA DE EMBALAGENS ===================== */
// Compares packages by price per unit of measure, and lets you set how many packs of each you'd take.
const CALC_UNITS = [
  {id:'m',  base:'m',  factor:1,     dim:'comp'},
  {id:'g',  base:'kg', factor:0.001, dim:'peso'},
  {id:'kg', base:'kg', factor:1,     dim:'peso'},
  {id:'ml', base:'L',  factor:0.001, dim:'vol'},
  {id:'L',  base:'L',  factor:1,     dim:'vol'},
  {id:'un', base:'un', factor:1,     dim:'un'},
];
const CALC_KEY = 'calc';
let calcState = null;
function calcNewOption(i){
  return {id:uid(), label:'', price:'', count:'', size:'', unit: calcState?.opts?.[0]?.unit || 'm', packs:1, _i:i};
}
function calcLoad(){
  try{ calcState = JSON.parse(ls.get(CALC_KEY, 'null')); }catch(e){ calcState = null; }
  if(!calcState || !Array.isArray(calcState.opts) || calcState.opts.length<2){
    calcState = {opts:[]};
    calcState.opts.push(calcNewOption(0), calcNewOption(1));
  }
}
const calcSave = () => ls.set(CALC_KEY, JSON.stringify(calcState));
const LETTERS = 'ABCDEF';
const optName = (o, i) => o.label?.trim() || `Opção ${LETTERS[i]}`;

// numbers for one option (null when incomplete)
function calcCompute(o){
  const price = parseNum(o.price);
  const count = o.count==='' || o.count==null ? 1 : parseNum(o.count);
  const size = parseNum(o.size);
  const u = CALC_UNITS.find(x=>x.id===o.unit);
  const packs = Math.max(1, Math.round(o.packs||1));
  if(!(price>0) || !(count>0) || !(size>0) || !u) return null;
  const perPack = count*size*u.factor;           // content of one pack in base unit
  return {price, count, size, u, packs, perPack, total: perPack*packs, cost: price*packs, perBase: price/perPack};
}
function fmtAmount(v, base){
  const n = Math.round(v*1000)/1000;
  const s = n.toLocaleString('pt-BR', {maximumFractionDigits: base==='un'||base==='m' ? 1 : 3});
  return `${s} ${base}`;
}
// readable price per measure: very small values (paper, foil) are shown per 100
function fmtPer(perBase, base){
  if(perBase < 1 && base!=='un') return `${fmtBRL(perBase*100)} por 100 ${base}`;
  return `${fmtBRL(perBase)} por ${base}`;
}

window.openCalc = () => {
  calcLoad();
  openSheet(`
    <div class="row between" style="align-items:flex-start">
      <div><h3 style="margin-bottom:2px">Comparar embalagens</h3>
      <div class="tiny muted" style="margin-bottom:12px">Qual sai mais barato por metro, kg, litro ou unidade</div></div>
      <button class="btn sm ghost" onclick="calcClear()">Limpar</button>
    </div>
    <div id="calc-opts"></div>
    <button class="btn ghost sm full" id="calc-add" onclick="calcAdd()" style="margin-bottom:14px">+ Comparar outra opção</button>
    <div id="calc-result"></div>
    <button class="btn full" style="margin-top:12px" onclick="closeSheet()">Fechar</button>`);
  calcRenderOpts();
  calcRenderResult();
};
function calcRenderOpts(){
  const box = document.getElementById('calc-opts');
  if(!box) return;
  box.innerHTML = calcState.opts.map((o,i)=>`
    <div class="card calc-opt" data-i="${i}">
      <div class="row between" style="margin-bottom:8px;gap:8px">
        <input class="calc-label" data-f="label" value="${escapeHtml(o.label)}" placeholder="Opção ${LETTERS[i]} (ex: Neve 40 rolos)">
        ${calcState.opts.length>2?`<button type="button" class="icon-btn" style="color:var(--bad)" onclick="calcRemove(${i})" aria-label="Remover opção">×</button>`:''}
      </div>
      <div class="grid-2" style="gap:8px">
        <div class="field" style="margin:0"><label>Preço do pacote</label>
          <input data-f="price" type="text" inputmode="decimal" placeholder="R$ 0,00" value="${escapeHtml(o.price)}"></div>
        <div class="field" style="margin:0"><label>Itens no pacote</label>
          <input data-f="count" type="text" inputmode="decimal" placeholder="1" value="${escapeHtml(o.count)}"></div>
      </div>
      <div class="field" style="margin:8px 0 0"><label>Tamanho de cada item</label>
        <div class="row" style="gap:8px;align-items:center">
          <input data-f="size" type="text" inputmode="decimal" placeholder="Ex: 30" value="${escapeHtml(o.size)}" style="flex:0 0 92px">
          <div class="chips calc-units" style="flex-wrap:nowrap;overflow-x:auto">
            ${CALC_UNITS.map(u=>`<div class="chip ${o.unit===u.id?'active':''}" data-unit="${u.id}">${u.id}</div>`).join('')}
          </div>
        </div>
      </div>
      <div class="row between" style="margin-top:10px">
        <span class="tiny muted">Quantos pacotes vou levar</span>
        <div class="stepper sm">
          <button type="button" onclick="calcPacks(${i},-1)" aria-label="Menos">−</button>
          <span class="num" id="calc-packs-${i}">${o.packs}</span>
          <button type="button" onclick="calcPacks(${i},1)" aria-label="Mais">+</button>
        </div>
      </div>
      <div class="tiny calc-line" id="calc-line-${i}" style="margin-top:8px"></div>
    </div>`).join('');
  box.querySelectorAll('.calc-opt').forEach(card=>{
    const i = +card.dataset.i;
    card.querySelectorAll('input[data-f]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ calcState.opts[i][inp.dataset.f] = inp.value; calcSave(); calcRenderResult(); });
    });
    card.querySelectorAll('.calc-units .chip').forEach(ch=>{
      ch.addEventListener('click', ()=>{
        card.querySelectorAll('.calc-units .chip').forEach(x=>x.classList.remove('active'));
        ch.classList.add('active');
        calcState.opts[i].unit = ch.dataset.unit; calcSave(); calcRenderResult();
      });
    });
  });
  document.getElementById('calc-add').style.display = calcState.opts.length>=6 ? 'none' : '';
}
window.calcAdd = () => {
  calcState.opts.push(calcNewOption(calcState.opts.length));
  calcSave(); calcRenderOpts(); calcRenderResult();
  const last = document.querySelector('.calc-opt:last-child input[data-f="price"]');
  last?.scrollIntoView({block:'center'}); last?.focus();
};
window.calcRemove = (i) => { calcState.opts.splice(i,1); calcSave(); calcRenderOpts(); calcRenderResult(); };
window.calcPacks = (i, d) => {
  const o = calcState.opts[i];
  o.packs = Math.max(1, Math.min(99, (o.packs||1)+d));
  document.getElementById('calc-packs-'+i).textContent = o.packs;
  calcSave(); calcRenderResult();
};
window.calcClear = () => {
  calcState = {opts:[]};
  calcState.opts.push(calcNewOption(0), calcNewOption(1));
  calcSave(); calcRenderOpts(); calcRenderResult();
};

function calcRenderResult(){
  const box = document.getElementById('calc-result');
  if(!box) return;
  const rows = calcState.opts.map((o,i)=>({o, i, c:calcCompute(o)}));
  // per-option summary line
  rows.forEach(r=>{
    const el = document.getElementById('calc-line-'+r.i);
    if(!el) return;
    if(!r.c){ el.innerHTML = '<span class="muted">Preencha preço e tamanho</span>'; return; }
    const c = r.c;
    el.innerHTML = `<span class="muted">${c.packs>1?`${c.packs} pacotes: `:''}${fmtAmount(c.total, c.u.base)} por ${fmtBRL(c.cost)}</span> · <strong>${fmtPer(c.perBase, c.u.base)}</strong>`;
  });
  const ready = rows.filter(r=>r.c);
  if(ready.length<2){ box.innerHTML = ''; return; }
  const dims = new Set(ready.map(r=>r.c.u.dim));
  if(dims.size>1){
    box.innerHTML = `<div class="warn-banner" style="border-color:rgba(251,191,36,.4)">As opções estão em medidas diferentes (ex: metros e gramas). Use a mesma medida em todas pra comparar.</div>`;
    return;
  }
  const base = ready[0].c.u.base;
  const sorted = ready.slice().sort((a,b)=>a.c.perBase-b.c.perBase);
  const best = sorted[0], worst = sorted[sorted.length-1];
  const tie = Math.abs(best.c.perBase - sorted[1].c.perBase) / sorted[1].c.perBase < 0.005;

  let html = `<div class="section-head" style="margin-top:0"><h2>Resultado</h2><span class="tiny muted">por ${base}</span></div>`;
  if(tie){
    html += `<div class="card calc-best"><div style="font-weight:800;font-size:17px">Empate</div>
      <div class="tiny muted" style="margin-top:4px">${escapeHtml(optName(best.o,best.i))} e ${escapeHtml(optName(sorted[1].o,sorted[1].i))} custam praticamente o mesmo por ${base}. Escolha pela quantidade que você precisa.</div></div>`;
  } else {
    const pct = (worst.c.perBase - best.c.perBase) / worst.c.perBase * 100;
    html += `<div class="card calc-best">
      <div class="tiny" style="color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Mais vantajoso</div>
      <div style="font-weight:800;font-size:19px;margin-top:2px">${escapeHtml(optName(best.o,best.i))}</div>
      <div style="margin-top:4px"><strong>${fmtPer(best.c.perBase, base)}</strong> · ${pct.toFixed(0)}% mais barato que ${escapeHtml(optName(worst.o,worst.i))}</div>
    </div>`;
  }
  // ranking with bars
  html += `<div class="card">${sorted.map((r,k)=>{
    const w = Math.max(6, r.c.perBase/worst.c.perBase*100);
    return `<div style="margin:${k?'12px':'0'} 0 0">
      <div class="row between tiny"><span style="font-weight:600">${escapeHtml(optName(r.o,r.i))}</span><span class="num">${fmtPer(r.c.perBase, base)}</span></div>
      <div class="calc-bar"><div style="width:${w}%;background:${k===0&&!tie?'var(--accent)':'var(--surface-3)'}"></div></div>
    </div>`;
  }).join('')}</div>`;

  // what you'd actually take home with the chosen number of packs
  html += `<div class="section-head"><h2>Levando os pacotes escolhidos</h2></div>
    <div class="card" style="padding:4px 10px;overflow-x:auto"><table class="rep">
      <thead><tr><th>Opção</th><th>Leva</th><th>Paga</th></tr></thead>
      <tbody>${ready.map(r=>`<tr><td>${escapeHtml(optName(r.o,r.i))}<div class="tiny muted">${r.c.packs} pacote${r.c.packs>1?'s':''}</div></td>
        <td class="num">${fmtAmount(r.c.total, base)}</td><td class="num" style="font-weight:700">${fmtBRL(r.c.cost)}</td></tr>`).join('')}</tbody>
    </table></div>`;

  // fair comparison: cost of the best option's amount bought through each other option
  if(!tie){
    const ref = best.c.total;
    const others = sorted.slice(1).map(r=>({r, cost: r.c.perBase*ref, save: r.c.perBase*ref - best.c.cost}));
    html += `<div class="card"><div class="tiny muted" style="margin-bottom:6px">Pra levar os mesmos ${fmtAmount(ref, base)} de ${escapeHtml(optName(best.o,best.i))}:</div>
      ${others.map(x=>`<div class="row between tiny" style="padding:3px 0"><span>${escapeHtml(optName(x.r.o,x.r.i))} custaria</span><span class="num">${fmtBRL(x.cost)} <strong style="color:var(--ok)">(você economiza ${fmtBRL(x.save)})</strong></span></div>`).join('')}
    </div>`;
  }
  box.innerHTML = html;
}
