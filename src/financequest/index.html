<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FinanceQuest Pro</title>
<meta name="description" content="Controle financeiro pessoal gamificado, offline.">
<meta name="theme-color" content="#657990">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FinanceQuest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23657990'/%3E%3Cpath d='M32 10 50 17v13c0 12-8 20-18 24-10-4-18-12-18-24V17z' fill='%23fff'/%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='900' font-size='17' text-anchor='middle' fill='%23657990'%3ER$%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

:root{
  --primary:#657990; --primary-dark:#4c5f75; --primary-light:#a0b2c6; --primary-soft:#e8eef5;
  --bg1:#f0f4f8; --bg2:#e2eaf4; --card:#fff; --soft:#f8fafc; --line:#e2e8f0;
  --text:#334155; --muted:#64748b; --faint:#94a3b8;
  --in:#0f9d76; --in-soft:#d1fae5; --out:#e0644f; --out-soft:#fde4df;
  --move:#4f46e5; --move-soft:#e0e7ff;
  --ok:#0f9d76; --warn:#b45309; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
  --gold:#f59e0b; --gold-soft:#fef3c7;
  --r-card:22px; --r-pill:999px;
  --shadow:0 8px 26px rgba(101,121,144,.14);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html,body{overflow-x:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh;min-height:100dvh;font-size:15px}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
h1,h2,h3,h4{font-weight:800}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.b{font-weight:800} .num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0} .center{text-align:center} .mt8{margin-top:8px} .mt12{margin-top:12px} .mt16{margin-top:16px} .mb12{margin-bottom:12px}

/* ---------- LAYOUT ---------- */
.app{max-width:1200px;margin:0 auto;padding:12px 14px calc(100px + var(--safe-b))}
.topbar{background:var(--primary);color:#fff;border-radius:var(--r-card);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(101,121,144,.28);position:relative;overflow:hidden}
.topbar::before{content:'';position:absolute;right:-60px;top:-90px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.avatar{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hello h1{font-size:1.05rem;line-height:1.2}
.hello p{font-size:.8rem;opacity:.92;font-weight:700}
.lvl-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:var(--r-pill);font-size:.72rem;font-weight:800}
.icon-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.topnav{display:none;gap:4px;background:rgba(255,255,255,.14);padding:4px;border-radius:var(--r-pill);position:relative;z-index:1}
.topnav button{background:transparent;border:none;color:#fff;font-weight:800;padding:8px 16px;border-radius:var(--r-pill);font-size:.92rem;opacity:.85}
.topnav button.active{background:#fff;color:var(--primary-dark);opacity:1}

.tab{display:none;margin-top:14px;animation:fade .3s ease-out}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + var(--safe-b))}
.bottomnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.68rem;font-weight:800;color:var(--faint);padding:4px 6px;min-width:58px}
.bottomnav button .ic{font-size:1.3rem;filter:grayscale(1);opacity:.7}
.bottomnav button.active{color:var(--primary-dark)}
.bottomnav button.active .ic{filter:none;opacity:1}
.bottomnav .fab{width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;font-size:2rem;font-weight:400;line-height:1;justify-content:center;box-shadow:0 8px 20px rgba(101,121,144,.5);margin-top:-26px;border:4px solid #fff;min-width:0;padding:0}
.fab-desk{display:none;position:fixed;right:28px;bottom:28px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:var(--r-pill);padding:16px 24px;font-weight:900;font-size:1rem;box-shadow:0 10px 26px rgba(101,121,144,.5);align-items:center;gap:8px}
.fab-desk:hover{background:var(--primary-dark);transform:translateY(-2px)}
.fab-desk kbd{background:rgba(255,255,255,.2);border-radius:6px;padding:1px 6px;font-size:.75rem;font-family:inherit}

/* ---------- CARDS / COMPONENTES ---------- */
.card{background:var(--card);border-radius:var(--r-card);padding:18px;box-shadow:var(--shadow);min-width:0}
.card+.card,.stack>*+*{margin-top:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card-t{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:8px}
.link{background:none;border:none;color:var(--primary-dark);font-weight:800;font-size:.85rem;padding:4px 2px}
.btn{border:none;border-radius:var(--r-pill);padding:12px 20px;font-weight:800;font-size:.95rem;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 14px;font-size:.82rem}
.btn.ghost{background:var(--primary-soft);color:var(--primary-dark)}
.btn.line{background:transparent;border:2px solid var(--line);color:var(--text)}
.btn.green{background:var(--in)} .btn.red{background:var(--bad)} .btn.white{background:#fff;color:var(--primary-dark)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:800;color:var(--muted);font-size:.82rem;padding-left:4px}
.inp{width:100%;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--soft);font-weight:700;transition:.2s}
.inp:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(101,121,144,.12)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:var(--r-pill);padding:6px 12px;font-weight:800;font-size:.82rem;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--primary-soft);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{white-space:nowrap;flex:1;border:none;background:transparent;border-radius:var(--r-pill);padding:9px 8px;font-weight:800;font-size:.88rem;color:var(--muted)}
.seg button.on{background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);color:var(--text)}
.seg button.on[data-mode=expense]{color:var(--out)}
.seg button.on[data-mode=income]{color:var(--in)}
.seg button.on[data-mode=save]{color:var(--move)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700;font-size:.9rem}
.pill-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--r-pill);font-size:.72rem;font-weight:800;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill-tag.ok{background:var(--in-soft);color:#05664b} .pill-tag.warn{background:var(--warn-soft);color:var(--warn)} .pill-tag.bad{background:var(--bad-soft);color:var(--bad)} .pill-tag.move{background:var(--move-soft);color:var(--move)}

/* progress */
.bar{height:12px;background:var(--line);border-radius:var(--r-pill);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--primary),var(--primary-light));transition:width .8s ease}
.bar.green>i{background:linear-gradient(90deg,#0f9d76,#34d399)}
.bar.gold>i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.milestones{position:relative;height:30px;margin-top:4px}
.milestones .ms{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:.66rem;font-weight:800;color:var(--faint)}
.milestones .ms::before{content:'';width:2px;height:6px;background:var(--faint);border-radius:2px;margin-bottom:2px}
.milestones .ms.hit{color:var(--in)} .milestones .ms.hit::before{background:var(--in)}
.milestones .ms:first-child{transform:none;align-items:flex-start} .milestones .ms:last-child{transform:translateX(-100%);align-items:flex-end}

/* ---------- HOME ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.home-col{min-width:0}
.home-col>*+*{margin-top:14px}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--r-card);padding:20px;box-shadow:0 14px 34px rgba(76,95,117,.35);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero.warn{background:linear-gradient(135deg,#b7791f,#92400e)}
.hero.bad{background:linear-gradient(135deg,#c2410c,#991b1b)}
.hero .lbl{font-weight:800;opacity:.9;font-size:.9rem}
.hero .big{font-size:2.5rem;font-weight:900;letter-spacing:-1px;line-height:1.1;margin:4px 0}
.hero .perday{font-weight:800;font-size:.95rem;opacity:.95}
.hero details{margin-top:12px;position:relative;z-index:1}
.hero summary{cursor:pointer;font-weight:800;font-size:.8rem;opacity:.85;list-style:none}
.hero summary::-webkit-details-marker{display:none}
.calc{margin-top:8px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;font-size:.85rem;font-weight:700}
.calc div{display:flex;justify-content:space-between;padding:2px 0}
.calc .tot{border-top:1px solid rgba(255,255,255,.3);margin-top:4px;padding-top:6px;font-weight:900}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:clamp(.82rem,3.7vw,1.08rem);font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.7rem;font-weight:800;margin-top:2px}
.journey-strip{display:flex;align-items:center;gap:12px;cursor:pointer}
.lvl-circle{width:52px;height:52px;border-radius:50%;background:var(--gold-soft);border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;line-height:1}
.lvl-circle small{font-size:.55rem;color:var(--warn)}
.streak-pill{display:flex;align-items:center;gap:4px;font-weight:900;font-size:.9rem;background:#fff4e6;color:#c2410c;padding:6px 10px;border-radius:var(--r-pill);white-space:nowrap}
.setup-step{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-weight:700}
.setup-step:last-child{border-bottom:none}
.setup-step .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.setup-step.done .ck{background:var(--in);border-color:var(--in);color:#fff}
.setup-step.done .t{text-decoration:line-through;color:var(--faint)}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:#7c2d12;border-radius:16px;padding:10px 14px;font-weight:800;font-size:.86rem;margin-bottom:14px}

/* bills */
.bill{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bill:last-child{border-bottom:none}
.bill .ico{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.bill .nm{font-weight:800;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill.paid{opacity:.55}

/* bill actions */
.bill-acts{display:flex;gap:6px;flex-shrink:0}
.bill-acts .btn.sm{padding:7px 11px}
/* cartões */
.cc{padding:12px 0;border-bottom:1px solid var(--line)}
.cc:first-of-type{padding-top:0}
.cc:last-child{border-bottom:none;padding-bottom:0}
.cc-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.inv-alert{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--warn-soft);color:#7c2d12;font-size:.86rem}
.inv-alert.bad{background:var(--bad-soft);color:#991b1b}
.bar.red>i{background:linear-gradient(90deg,#dc2626,#f87171)}
.inst-box{background:var(--move-soft);border-radius:16px;padding:10px 12px;margin-bottom:6px;color:var(--move)}
.inst-box .chip{border-color:#c7d2fe}
.inst-box .chip.on{background:var(--move);border-color:var(--move)}
/* budgets */
.bud{margin-bottom:12px}
.bud:last-child{margin-bottom:0}
.bud .top{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:.86rem;margin-bottom:5px}
.bud .track{height:10px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.bud .track i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--primary)}
.bud.warn .track i{background:#d97706} .bud.bad .track i{background:var(--bad)} .bud.nolimit .track i{background:var(--faint)}

/* chart */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:#1e293b;color:#fff;padding:8px 10px;border-radius:10px;font-size:.78rem;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}

/* tx list */
.day-h{font-size:.75rem;font-weight:900;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 6px;display:flex;justify-content:space-between}
.day-h:first-child{margin-top:0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;margin-bottom:6px;cursor:pointer;transition:.15s}
.tx:hover{background:#fff;border-color:var(--primary-light)}
.tx .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;background:#fff}
.tx .d1{font-weight:800;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d2{font-size:.74rem;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .val{font-weight:900;white-space:nowrap;font-size:.95rem}
.val.in{color:var(--in)} .val.out{color:var(--text)} .val.move{color:var(--move)}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.month-nav button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:900;font-size:1.1rem}
.month-nav h3{font-size:1.1rem}
.sumline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sumline div{background:var(--soft);border-radius:14px;padding:8px 10px}
.sumline .k{font-size:.7rem;font-weight:800;color:var(--muted)} .sumline .v{font-weight:900;font-size:.95rem}

/* jornada */
.big-level{display:flex;gap:16px;align-items:center}
.big-level .lvl-circle{width:72px;height:72px;font-size:1.6rem}
.weeks{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.weeks span{width:20px;height:20px;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:.6rem}
.weeks span.on{background:#fb923c} .weeks span.sh{background:#93c5fd} .weeks span.cur{outline:2px dashed #fb923c;outline-offset:1px}
.goals{display:grid;grid-template-columns:1fr;gap:12px}
.goal{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:2px solid transparent;position:relative}
.goal.focus{border-color:var(--gold)}
.goal .ph{height:110px;background:linear-gradient(135deg,var(--primary-soft),var(--bg2));display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.goal .ph img{width:100%;height:100%;object-fit:cover}
.goal .star{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:34px;height:34px;font-size:1rem}
.goal .bd{padding:14px}
.goal.done .ph::after{content:'✓ Conquistado';position:absolute;inset:0;background:rgba(15,157,118,.75);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem}
.phase{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--soft);border-left:5px solid var(--line);margin-bottom:8px;cursor:pointer}
.phase.done{background:var(--in-soft);border-left-color:var(--in)}
.phase .n{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.phase.done .n{background:var(--in)}
.phase h4{font-size:.93rem} .phase p{font-size:.78rem;color:var(--muted);font-weight:600}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.trophy{background:var(--soft);border-radius:16px;padding:12px 8px;text-align:center;opacity:.45;filter:grayscale(1);border:2px solid transparent}
.trophy.on{opacity:1;filter:none;background:var(--gold-soft);border-color:var(--gold)}
.trophy .e{font-size:2rem} .trophy h4{font-size:.8rem;margin-top:4px} .trophy p{font-size:.68rem;color:var(--muted);font-weight:700}

/* planejar */
.accounts{display:grid;grid-template-columns:1fr;gap:12px}
.bank{border-radius:20px;padding:16px;color:#fff;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.bank::after{content:'';position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.bank .bal{font-size:1.6rem;font-weight:900;position:relative;z-index:1}
.bank .acts{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.bank .acts button{background:rgba(255,255,255,.22);border:none;border-radius:10px;width:32px;height:32px;color:#fff}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.mini-inp{width:110px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--soft);font-weight:800;text-align:right;font-size:15px}
.star-btn{background:none;border:none;font-size:1.2rem;padding:2px}

<script>
'use strict';
/* =====================================================================
   FinanceQuest Pro v2 — app offline de finanças pessoais gamificado
   Dados: IndexedDB local (mesmo banco da v1, migração automática)
   ===================================================================== */

const DB_NAME = 'FinanceQuestProDB_Desktop';
const DB_KEY = 'gameState';
const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MONTHS_FULL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WEEKDAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

const DEFAULT_CATS = [
  { icon:'🛒', name:'Supermercado', type:'expense', fav:true },
  { icon:'🥬', name:'Feira/Hortifruti', type:'expense', fav:true },
  { icon:'🍔', name:'Lanches/Delivery', type:'expense', fav:true },
  { icon:'🚌', name:'Transporte', type:'expense', fav:true },
  { icon:'🏠', name:'Moradia/Contas', type:'expense', fav:true },
  { icon:'🏥', name:'Saúde/Farmácia', type:'expense', fav:true },
  { icon:'🎉', name:'Lazer', type:'expense', fav:true },
  { icon:'📦', name:'Outros Gastos', type:'expense', fav:true },
  { icon:'📺', name:'Assinaturas', type:'expense', fav:false },
  { icon:'📚', name:'Educação/Cursos', type:'expense', fav:false },
  { icon:'💻', name:'Equipamentos/Setup', type:'expense', fav:false },
  { icon:'💳', name:'Dívidas/Cartão', type:'expense', fav:false },
  { icon:'💼', name:'Salário Fixo', type:'income', fav:true },
  { icon:'🎬', name:'Freela (Motion)', type:'income', fav:true },
  { icon:'🖨️', name:'Venda de Projeto 3D', type:'income', fav:true },
  { icon:'📈', name:'Rendimentos/Cashback', type:'income', fav:true },
  { icon:'💰', name:'Outras Entradas', type:'income', fav:true },
];

const DEFAULT_PHASES = [
  { title:'Mapeamento Sincero', desc:'Anotar 100% das dívidas e custos fixos reais (cadastre suas contas fixas!).' },
  { title:'Freio de Arrumação', desc:'Parar de usar cartão. A sobra mensal vai SÓ para abater as dívidas antigas.' },
  { title:'Otimização da Dieta', desc:'Trocar industrializados caros por comida fresca de feira e mercado local.' },
  { title:'Primeiros R$ 500', desc:'Juntar o primeiro suspiro financeiro na reserva.', auto:{ kind:'reserve', value:500 } },
  { title:'Colchão de Sobrevivência', desc:'Bater R$ 1.500 na reserva para não recorrer a empréstimos.', auto:{ kind:'reserve', value:1500 } },
  { title:'Reserva Plena Estabelecida', desc:'Atingir 100% da meta da reserva de emergência.', auto:{ kind:'reservePct', value:100 } },
  { title:'Validação 3D (Primeiro Cliente)', desc:'Vender seu 1º projeto 3D de modelagem e terceirizar a impressão.' },
  { title:'Aquisição Maker Segura', desc:'Comprar a Impressora 3D à vista com o dinheiro acumulado de freelas.' },
  { title:'Motor Duplo (Motion + 3D)', desc:'Fazer o lucro dos freelas empatar com seu salário principal.' },
  { title:'Visão de Futuro Longeva', desc:'Iniciar aportes seguros em Tesouro IPCA+ e carteira de FIIs.' },
];

const LEVELS = [0,120,300,550,900,1350,1900,2600,3500,4600,6000,8000];
const LEVEL_TITLES = ['Aprendiz','Anotador','Poupador','Planejador','Estrategista','Guardião','Construtor','Mestre','Visionário','Lenda','Lenda II','Lenda III'];
const MILESTONES = [10,25,50,75,100];

const ACHIEVEMENTS = [
  { id:'first',    e:'📝', t:'Primeiro Passo',       d:'Fez o 1º lançamento',                       c:D=>S.transactions.length>0 },
  { id:'save1',    e:'🐷', t:'Primeira Economia',    d:'Guardou dinheiro pela 1ª vez',               c:D=>D.savingTxs.length>0 },
  { id:'payfirst', e:'⚡', t:'Pague-se Primeiro',     d:'Guardou no mesmo dia em que recebeu',        c:D=>D.payFirstDays>0 },
  { id:'wk4',      e:'🔥', t:'Hábito Nascendo',       d:'4 semanas seguidas guardando',               c:D=>D.streak.best>=4 },
  { id:'wk12',     e:'🌋', t:'Hábito Firme',          d:'12 semanas seguidas guardando',              c:D=>D.streak.best>=12 },
  { id:'wk26',     e:'☄️', t:'Meio Ano Poupador',     d:'26 semanas seguidas guardando',              c:D=>D.streak.best>=26 },
  { id:'r500',     e:'🥉', t:'Primeiros R$ 500',      d:'R$ 500 na reserva',                          c:D=>D.reserve>=500 },
  { id:'r1500',    e:'🥈', t:'Colchão',               d:'R$ 1.500 na reserva',                        c:D=>D.reserve>=1500 },
  { id:'r50',      e:'🛡️', t:'Meio Caminho',          d:'50% da meta da reserva',                     c:D=>D.reservePct>=50 },
  { id:'r100',     e:'🏰', t:'Fortaleza',             d:'Reserva de emergência completa',             c:D=>D.reservePct>=100 },
  { id:'goal1',    e:'🎁', t:'Sonho Realizado',       d:'Concluiu uma caixinha',                      c:D=>S.goals.some(g=>g.done) },
  { id:'green',    e:'💚', t:'Mês no Azul',           d:'Fechou um mês guardando a % da meta',        c:D=>D.past.some(m=>m.rateOk) },
  { id:'budget',   e:'🎯', t:'Dentro do Plano',       d:'Fechou um mês sem estourar nenhum limite',   c:D=>D.past.some(m=>m.budgetOk) },
  { id:'bills',    e:'📅', t:'Contas em Dia',         d:'Mês com todas as fixas pagas até o vencimento', c:D=>D.past.some(m=>m.billsOk) },
  { id:'hustler',  e:'🚀', t:'Hustler',               d:'Recebeu renda extra (freela/venda)',         c:D=>S.transactions.some(t=>t.type==='income' && /freela|venda/i.test(catOf(t).name)) },
  { id:'phase5',   e:'🗺️', t:'Meio da Jornada',       d:'5 fases concluídas',                         c:D=>D.phasesDone>=5 },
  { id:'lvl5',     e:'👑', t:'Guardião',              d:'Chegou ao nível 6',                          c:D=>D.level.n>=6 },
];

/* ---------------- HELPERS ---------------- */
function parseMoney(v){
  if (v===null||v===undefined) return NaN;
  let s=String(v).trim().replace(/R\$|\s/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return parseFloat(s);
}
const r2 = n => Math.round(((Number(n)||0)+Number.EPSILON)*100)/100;
const fmt = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtK = n => { const a=Math.abs(n); if(a>=1000) return 'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k'; return 'R$ '+Math.round(n); };
const moneyInput = n => { const v=r2(n); return (Number.isInteger(v)?String(v):v.toFixed(2)).replace('.',','); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isoFromTs = ts => isoDay(new Date(ts));
function tsFromIso(iso){ if(!iso) return Date.now(); const [y,m,d]=iso.split('-').map(Number); const n=new Date(); return new Date(y,m-1,d,n.getHours(),n.getMinutes(),n.getSeconds()).getTime(); }
const monthKey = ts => { const d=new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const curMK = () => monthKey(Date.now());
const mkLabel = (mk,full=true) => { const [y,m]=mk.split('-').map(Number); return (full?MONTHS_FULL:MONTHS)[m-1]+(full?' de '+y:''); };
function addMonths(mk,n){ const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-1+n,1); return monthKey(d.getTime()); }
function daysInMonth(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); }
function weekKey(ts){ const d=new Date(ts); d.setHours(12,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return isoDay(d); }
function addWeek(wk,n=1){ const [y,m,d]=wk.split('-').map(Number); return isoDay(new Date(y,m-1,d+7*n,12)); }
const pct = (a,b) => b>0 ? Math.max(0,Math.min(100,a/b*100)) : 0;
const $ = id => document.getElementById(id);

/* ---------------- ESTADO ---------------- */
let db; let S;
const accById = id => S.accounts.find(a=>a.id===id);
const goalById = id => S.goals.find(g=>g.id===id);
const catById = id => S.categories.find(c=>c.id===id);
const isReserveAcc = a => !!(a && a.type!=='card' && (a.isReserve || (a.name||'').toLowerCase().includes('reserva')));
const isReserveId = id => isReserveAcc(accById(id));
const isCard = a => !!(a && a.type==='card');
const isCardId = id => isCard(accById(id));
const bankAccs = () => S.accounts.filter(a=>!isCard(a));
const cardAccs = () => S.accounts.filter(isCard);
const ddmm = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
function dayIn(mk, day){ const [y,m]=mk.split('-').map(Number); return new Date(y,m-1,Math.min(day,daysInMonth(mk)),12); }
function shiftMonths(ts,n){ const d=new Date(ts); const mk=addMonths(monthKey(ts),n); const [y,m]=mk.split('-').map(Number); return new Date(y,m-1,Math.min(d.getDate(),daysInMonth(mk)),d.getHours(),d.getMinutes(),d.getSeconds()).getTime(); }
// Fatura identificada pelo mês de VENCIMENTO. Compra no dia do fechamento ou depois vai para a próxima.
function invoiceFor(card, ts){ const d=new Date(ts); let mk=monthKey(ts); if (d.getDate()>=card.closingDay) mk=addMonths(mk,1); return card.dueDay<=card.closingDay ? addMonths(mk,1) : mk; }
function invoiceInfo(card, mk){
  const items = S.transactions.filter(t=>t.type==='expense' && t.accountId===card.id && t.cardInvoice===mk && !t.prepaid);
  const pays = S.transactions.filter(t=>t.type==='transfer' && t.toAccountId===card.id && t.invoiceMk===mk);
  const opening = r2((card.openings||{})[mk]||0);
  const total = r2(items.reduce((x,t)=>x+t.amount,0)+opening);
  const paid = r2(pays.reduce((x,t)=>x+t.amount,0));
  const remaining = r2(Math.max(0,total-paid));
  const due = dayIn(mk, card.dueDay);
  const close = dayIn(card.dueDay<=card.closingDay ? addMonths(mk,-1) : mk, card.closingDay);
  const today = new Date(); today.setHours(12,0,0,0);
  let status;
  if (total<=0) status = today>=close ? 'vazia' : 'aberta';
  else if (remaining<=0) status = 'paga';
  else status = today>due ? 'vencida' : today>=close ? 'fechada' : 'aberta';
  return { mk, items, pays, opening, total, paid, remaining, due, close, status };
}
function cardInvoiceMks(card){
  const set = new Set([invoiceFor(card,Date.now())]);
  S.transactions.forEach(t=>{ if (t.accountId===card.id && t.cardInvoice && !t.prepaid) set.add(t.cardInvoice); if (t.toAccountId===card.id && t.invoiceMk) set.add(t.invoiceMk); });
  Object.keys(card.openings||{}).forEach(k=>{ if (card.openings[k]>0) set.add(k); });
  return [...set].sort();
}
function cardSummary(card){
  const open = invoiceFor(card, Date.now());
  const pending = cardInvoiceMks(card).filter(mk=>mk<open).map(mk=>invoiceInfo(card,mk)).filter(i=>i.remaining>0);
  const used = r2(Math.max(0,-card.balance));
  return { open, cur:invoiceInfo(card,open), pending, used, avail:r2((card.limit||0)-used), pct:pct(used, card.limit||1) };
}
// define fatura (e se a parcela já estava paga antes de cadastrar o cartão)
function finalizeTx(t){
  const a = accById(t.accountId);
  if (t.type==='expense' && isCard(a) && !t.fromGoalId) {
    t.cardInvoice = invoiceFor(a, t.timestamp);
    const before = a.createdAt && isoFromTs(t.purchaseTs||t.timestamp) < isoFromTs(a.createdAt);
    const covered = a.coveredMk || a.startMk;
    delete t.prepaid; delete t.preLimit;
    if (before) {
      // compra de antes do cadastro: o limite usado informado já inclui ela
      if (a.availMode) t.preLimit = true;
      if (covered && t.cardInvoice <= covered) t.prepaid = true;
    }
  } else { delete t.cardInvoice; delete t.prepaid; delete t.preLimit; }
}
// fixas: ativa no mês? (pausa e data de término)
function billActiveIn(b, mk){ return b.active!==false && (!b.endMk || mk<=b.endMk); }
function billRemaining(b){
  if (!b.endMk) return null; const cur=curMK(); let n=0;
  for (let mk = billPaid(b,cur)?addMonths(cur,1):cur; mk<=b.endMk; mk=addMonths(mk,1)) n++;
  return n;
}
function catOf(t){
  const c = t.categoryId && catById(t.categoryId);
  if (c) return c;
  if (t.type==='transfer') return { icon: t.toGoalId||t.fromGoalId ? '🎁' : '⇄', name: 'Transferência' };
  const lbl = t.category||'Sem categoria'; const i = lbl.indexOf(' ');
  return i>0 ? { icon: lbl.slice(0,i), name: lbl.slice(i+1) } : { icon:'📦', name: lbl };
}
// Dinheiro entrando na reserva ou numa caixinha = "guardar"
function isSavingTx(t){
  if (t.type==='transfer') {
    const intoSafe = !!t.toGoalId || isReserveId(t.toAccountId);
    const fromSafe = !!t.fromGoalId || isReserveId(t.accountId);
    return intoSafe && !fromSafe;
  }
  return t.type==='income' && isReserveId(t.accountId);
}
function isWithdrawTx(t){
  if (t.type!=='transfer') return false;
  const intoSafe = !!t.toGoalId || isReserveId(t.toAccountId);
  const fromSafe = !!t.fromGoalId || isReserveId(t.accountId);
  return fromSafe && !intoSafe;
}

function freshState(){
  return { version:2,
    settings:{ name:'', avatarImage:null, income:0, savePercent:10, reserveGoal:10000, lastAccountId:null,
      phasesDone:[], achievements:[], achInit:false, lastBackupAt:null, lastMonthSeen:null, lastLevelSeen:1,
      simRate:10, focusGoalId:null, hideSetup:false },
    accounts:[], categories: DEFAULT_CATS.map(c=>({ id:uid(), budget:0, ...c })), transactions:[], bills:[], goals:[],
    phases: DEFAULT_PHASES.map((p,i)=>({ id:'p'+(i+1), ...p })) };
}

function migrate(raw){
  if (!raw || typeof raw!=='object') return freshState();
  const s = raw;
  s.settings = s.settings || {};
  ['accounts','transactions','bills','goals','categories','phases','wishlist'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  const st = s.settings;
  if (!s.version || s.version<2) {
    if (!s.categories.length) s.categories = DEFAULT_CATS.map(c=>({ id:uid(), budget:0, ...c }));
    const oldDone = Array.isArray(st.phasesCompleted) ? st.phasesCompleted : [];
    s.phases = DEFAULT_PHASES.map((p,i)=>({ id:'p'+(i+1), ...p }));
    st.phasesDone = oldDone.map(n=>'p'+n);
    delete st.phasesCompleted;
    // Lista de desejos -> caixinhas (dinheiro separado, não mais "liberado" pela reserva)
    s.wishlist.forEach(w=>s.goals.push({ id:w.id||uid(), name:w.name, emoji:'🎁', target:r2(w.price), saved:0, photo:null, createdAt:Date.now(), done:false }));
    s.wishlist = [];
    // Liga lançamentos antigos às categorias
    s.transactions.forEach(t=>{
      if (t.type==='transfer' || t.categoryId) return;
      const lbl = t.category||''; const i = lbl.indexOf(' ');
      const icon = i>0?lbl.slice(0,i):'📦', name = i>0?lbl.slice(i+1):(lbl||'Outros');
      let c = s.categories.find(c=>c.name===name && c.type===t.type) || s.categories.find(c=>c.name===name);
      if (!c) { c = { id:uid(), icon, name, type:t.type, fav:false, budget:0 }; s.categories.push(c); }
      t.categoryId = c.id;
    });
    st.achievements = []; st.achInit = false;
    s.version = 2;
  }
  st.income = r2(st.income||0);
  if (st.savePercent===undefined) st.savePercent = 10;
  if (!st.reserveGoal) st.reserveGoal = 10000;
  if (!Array.isArray(st.phasesDone)) st.phasesDone = [];
  if (!Array.isArray(st.achievements)) st.achievements = [];
  if (!st.simRate) st.simRate = 10;
  if (!st.lastLevelSeen) st.lastLevelSeen = 1;
  s.accounts.forEach(a=>{ a.balance=r2(a.balance); if(!a.id) a.id=uid(); if(!a.type) a.type='bank'; });
  s.transactions.forEach(t=>{ t.amount=r2(t.amount); if(!t.id) t.id=uid(); });
  s.goals.forEach(g=>{ g.saved=r2(g.saved); g.target=r2(g.target); });
  if (!s.phases.length) s.phases = DEFAULT_PHASES.map((p,i)=>({ id:'p'+(i+1), ...p }));
  if (!s.categories.length) s.categories = DEFAULT_CATS.map(c=>({ id:uid(), budget:0, ...c }));
  return s;
}

function initDB(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded = e => { const d=e.target.result; if(!d.objectStoreNames.contains('data')) d.createObjectStore('data'); };
    rq.onsuccess = e => { db=e.target.result; res(); };
    rq.onerror = e => rej(e.target.error);
  });
}
function loadState(){

    const rq = db.transaction('data','readonly').objectStore('data').get(DB_KEY);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => res(null);
  });
}
function persist(){
  try { db.transaction('data','readwrite').objectStore('data').put(S, DB_KEY); }
  catch(e){ console.error(e); toast('Erro ao salvar no navegador!', {err:true}); }
  markDirty();
}

/* ---------------- SINCRONIZAÇÃO COM O UMBREL ----------------
   Só liga quando o app roda no Umbrel (existe /api/state). No Cloudflare ou aberto como arquivo,
   continua 100% local. O aparelho guarda sua cópia (IndexedDB) e troca o pacote inteiro com o
   servidor, que mantém um número de versão (savedAt): um aparelho só grava por cima se viu a versão
   mais recente — assim dois aparelhos nunca apagam um ao outro. */
const SYNC = { on:false, applying:false, pushing:false, again:false, force:false, pulling:false, timer:null, rev:0, lastPull:0, status:'' };
const lsGet = (k,d) => { try { const v=localStorage.getItem('fq:'+k); return v==null?d:v; } catch(e){ return d; } };
const lsSet = (k,v) => { try { localStorage.setItem('fq:'+k, v); } catch(e){} };
const lsDel = k => { try { localStorage.removeItem('fq:'+k); } catch(e){} };
function markDirty(){
  if (!SYNC.on || SYNC.applying) return;
  SYNC.rev++; lsSet('syncDirty','1'); schedulePush();
}
function schedulePush(force){
  if (!SYNC.on) return;
  if (force) SYNC.force = true;
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(pushServer, 700);
  setSyncStatus('saving');
}
async function pushServer(){
  if (!SYNC.on) return;
  if (SYNC.pushing) { SYNC.again = true; return; }
  SYNC.pushing = true; const startRev = SYNC.rev; const force = SYNC.force; SYNC.force = false;
  try {
    const base = Number(lsGet('syncBase','0')) || 0;
    const r = await fetch('api/state', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ base, force, data:S }) });
    if (r.status===409) { SYNC.pushing=false; return handleConflict(await r.json()); }
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    lsSet('syncBase', String(j.savedAt));
    if (SYNC.rev===startRev) lsDel('syncDirty');
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('offline'); }
  finally { SYNC.pushing=false; if (SYNC.again) { SYNC.again=false; schedulePush(); } }
}
async function fetchServer(ms=5000){
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), ms);
  try {
    const r = await fetch('api/state', { cache:'no-store', signal:ctrl.signal });
    if (!r.ok) throw new Error('HTTP '+r.status);
    if (!/json/.test(r.headers.get('content-type')||'')) throw new Error('sem servidor');
    return await r.json(); // {savedAt, data} ou null
  } finally { clearTimeout(t); }
}
const hasLocalData = () => S.transactions.length>0 || S.accounts.length>0;
async function pullServer(){
  if (!SYNC.on || SYNC.pulling) return;
  SYNC.pulling = true; SYNC.lastPull = Date.now();
  try {
    const j = await fetchServer();
    const base = Number(lsGet('syncBase','0')) || 0; const dirty = lsGet('syncDirty')==='1';
    if (!j || !j.data) { if (hasLocalData()) schedulePush(); else setSyncStatus('ok'); return; }
    if (j.savedAt===base) { if (dirty) schedulePush(); else setSyncStatus('ok'); return; }
    if (!dirty || !hasLocalData()) return applyRemote(j, true);
    return handleConflict(j);
  } catch(e) { setSyncStatus('offline'); }
  finally { SYNC.pulling = false; }
}
function applyRemote(j, quiet){
  SYNC.applying = true;
  try { S = migrate(j.data); persist(); } finally { SYNC.applying = false; }
  lsSet('syncBase', String(j.savedAt)); lsDel('syncDirty');
  if (!$('sheetOv').classList.contains('on')) renderAll();
  setSyncStatus('ok');
  if (!quiet) toast('Atualizado com o Umbrel');
}
function handleConflict(j){
  setSyncStatus('conflict'); window._syncConflict = j;
  const when = j?.savedAt ? new Date(j.savedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '?';
  const count = d => `${(d?.transactions||[]).length} lançamentos · ${(d?.accounts||[]).length} contas/cartões`;
  openModal(`<h3>☁️ Dados diferentes</h3>
    <p class="small muted b">Este aparelho tem alterações que ainda não foram para o Umbrel, e o Umbrel também mudou por outro aparelho. Escolha qual versão vale.</p>
    <div class="sumline" style="grid-template-columns:1fr 1fr"><div><div class="k">Versão do Umbrel</div><div class="small b">salva ${when}<br>${count(j?.data)}</div></div><div><div class="k">Este aparelho</div><div class="small b">${count(S)}</div></div></div>
    <div class="acts" style="flex-direction:column"><button class="btn" onclick="resolveConflict('server')">Usar a do Umbrel</button><button class="btn line" onclick="resolveConflict('local')">Manter a deste aparelho</button></div>
    <p class="tiny muted b mt8">A outra versão é descartada. Se precisar recuperar algo, o Umbrel guarda uma cópia por dia (últimos 30 dias).</p>`);
}
function resolveConflict(which){
  const j = window._syncConflict; closeModal();
  if (which==='server' && j) applyRemote(j);
  else { lsSet('syncBase', String(j?.savedAt||0)); schedulePush(true); toast('Mantida a versão deste aparelho'); }
}
function setSyncStatus(st){ SYNC.status = st; const el=$('syncPill'); if (el) el.outerHTML = syncPill(); }
function syncPill(){
  if (!SYNC.on) return '<span id="syncPill"></span>';
  const m = { ok:['☁️','Umbrel ✓'], saving:['☁️','salvando…'], offline:['⚠️','sem conexão · salvo aqui'], conflict:['⚠️','escolha a versão'] }[SYNC.status] || ['☁️','Umbrel'];
  return `<span id="syncPill" class="lvl-badge" title="Sincronização com o Umbrel">${m[0]} ${m[1]}</span>`;
}
async function setupServerSync(){
  try { await fetchServer(3000); } catch(e) { return; } // sem servidor: segue local
  SYNC.on = true;
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState==='visible' && Date.now()-SYNC.lastPull>3000) pullServer();
    if (document.visibilityState==='hidden' && lsGet('syncDirty')==='1') pushServer();
  });
  addEventListener('online', ()=>pullServer());
  setInterval(()=>{ if (document.visibilityState==='visible' && !$('sheetOv').classList.contains('on') && !$('modalOv').classList.contains('on')) pullServer(); }, 30000);
  await pullServer();
  renderAll();
}
function commit(){ persist(); renderAll(); }

/* ---------------- MOVIMENTO DE SALDOS ---------------- */
function applyTx(t, sign){
  if (t.prepaid || t.preLimit) return;
  const add = (src, amt) => { if (src) { if ('saved' in src) src.saved=r2(src.saved+amt); else src.balance=r2(src.balance+amt); } };
  const A = t.amount*sign;
  if (t.type==='income') add(accById(t.accountId), A);
  else if (t.type==='expense') add(t.fromGoalId?goalById(t.fromGoalId):accById(t.accountId), -A);
  else if (t.type==='transfer') {
    add(t.fromGoalId?goalById(t.fromGoalId):accById(t.accountId), -A);
    add(t.toGoalId?goalById(t.toGoalId):accById(t.toAccountId), A);
  }
}
function addTx(t){ t.id=t.id||uid(); t.timestamp=t.timestamp||Date.now(); t.amount=r2(t.amount); finalizeTx(t); S.transactions.push(t); applyTx(t,+1); return t; }
function removeTx(id){ const t=S.transactions.find(x=>x.id===id); if(!t) return null; applyTx(t,-1); S.transactions=S.transactions.filter(x=>x.id!==id); return t; }

/* ---------------- CÁLCULOS ---------------- */
function billPaid(b, mk){ return (b.paidMarks||[]).includes(mk) || S.transactions.some(t=>t.billId===b.id && monthKey(t.timestamp)===mk); }
function billPaidTx(b, mk){ return S.transactions.find(t=>t.billId===b.id && monthKey(t.timestamp)===mk); }

function monthStats(mk){
  const st = { income:0, spent:0, saved:0, withdrawn:0, goalSpent:0, byCat:{}, count:0 };
  for (const t of S.transactions) {
    if (t.prepaid || monthKey(t.timestamp)!==mk) continue;
    st.count++;
    if (t.type==='income') st.income+=t.amount;
    else if (t.type==='expense') {
      if (t.fromGoalId) st.goalSpent+=t.amount;
      else { st.spent+=t.amount; const k=t.categoryId||'_'; st.byCat[k]=(st.byCat[k]||0)+t.amount; }
    }
    if (isSavingTx(t)) st.saved+=t.amount;
    if (isWithdrawTx(t)) st.withdrawn+=t.amount;
  }
  ['income','spent','saved','withdrawn','goalSpent'].forEach(k=>st[k]=r2(st[k]));
  st.netSaved = r2(st.saved-st.withdrawn);
  st.rate = st.income>0 ? st.netSaved/st.income : null;
  return st;
}

function freeToSpend(mk, stats){
  const active = S.bills.filter(b=>billActiveIn(b,mk));
  const pend = active.filter(b=>!billPaid(b,mk));
  const pendIn = r2(pend.filter(b=>b.type==='income').reduce((s,b)=>s+b.amount,0));
  // valor de fatura que já existia antes de usar o app (não está em "já gasto") e vence até este mês
  let cardOld = 0;
  cardAccs().forEach(c=>Object.keys(c.openings||{}).forEach(k=>{ if (k<=mk) { const inv=invoiceInfo(c,k); cardOld += Math.min(c.openings[k], inv.remaining); } }));
  const pendOut = r2(pend.filter(b=>b.type!=='income').reduce((s,b)=>s+b.amount,0) + cardOld);
  // Com salário cadastrado nas Fixas, usa o real + o que falta receber; senão, usa a renda prevista como piso
  const hasIncomeBills = active.some(b=>b.type==='income');
  let expected = r2(stats.income + pendIn), usedPlan=false;
  if (!hasIncomeBills && S.settings.income > expected) { expected=S.settings.income; usedPlan=true; }
  const target = r2(expected*(S.settings.savePercent||0)/100);
  const savePending = r2(Math.max(0, target - stats.netSaved));
  const saveBlock = r2(Math.max(target, stats.netSaved)); // o que já foi guardado + o que falta guardar
  const free = r2(expected - stats.spent - pendOut - saveBlock);
  const now = new Date(); const dim = daysInMonth(mk);
  const daysLeft = mk===curMK() ? dim-now.getDate()+1 : dim;
  return { expected, usedPlan, pendIn, pendOut, target, savePending, saveBlock, saved:stats.netSaved, free, daysLeft, perDay: r2(free/Math.max(1,daysLeft)), spent:stats.spent };
}

function weeklyStreak(){
  const weeks = new Set(S.transactions.filter(isSavingTx).map(t=>weekKey(t.timestamp)));
  const cur = weekKey(Date.now());
  const res = { current:0, best:0, shields:0, thisWeek:weeks.has(cur), hist:[] };
  if (!weeks.size) { for(let i=11;i>=0;i--) res.hist.push({wk:addWeek(cur,-i),st:i===0?'cur':''}); return res; }
  let wk = [...weeks].sort()[0]; let streak=0, shields=0, earned=0; const map={};
  while (wk<=cur) {
    if (weeks.has(wk)) { streak++; map[wk]='on'; if (streak%4===0 && shields<2) { shields++; earned++; } }
    else if (wk!==cur) {
      if (streak>0 && shields>0) { shields--; map[wk]='sh'; } else { streak=0; map[wk]=''; }
    } else map[wk]='cur';
    res.best=Math.max(res.best,streak); wk=addWeek(wk);
  }
  res.current=streak; res.shields=shields;
  for (let i=11;i>=0;i--){ const w=addWeek(cur,-i); res.hist.push({ wk:w, st: w===cur ? (weeks.has(cur)?'on cur':'cur') : (map[w]||'') }); }
  return res;
}

function levelOf(xp){
  let n=1; while (n<LEVELS.length && xp>=LEVELS[n]) n++;
  const lo=LEVELS[n-1], hi=LEVELS[n]??(lo+2000);
  return { n, title:LEVEL_TITLES[n-1]||'Lenda', xp, lo, hi, pct:pct(xp-lo,hi-lo), toNext:hi-xp };
}

function phaseDone(ph, D){
  if (S.settings.phasesDone.includes(ph.id)) return true;
  if (!ph.auto) return false;
  if (ph.auto.kind==='reserve') return D.reserve>=ph.auto.value;
  if (ph.auto.kind==='reservePct') return D.reservePct>=ph.auto.value;
  return false;
}

function derive(){
  const D = {};
  D.mk = curMK();
  D.balance = r2(S.accounts.reduce((s,a)=>s+a.balance,0));
  D.reserve = r2(S.accounts.filter(isReserveAcc).reduce((s,a)=>s+a.balance,0));
  D.goalsSaved = r2(S.goals.filter(g=>!g.done).reduce((s,g)=>s+g.saved,0));
  D.net = r2(D.balance + D.goalsSaved);
  D.reservePct = pct(D.reserve, S.settings.reserveGoal);
  D.stats = monthStats(D.mk);
  D.prev = monthStats(addMonths(D.mk,-1));
  D.free = freeToSpend(D.mk, D.stats);
  D.savingTxs = S.transactions.filter(isSavingTx);
  D.streak = weeklyStreak();
  // dias em que entrou dinheiro e guardou no mesmo dia
  const incDays = new Set(S.transactions.filter(t=>t.type==='income' && !isReserveId(t.accountId)).map(t=>isoFromTs(t.timestamp)));
  D.payFirstDays = new Set(D.savingTxs.map(t=>isoFromTs(t.timestamp)).filter(d=>incDays.has(d))).size;
  // meses fechados
  D.past = [];
  if (S.transactions.length) {
    const first = monthKey(Math.min(...S.transactions.map(t=>t.timestamp)));
    for (let mk=first; mk<D.mk; mk=addMonths(mk,1)) {
      const st = monthStats(mk);
      const budCats = S.categories.filter(c=>c.type==='expense' && c.budget>0);
      const end = new Date(+mk.slice(0,4), +mk.slice(5,7), 1).getTime();
      const bills = S.bills.filter(b=>billActiveIn(b,mk) && b.type!=='income' && (b.createdAt||0) < end);
      D.past.push({ mk, st,
        rateOk: st.income>0 && st.rate*100 >= (S.settings.savePercent||1),
        budgetOk: st.spent>0 && budCats.length>0 && budCats.every(c=>(st.byCat[c.id]||0)<=c.budget),
        billsOk: bills.length>0 && bills.every(b=>{ if ((b.paidMarks||[]).includes(mk)) return true; const t=billPaidTx(b,mk); return t && new Date(t.timestamp).getDate()<=b.day; }),
      });
    }
  }
  D.phasesDone = S.phases.filter(p=>phaseDone(p,D)).length;
  // ---- XP: só comportamento saudável ----
  const xp = { reg:0, save:0, bills:0, months:0, goals:0, ms:0, streak:0, phases:0 };
  const regByMonth = {};
  S.transactions.forEach(t=>{
    if (t.type==='expense'||t.type==='income') { const mk=monthKey(t.timestamp); regByMonth[mk]=(regByMonth[mk]||0)+2; }
    if (t.billId) { const b=S.bills.find(b=>b.id===t.billId); if (b && b.type!=='income' && new Date(t.timestamp).getDate()<=b.day) xp.bills+=5; }
  });
  xp.reg = Object.values(regByMonth).reduce((s,v)=>s+Math.min(40,v),0);
  D.savingTxs.forEach(t=>{ xp.save += 10 + Math.min(40, Math.floor(t.amount/20)); });
  D.past.forEach(m=>{ if(m.rateOk) xp.months+=60; if(m.budgetOk) xp.months+=40; if(m.billsOk) xp.months+=30; });
  xp.goals = S.goals.filter(g=>g.done).length*100;
  xp.ms = MILESTONES.filter(m=>D.reservePct>=m).length*25;
  xp.streak = D.streak.best*15;
  xp.phases = D.phasesDone*30;
  D.xpParts = xp;
  D.xp = Object.values(xp).reduce((s,v)=>s+v,0);
  D.level = levelOf(D.xp);
  return D;
}

function renderBillsCard(){
  const mk = D.mk; const today = new Date().getDate(); const dim = daysInMonth(mk);
  const bills = S.bills.filter(b=>billActiveIn(b,mk)).map(b=>{
    const day = Math.min(b.day, dim); const paid = billPaid(b,mk);
    const left = billRemaining(b);
    let tag;
    if (paid) tag = `<span class="pill-tag ok">✓ ${b.type==='income'?'recebido':'pago'}</span>`;
    else if (day<today) tag = `<span class="pill-tag bad">⚠ atrasada · dia ${day}</span>`;
    else if (day-today<=3) tag = `<span class="pill-tag warn">${day===today?'vence hoje':`vence em ${day-today}d`}</span>`;
    else tag = `<span class="pill-tag">dia ${day}</span>`;
    if (b.endMk) tag += ` <span class="pill-tag move">${paid ? (left?`faltam ${left}`:'quitada 🎉') : left===1?'última parcela':`faltam ${left}`}</span>`;
    return { b, day, paid, tag };
  }).sort((x,y)=>(x.paid-y.paid)||(x.day-y.day));
  if (!bills.length) return `<div class="card" style="order:5"><div class="card-h"><div class="card-t">📅 Contas do mês</div></div><div class="empty">Cadastre aluguel, internet, salário… e pague com 1 toque todo mês.<br><button class="btn sm mt12" onclick="go('planejar');setPlan('fixas');openBillModal()">+ Conta fixa</button></div></div>`;
  const pendOut = bills.filter(x=>!x.paid && x.b.type!=='income').length;
  return `<div class="card" style="order:5"><div class="card-h"><div class="card-t">📅 Contas do mês</div><span class="tiny b muted">${pendOut?`${pendOut} a pagar`:'tudo pago ✓'}</span></div>
    ${bills.map(({b,paid,tag})=>{ const c=catById(b.categoryId)||{icon:b.type==='income'?'💰':'📄'};
      const inc = b.type==='income';
      return `<div class="bill ${paid?'paid':''}"><div class="ico">${esc(c.icon)}</div>
        <div class="grow"><div class="nm">${esc(b.name)}</div><div class="row wrap" style="gap:6px;margin-top:3px"><span class="b num small ${inc?'val in':''}">${fmt(b.amount)}</span>${tag}</div></div>
        ${paid?`<button class="ic-btn" title="Desfazer" onclick="unpayBill('${b.id}')">↩</button>`:`<div class="bill-acts"><button class="btn sm ${inc?'green':''}" onclick="payBill('${b.id}')" title="Lança o valor agora">${inc?'Recebi':'Pagar'}</button><button class="btn sm line" onclick="markBillPaid('${b.id}')" title="Só marca, sem lançar valor">${inc?'Já recebi':'Já pago'}</button></div>`}
      </div>`; }).join('')}
    ${bills.some(x=>!x.paid)?`<p class="tiny muted b mt8">“${'Pagar'}” lança o valor agora · “Já pago” só marca (se você pagou antes ou já lançou).</p>`:''}</div>`;
}

function milestoneBar(cur, target, cls=''){
  const p = pct(cur,target);
  return `<div class="bar ${cls}"><i style="width:${p}%"></i></div>
    <div class="milestones">${[0,...MILESTONES].map(m=>`<div class="ms ${p>=m?'hit':''}" style="left:${m}%">${m}%</div>`).join('')}</div>`;
}
function nextMilestone(cur,target){
  const p = pct(cur,target); const m = MILESTONES.find(x=>p<x);
  if (!m) return '🏆 Meta atingida!';
  const need = r2(target*m/100 - cur);
  return `Próximo marco: <b>${m}%</b> — faltam <b>${fmt(need)}</b>`;
}

function renderBudgetCard(){
  const st = D.stats;
  const cats = S.categories.filter(c=>c.type==='expense');
  const withB = cats.filter(c=>c.budget>0).map(c=>({c, v:st.byCat[c.id]||0}));
  const noB = cats.filter(c=>!(c.budget>0) && st.byCat[c.id]).map(c=>({c,v:st.byCat[c.id]})).sort((a,b)=>b.v-a.v);
  const other = st.byCat['_'] ? [{ c:{icon:'📦',name:'Sem categoria'}, v:st.byCat['_'] }] : [];
  const rows = [...withB.sort((a,b)=>b.v/b.c.budget-a.v/a.c.budget), ...noB, ...other].slice(0,9);
  if (!rows.length) return `<div class="card" style="order:6"><div class="card-h"><div class="card-t">🎯 Gastos por categoria</div></div><div class="empty">Sem gastos este mês. Defina limites em Planejar → Orçamento.</div></div>`;
  const maxNo = Math.max(1,...rows.filter(r=>!(r.c.budget>0)).map(r=>r.v));
  return `<div class="card" style="order:6"><div class="card-h"><div class="card-t">🎯 Gastos por categoria</div><button class="link" onclick="go('planejar');setPlan('orcamento')">limites →</button></div>
    ${rows.map(({c,v})=>{
      if (c.budget>0) {
        const p = v/c.budget*100; const cls = p>100?'bad':p>=80?'warn':'';
        const right = p>100 ? `<span style="color:var(--bad)">⚠ estourou ${fmt(v-c.budget)}</span>` : `${fmt(v)} <span class="muted">/ ${fmt(c.budget)}</span>`;
        return `<div class="bud ${cls}"><div class="top"><span>${esc(c.icon)} ${esc(c.name)}</span><span class="num">${right}</span></div><div class="track"><i style="width:${Math.min(100,p)}%"></i></div>${p<=100?`<div class="tiny muted b" style="margin-top:3px">resta ${fmt(c.budget-v)}</div>`:''}</div>`;
      }
      return `<div class="bud nolimit"><div class="top"><span>${esc(c.icon)} ${esc(c.name)}</span><span class="num">${fmt(v)} <span class="muted tiny">sem limite</span></span></div><div class="track"><i style="width:${v/maxNo*100}%"></i></div></div>`;
    }).join('')}</div>`;
}

/* gráfico de colunas SVG (sem bibliotecas) */
function drawFlowChart(el){
  if (!el) return;
  const months = []; for (let i=5;i>=0;i--) months.push(addMonths(D.mk,-i));
  const data = months.map(mk=>{ const s=monthStats(mk); return { mk, inc:s.income, out:r2(s.spent+s.goalSpent), saved:s.netSaved }; });
  const max = Math.max(100,...data.map(d=>Math.max(d.inc,d.out)));
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); return Math.ceil(max/p)*p; })();
  const W=Math.max(300, Math.min(640, el.clientWidth || (innerWidth-64))),H=210,L=46,R=6,T=10,B=26, cw=(W-L-R)/6, bw=Math.min(26,(cw-18)/2);
  const y = v => T+(H-T-B)*(1-v/nice);
  const bar = (x,v,color) => { const h=(H-B)-y(v); if (h<=0.5) return ''; const r=Math.min(4,h,bw/2); const yy=y(v);
    return `<path d="M${x},${H-B} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${H-B} Z" fill="${color}"/>`; };
  let g = '';
  for (let i=0;i<=4;i++){ const v=nice*i/4, yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e2e8f0" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" font-weight="700" fill="#94a3b8">${fmtK(v)}</text>`; }
  data.forEach((d,i)=>{
    const cx = L+cw*i+cw/2;
    g += bar(cx-bw-1, d.inc, '#0f9d76') + bar(cx+1, d.out, '#e0644f');
    g += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="800" fill="${d.mk===D.mk?'#334155':'#94a3b8'}">${mkLabel(d.mk,false)}</text>`;
    g += `<rect x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent" data-i="${i}" class="hit"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas dos últimos 6 meses">${g}</svg><div class="tip" id="flowTip"></div>`;
  const tip = el.querySelector('.tip'); const svg = el.querySelector('svg');
  el.querySelectorAll('.hit').forEach(r=>{
    const show = () => { const d=data[+r.dataset.i]; const bb=svg.getBoundingClientRect(); const sc=bb.width/W;
      tip.innerHTML = `<b>${mkLabel(d.mk)}</b><br>↑ Entradas ${fmt(d.inc)}<br>↓ Saídas ${fmt(d.out)}<br>= Sobra ${fmt(d.inc-d.out)}`;
      tip.style.left = Math.min(bb.width-70, Math.max(70,(L+cw*(+r.dataset.i)+cw/2)*sc))+'px'; tip.style.top = (y(Math.max(d.inc,d.out))*sc-6)+'px'; tip.classList.add('on'); r.setAttribute('fill','rgba(101,121,144,.06)'); };
    const hide = () => { tip.classList.remove('on'); r.setAttribute('fill','transparent'); };
    r.addEventListener('mouseenter',show); r.addEventListener('mouseleave',hide);
    r.addEventListener('touchstart',e=>{ el.querySelectorAll('.hit').forEach(x=>x.setAttribute('fill','transparent')); show(); },{passive:true});
  });
}

/* ---------------- LINHA DE LANÇAMENTO ---------------- */
function txLabels(t){
  const c = catOf(t);
  const acc = id => { const a=accById(id); return a?`${a.emoji||'🏦'} ${a.name}`:'conta excluída'; };
  const goal = id => { const g=goalById(id); return g?`${g.emoji} ${g.name}`:'caixinha'; };
  let where;
  if (t.type==='transfer') where = `${t.fromGoalId?goal(t.fromGoalId):acc(t.accountId)} → ${t.toGoalId?goal(t.toGoalId):acc(t.toAccountId)}`;
  else if (t.fromGoalId) where = `pago com ${goal(t.fromGoalId)}`;
  else where = acc(t.accountId);
  const title = t.desc || (t.type==='transfer' ? (isSavingTx(t)?'Guardado':isWithdrawTx(t)?'Retirado':'Transferência') : c.name);
  return { c, where, title };
}
function txRow(t){
  const { c, where, title } = txLabels(t);
  const d = new Date(t.timestamp);
  const cls = t.type==='income'?'in':t.type==='expense'?'out':'move';
  const sign = t.type==='income'?'+ ':t.type==='expense'?'− ':'';
  const bg = t.type==='income'?'var(--in-soft)':t.type==='expense'?'var(--out-soft)':'var(--move-soft)';
  return `<div class="tx" onclick="openSheet({editId:'${t.id}'})"><div class="ico" style="background:${bg}">${esc(c.icon)}</div>
    <div class="grow"><div class="d1">${esc(title)}</div><div class="d2">${pad(d.getDate())}/${pad(d.getMonth()+1)} · ${t.inst?`<b>${t.inst}</b> · `:''}${t.type==='transfer'?'':esc(c.name)+' · '}${esc(where)}${t.prepaid?' · paga antes do app':''}</div></div>
    <div class="val ${cls} num">${sign}${fmt(t.amount)}</div></div>`;
}

/* ---------------- EXTRATO ---------------- */
function renderExtrato(){
  const list = S.transactions.filter(t=>{
    if (EX.mk!=='all' && monthKey(t.timestamp)!==EX.mk) return false;
    if (EX.type!=='all' && t.type!==EX.type) return false;
    if (EX.cat!=='all' && t.categoryId!==EX.cat) return false;
    if (EX.q) { const {c,where,title}=txLabels(t); if (!(`${title} ${c.name} ${where} ${t.amount}`).toLowerCase().includes(EX.q.toLowerCase())) return false; }
    return true;
  }).sort((a,b)=>b.timestamp-a.timestamp);
  const inc = r2(list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
  const out = r2(list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
  const today = isoFromTs(Date.now()), yest = isoFromTs(Date.now()-864e5);
  let groups = '', lastDay = null, dayTot = {};
  list.forEach(t=>{ const k=isoFromTs(t.timestamp); dayTot[k]=(dayTot[k]||0)+(t.type==='expense'?t.amount:0); });
  list.forEach(t=>{
    const k = isoFromTs(t.timestamp);
    if (k!==lastDay) { lastDay=k; const d=new Date(t.timestamp);
      const lbl = k===today?'Hoje':k===yest?'Ontem':`${WEEKDAYS[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
      groups += `<div class="day-h"><span>${lbl}</span>${dayTot[k]?`<span>− ${fmt(dayTot[k])}</span>`:''}</div>`; }
    groups += txRow(t);
  });
  const cats = S.categories;
  $('tab-extrato').innerHTML = `<div class="card">
    <div class="month-nav">
      <button onclick="exNav(-1)" ${EX.mk==='all'?'disabled':''}>‹</button>
      <div class="center"><h3>${EX.mk==='all'?'Todo o período':mkLabel(EX.mk)}</h3><button class="link" onclick="EX.mk=EX.mk==='all'?curMK():'all';renderExtrato()">${EX.mk==='all'?'ver por mês':'ver tudo'}</button></div>
      <button onclick="exNav(1)" ${EX.mk==='all'||EX.mk>=curMK()?'disabled':''}>›</button>
    </div>
    <input class="inp" placeholder="🔎 Buscar (descrição, categoria, valor…)" value="${esc(EX.q)}" oninput="EX.q=this.value;renderExtratoDebounced()" id="exSearch">
    <div class="chips mt8">
      ${[['all','Todos'],['expense','↓ Gastos'],['income','↑ Entradas'],['transfer','⇄ Movimentos']].map(([k,l])=>`<button class="chip ${EX.type===k?'on':''}" onclick="EX.type='${k}';renderExtrato()">${l}</button>`).join('')}
      <select class="chip" onchange="EX.cat=this.value;renderExtrato()" style="appearance:auto"><option value="all">Todas categorias</option>${cats.map(c=>`<option value="${c.id}" ${EX.cat===c.id?'selected':''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}</select>
    </div>
    <div class="sumline"><div><div class="k">Entradas</div><div class="v num" style="color:var(--in)">${fmt(inc)}</div></div><div><div class="k">Gastos</div><div class="v num">${fmt(out)}</div></div><div><div class="k">Sobra</div><div class="v num" style="color:${inc-out>=0?'var(--in)':'var(--bad)'}">${fmt(inc-out)}</div></div></div>
    <div class="row between"><span class="tiny muted b">${list.length} lançamento${list.length===1?'':'s'} · toque para editar</span><button class="link" onclick="exportCSV()">⬇ CSV</button></div>
    <div class="mt8">${groups || '<div class="empty">Nenhum lançamento neste filtro.</div>'}</div>
  </div>`;
  if (document.activeElement && document.activeElement.id==='exSearch') {}
}
let _exT; function renderExtratoDebounced(){ clearTimeout(_exT); _exT=setTimeout(()=>{ renderExtrato(); const i=$('exSearch'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },250); }

function runSim(){
  const ini = parseMoney($('simIni').value)||0, mon = parseMoney($('simMon').value)||0;
  const n = parseInt($('simMonths').value)||0, rate = parseMoney($('simRate').value)||0;
  S.settings.simRate = rate; persist();
  const i = Math.pow(1+rate/100,1/12)-1;
  let tot = ini; for (let k=0;k<n;k++) tot = tot*(1+i)+mon;
  const inv = ini+mon*n;
  // quanto tempo até a meta da reserva
  let m=0, t=ini; const goal=S.settings.reserveGoal;
  if (mon>0||i>0) while (t<goal && m<600) { t=t*(1+i)+mon; m++; }
  const when = t>=goal ? (m===0?'Você já atingiu a meta da reserva! 🏰':`Nesse ritmo, a reserva de ${fmt(goal)} fica completa em <b>${m} ${m===1?'mês':'meses'}</b> (${mkLabel(addMonths(curMK(),m))}).`) : '';
  $('simOut').innerHTML = `<div class="sim-res"><div class="small b">Em ${n} meses você terá</div><div class="big num">${fmt(tot)}</div>
    <div class="small b muted">${fmt(inv)} do seu bolso + <span style="color:#05664b">${fmt(tot-inv)} de rendimento</span></div>${when?`<p class="small b mt12">${when}</p>`:''}</div>`;
}
