/* ---------------- LANÇAMENTO RÁPIDO (SHEET) ---------------- */
const SH = { mode:'expense', editId:null, catId:null, from:null, to:null, date:null, showAll:false };
function defaultAccId(){ const l=S.settings.lastAccountId; if (l && accById(l)) return l; const n=bankAccs().find(a=>!isReserveAcc(a)); return (n||bankAccs()[0]||S.accounts[0]||{}).id||null; }

function openSheet(opts={}){
  if (!S.accounts.length) { toast('Cadastre primeiro uma conta (banco ou carteira).',{err:true}); go('planejar'); setPlan('contas'); openAccountModal(); return; }
  Object.assign(SH,{ mode:'expense', editId:null, catId:null, from:defaultAccId(), to:null, date:isoFromTs(Date.now()), showAll:false, inst:1 });
  $('shAmount').value=''; $('shDesc').value='';
  if (opts.editId) {
    const t = S.transactions.find(x=>x.id===opts.editId); if (!t) return;
    SH.editId=t.id; SH.date=isoFromTs(t.timestamp); SH.catId=t.categoryId||null;
    $('shAmount').value=moneyInput(t.amount); $('shDesc').value=t.desc||'';
    if (t.type==='transfer') { SH.mode='save'; SH.from=t.fromGoalId?'goal:'+t.fromGoalId:t.accountId; SH.to=t.toGoalId?'goal:'+t.toGoalId:'acc:'+t.toAccountId; }
    else { SH.mode=t.type; SH.from=t.fromGoalId?'goal:'+t.fromGoalId:t.accountId; }
  } else {
    if (opts.mode) SH.mode=opts.mode;
    if (opts.to) SH.to=opts.to;
    if (opts.amount) $('shAmount').value=moneyInput(opts.amount);
    if (opts.from) SH.from=opts.from;
    if (SH.mode==='save' && !SH.to) { const r=S.accounts.find(isReserveAcc); const g=goalById(S.settings.focusGoalId); SH.to = g&&!g.done?'goal:'+g.id : r?'acc:'+r.id : null; }
    if (SH.mode==='save' && SH.from && isReserveId(SH.from) && SH.to && SH.to.startsWith('acc:')) { const n=bankAccs().find(a=>!isReserveAcc(a)); if(n) SH.from=n.id; }
    if (SH.mode!=='expense' && isCardId(SH.from)) SH.from=(bankAccs().find(a=>!isReserveAcc(a))||bankAccs()[0]||{}).id;
  }
  renderSheet();
  $('sheetOv').classList.add('on');
  setTimeout(()=>{ if(!SH.editId) $('shAmount').focus(); },80);
}
function closeSheet(){ $('sheetOv').classList.remove('on'); }
function setMode(m){ SH.mode=m; SH.catId=null; SH.inst=1; if (m!=='expense' && isCardId(SH.from)) SH.from=(bankAccs().find(a=>!isReserveAcc(a))||bankAccs()[0]||{}).id; if(m==='save'&&!SH.to){ const r=S.accounts.find(isReserveAcc); const g=goalById(S.settings.focusGoalId); SH.to=g&&!g.done?'goal:'+g.id:r?'acc:'+r.id:null; } renderSheet(); }

function shortcutsFor(mode){
  const cutoff = Date.now()-120*864e5, map = {};
  S.transactions.filter(t=>t.type===mode && t.timestamp>cutoff && !t.billId && !t.fromGoalId && !t.groupId && t.categoryId).forEach(t=>{
    const k=[t.categoryId,(t.desc||'').trim().toLowerCase(),t.amount].join('|');
    if(!map[k]) map[k]={ n:0, last:0, t }; map[k].n++; if(t.timestamp>map[k].last){ map[k].last=t.timestamp; map[k].t=t; }
  });
  return Object.values(map).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n||b.last-a.last).slice(0,6).map(x=>x.t);
}

function renderSheet(){
  const editing = !!SH.editId; const t = editing ? S.transactions.find(x=>x.id===SH.editId) : null;
  const goalLocked = t && (t.fromGoalId || (t.type==='expense' && t.fromGoalId));
  $('shTitle').textContent = editing ? 'Editar lançamento' : 'Novo lançamento';
  document.querySelectorAll('#shSeg button').forEach(b=>{ b.classList.toggle('on', b.dataset.mode===SH.mode); b.disabled = !!goalLocked; });
  const accOpts = (sel, list=S.accounts) => list.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.emoji||'🏦')} ${esc(a.name)}</option>`).join('');
  const today=isoFromTs(Date.now()), yest=isoFromTs(Date.now()-864e5);
  let meta = `<button class="chip ${SH.date===today?'on':''}" onclick="SH.date='${today}';renderSheet()">Hoje</button>
    <button class="chip ${SH.date===yest?'on':''}" onclick="SH.date='${yest}';renderSheet()">Ontem</button>
    <input type="date" value="${SH.date}" onchange="SH.date=this.value;renderSheet()">`;
  if (SH.mode!=='save' && !goalLocked) {
    const list = SH.mode==='expense' ? S.accounts : bankAccs();
    meta += `<select onchange="SH.from=this.value;SH.inst=1;renderSheet()" title="Conta">${list.map(a=>`<option value="${a.id}" ${SH.from===a.id?'selected':''}>${isCard(a)?'💳':esc(a.emoji||'🏦')} ${esc(a.name)}${isCard(a)?' (crédito)':''}</option>`).join('')}</select>`;
  }
  $('shMeta').innerHTML = meta;

  // atalhos
  const sc = (!editing && SH.mode!=='save') ? shortcutsFor(SH.mode) : [];
  $('shShortcuts').innerHTML = sc.length ? `<div class="tiny muted b mb12" style="margin-bottom:6px">⚡ Atalhos (1 toque lança)</div><div class="chips" style="margin-bottom:12px">${sc.map(t=>{ const c=catOf(t); return `<button class="chip" onclick="quickRepeat('${t.id}')">${esc(c.icon)} ${esc(t.desc||c.name)} · ${fmt(t.amount)}</button>`; }).join('')}</div>` : '';

  let body = '', actions = '';
  if (SH.mode==='save') {
    const dests = [];
    S.accounts.filter(isReserveAcc).forEach(a=>dests.push({ k:'acc:'+a.id, l:`🛡️ ${a.name}`, r:fmt(a.balance) }));
    S.goals.filter(g=>!g.done).forEach(g=>dests.push({ k:'goal:'+g.id, l:`${g.emoji} ${g.name}`, r:`${fmt(g.saved)} / ${fmt(g.target)}` }));
    const others = bankAccs().filter(a=>!isReserveAcc(a)).map(a=>({ k:'acc:'+a.id, l:`${a.emoji||'🏦'} ${a.name}`, r:fmt(a.balance) }));
    const fromList = bankAccs();
    const fromSel = SH.from && String(SH.from).startsWith('goal:') ? '' : SH.from;
    body = `<div class="field"><label>De onde sai</label><select class="inp" onchange="SH.from=this.value;renderSheet()">
        ${String(SH.from).startsWith('goal:')?`<option selected value="${SH.from}">${esc((goalById(SH.from.slice(5))||{}).name||'caixinha')}</option>`:''}${accOpts(fromSel, fromList)}</select></div>
      <div class="field"><label>Para onde vai</label><div class="dest">
        ${dests.length?dests.map(d=>`<button class="${SH.to===d.k?'on':''}" onclick="SH.to='${d.k}';renderSheet()">${esc(d.l)}<span class="r">${d.r}</span></button>`).join(''):'<div class="small muted b">Crie uma caixinha ou marque uma conta como Reserva.</div>'}
        ${others.length?`<div class="tiny muted b mt8">Só transferir entre contas:</div>${others.filter(o=>o.k!=='acc:'+SH.from).map(d=>`<button class="${SH.to===d.k?'on':''}" onclick="SH.to='${d.k}';renderSheet()">${esc(d.l)}<span class="r">${d.r}</span></button>`).join('')}`:''}
      </div></div>`;
    const isSave = SH.to && (SH.to.startsWith('goal:') || isReserveId(SH.to.slice(4)));
    actions = `<button class="btn block ${isSave?'':'ghost'}" style="padding:15px" onclick="commitSheet()">${editing?'Salvar':isSave?'🐷 Guardar':'⇄ Transferir'}</button>`;
  } else {
    const cats = S.categories.filter(c=>c.type===SH.mode);
    const fav = cats.filter(c=>c.fav).slice(0,8), rest = cats.filter(c=>!fav.includes(c));
    const shown = SH.showAll || (SH.catId && rest.some(c=>c.id===SH.catId)) ? [...fav,...rest] : fav;
    const cardSel = SH.mode==='expense' && !editing && isCardId(SH.from);
    const N = [1,2,3,4,5,6,8,10,12];
    const instHtml = cardSel ? `<div class="inst-box"><div class="tiny b" style="margin-bottom:6px">💳 Parcelas</div>
      <div class="chips">${N.map(n=>`<button class="chip ${SH.inst===n?'on':''}" onclick="SH.inst=${n};renderSheet()">${n===1?'À vista':n+'x'}</button>`).join('')}<input class="chip" style="width:74px;text-align:center" inputmode="numeric" placeholder="outro" value="${N.includes(SH.inst)?'':SH.inst}" onchange="SH.inst=Math.max(1,Math.min(48,parseInt(this.value)||1));renderSheet()"></div>
      <div class="tiny b mt8" id="instPrev" style="color:var(--move)"></div></div>` : '';
    body = instHtml + `<div class="hint">${editing?'Escolha a categoria e toque em Salvar':'Digite o valor <b>total</b> e <b>toque na categoria</b> para lançar'}</div>
      <div class="cats">${shown.map(c=>`<button class="cat ${SH.catId===c.id?'on':''}" onclick="pickCat('${c.id}')"><span class="e">${esc(c.icon)}</span><span>${esc(c.name).replace(/\//g,'/\u200b')}</span></button>`).join('')}
      ${rest.length && !(SH.showAll || (SH.catId && rest.some(c=>c.id===SH.catId)))?`<button class="cat" onclick="SH.showAll=true;renderSheet()"><span class="e">⋯</span><span>Mais (${rest.length})</span></button>`:''}</div>`;
    if (editing) actions = `<button class="btn block mt12" style="padding:15px" onclick="commitSheet()">Salvar</button>`;
    if (goalLocked) body = `<p class="small muted b center">Compra feita com dinheiro da caixinha. Você pode ajustar valor, data e descrição.</p>`, actions = `<button class="btn block mt12" onclick="commitSheet()">Salvar</button>`;
  }
  if (editing && t && t.groupId && isCardId(t.accountId) && futureInstallments(t.groupId).length) actions += `<button class="btn ghost block mt8" onclick="openAnticipate('${t.groupId}')">⏩ Antecipar parcelas (com desconto)</button>`;
  if (editing) actions += `<button class="btn line block mt8" style="color:var(--bad)" onclick="deleteTx('${SH.editId}')">🗑️ Excluir lançamento</button>`;
  $('shBody').innerHTML = body; $('shActions').innerHTML = actions;
  instPreview();
}
function instPreview(){
  const el = $('instPrev'); if (!el) return;
  const card = accById(SH.from); const amt = r2(parseMoney($('shAmount').value)||0); const ts = tsFromIso(SH.date);
  const inv = invoiceFor(card, ts), due = dayIn(inv, card.dueDay);
  const n = SH.inst||1;
  el.innerHTML = n===1 ? `Entra na fatura de ${mkLabel(inv,false)} (vence ${ddmm(due)})`
    : `${n}x de ${fmt(amt/n)} · 1ª na fatura de ${mkLabel(inv,false)} · última em ${mkLabel(addMonths(inv,n-1),false)}/${addMonths(inv,n-1).slice(2,4)}`;
}

function pickCat(id){
  SH.catId = id;
  if (SH.editId) { renderSheet(); return; }
  commitSheet();
}

function commitSheet(){
  const amount = r2(parseMoney($('shAmount').value));
  if (!amount || amount<=0) { toast('Digite o valor primeiro 😉',{err:true}); $('shAmount').focus(); return; }
  const desc = $('shDesc').value.trim(); const ts = tsFromIso(SH.date);
  let nt;
  const old = SH.editId ? S.transactions.find(x=>x.id===SH.editId) : null;
  if (SH.mode==='save') {
    if (!SH.to) return toast('Escolha para onde vai o dinheiro.',{err:true});
    const from = String(SH.from||''), to = SH.to;
    if ((from.startsWith('goal:')?from:'acc:'+from)===to) return toast('Origem e destino são iguais.',{err:true});
    nt = { type:'transfer', amount, desc, timestamp:ts };
    if (from.startsWith('goal:')) nt.fromGoalId=from.slice(5); else nt.accountId=from;
    if (to.startsWith('goal:')) nt.toGoalId=to.slice(5); else nt.toAccountId=to.slice(4);
  } else if (old && old.fromGoalId) {
    nt = { ...old, amount, desc, timestamp:ts };
  } else {
    if (!SH.catId) return toast('Escolha a categoria.',{err:true});
    nt = { type:SH.mode, amount, desc, timestamp:ts, categoryId:SH.catId, accountId:SH.from };
  }
  const before = progressSnapshot();
  if (old) {
    applyTx(old,-1);
    ['accountId','toAccountId','fromGoalId','toGoalId','categoryId','category'].forEach(k=>{ if(!(k in nt)) delete old[k]; });
    Object.assign(old, nt, { id:old.id, billId:old.billId });
    finalizeTx(old);
    applyTx(old,+1);
    closeSheet(); commit(); toast('Lançamento atualizado ✓');
    return;
  }
  if (nt.type==='expense' && isCardId(nt.accountId) && (SH.inst||1)>1) {
    const group = addCardPurchase({ ...nt, n:SH.inst });
    S.settings.lastAccountId = nt.accountId;
    closeSheet(); commit();
    const card = accById(nt.accountId);
    toast(`💳 ${SH.inst}x de ${fmt(group[0].amount)} no ${card.name}`, { action:{ label:'Desfazer', fn:()=>{ group.forEach(x=>removeTx(x.id)); commit(); toast('Compra desfeita.'); } } });
    return;
  }
  const t = addTx(nt);
  if (t.accountId && t.type!=='transfer') S.settings.lastAccountId = t.accountId;
  closeSheet(); commit();
  afterNewTx(t, before);
}

function addCardPurchase(base){
  const n = base.n; const gid = uid(); const per = Math.floor(base.amount/n*100)/100; const out=[];
  for (let i=0;i<n;i++){
    const t = { type:'expense', amount: i===n-1 ? r2(base.amount-per*(n-1)) : per, desc:base.desc, categoryId:base.categoryId,
      accountId:base.accountId, timestamp:shiftMonths(base.timestamp,i), purchaseTs:base.timestamp, groupId:gid, inst:`${i+1}/${n}` };
    out.push(addTx(t));
  }
  return out;
}

function quickRepeat(id){
  const src = S.transactions.find(t=>t.id===id); if (!src) return;
  const before = progressSnapshot();
  const t = addTx({ type:src.type, amount:src.amount, desc:src.desc, categoryId:src.categoryId, accountId: accById(src.accountId)?src.accountId:defaultAccId(), timestamp:tsFromIso(SH.date) });
  closeSheet(); commit(); afterNewTx(t, before);
}

function afterNewTx(t, before){
  const c = catOf(t);
  const undo = { label:'Desfazer', fn:()=>{ removeTx(t.id); commit(); toast('Lançamento desfeito.'); } };
  if (isSavingTx(t)) {
    confetti(70);
    const msg = celebrateProgress(before);
    toast(msg || `🐷 ${fmt(t.amount)} guardados!`, { action:undo });
  } else if (t.type==='income') {
    toast(`↑ ${fmt(t.amount)} · ${c.name}`, { action:undo });
    setTimeout(()=>payYourselfFirst(t), 350);
  } else {
    const cat = catById(t.categoryId);
    let extra = '';
    if (cat && cat.budget>0) { const v=monthStats(curMK()).byCat[cat.id]||0; const left=r2(cat.budget-v);
      extra = left>=0 ? ` · resta ${fmt(left)} em ${cat.name}` : ` · ⚠ ${cat.name} estourou ${fmt(-left)}`; }
    const ca = accById(t.accountId);
    if (isCard(ca)) extra += ` · 💳 fatura ${mkLabel(t.cardInvoice,false)}`;
    toast(`${c.icon} ${fmt(t.amount)} lançado${extra}`, { action:undo });
  }
}

function deleteTx(id){
  const t = S.transactions.find(x=>x.id===id); if (!t) return;
  if (t.groupId) {
    const grp = S.transactions.filter(x=>x.groupId===t.groupId);
    const next = grp.filter(x=>x.timestamp>=t.timestamp);
    window._delGrp = { one:[t.id], next:next.map(x=>x.id), all:grp.map(x=>x.id) };
    return openModal(`<div class="center"><div style="font-size:3rem">🗑️</div><h3>Excluir compra parcelada?</h3><p class="small muted b">"${esc(txLabels(t).title)}" · parcela ${t.inst} · ${fmt(t.amount)}</p></div>
      <div class="acts" style="flex-direction:column">
        <button class="btn red" onclick="delGroup('all')">Excluir a compra inteira (${grp.length} parcelas)</button>
        ${next.length>1&&next.length<grp.length?`<button class="btn line" onclick="delGroup('next')">Esta e as próximas (${next.length})</button>`:''}
        <button class="btn line" onclick="delGroup('one')">Só esta parcela</button>
        <button class="btn line" onclick="closeModal()">Cancelar</button></div>`);
  }
  confirmBox({ title:'Excluir lançamento?', text:`"${txLabels(t).title}" · ${fmt(t.amount)}. Os saldos serão corrigidos.`, ok:'Excluir' }, ()=>{
    removeTx(id); closeSheet(); commit(); toast('Lançamento excluído.');
  });
}

// parcelas ainda não lançadas na fatura aberta (futuras), da última para a primeira — como o Nubank
function futureInstallments(gid){
  const grp = S.transactions.filter(t=>t.groupId===gid && t.type==='expense' && !t.prepaid);
  if (!grp.length) return [];
  const card = accById(grp[0].accountId); if (!card) return [];
  const open = invoiceFor(card, Date.now());
  return grp.filter(t=>t.cardInvoice>open).sort((a,b)=>b.timestamp-a.timestamp);
}
function openAnticipate(gid){
  const fut = futureInstallments(gid); if (!fut.length) return toast('Não há parcelas futuras para antecipar.',{err:true});
  const any = fut[0]; const card = accById(any.accountId); const title = txLabels(any).title;
  const total = String(any.inst).split('/')[1];
  window._ant = { gid, fut };
  openModal(`<h3>⏩ Antecipar parcelas</h3>
    <p class="small muted b">${esc(title)} · ${fut.length} parcela${fut.length>1?'s':''} futura${fut.length>1?'s':''} de ${total} · ${esc(card.name)}</p>
    <div class="field mt12"><label>Quantas antecipar (a partir da última)</label>
      <div class="row"><button class="btn line sm" onclick="antStep(-1)">−</button><input class="inp center" id="antN" inputmode="numeric" value="${fut.length}" oninput="antUpd()" style="max-width:90px"><button class="btn line sm" onclick="antStep(1)">+</button><span class="small muted b grow" id="antWhich"></span></div></div>
    <div class="grid2"><div class="field"><label>Valor original</label><input class="inp" id="antOrig" disabled></div>
      <div class="field"><label>Valor com desconto (R$)</label><input class="inp" id="antPay" inputmode="decimal" oninput="antUpd(true)"></div></div>
    <div class="sim-res" style="padding:12px"><div class="small b">Você economiza</div><div class="big num" id="antDisc" style="font-size:1.6rem">R$ 0,00</div></div>
    <p class="tiny muted b mt8">As parcelas escolhidas saem dos próximos meses e entram na fatura de ${mkLabel(invoiceFor(card,Date.now()),false)} com o valor com desconto, como no Nubank.</p>
    <div class="acts"><button class="btn line" onclick="closeModal()">Cancelar</button><button class="btn green" onclick="doAnticipate()">Antecipar</button></div>`);
  antUpd();
}
function antStep(d){ const i=$('antN'); i.value=Math.max(1,Math.min(window._ant.fut.length,(parseInt(i.value)||1)+d)); antUpd(); }
function antUpd(keepPay){
  const n = Math.max(1,Math.min(window._ant.fut.length, parseInt($('antN').value)||1));
  const sel = window._ant.fut.slice(0,n); const orig = r2(sel.reduce((x,t)=>x+t.amount,0));
  $('antOrig').value = fmt(orig);
  $('antWhich').textContent = sel.length ? `parcelas ${sel.map(t=>t.inst.split('/')[0]).reverse().join(', ')}` : '';
  if (!keepPay) $('antPay').value = moneyInput(orig);
  const pay = r2(parseMoney($('antPay').value)||0);
  $('antDisc').textContent = fmt(Math.max(0, orig-pay));
}
function doAnticipate(){
  const { gid, fut } = window._ant;
  const n = Math.max(1,Math.min(fut.length, parseInt($('antN').value)||1));
  const sel = fut.slice(0,n); const orig = r2(sel.reduce((x,t)=>x+t.amount,0));
  const pay = r2(parseMoney($('antPay').value));
  if (!pay || pay<=0 || pay>orig) return toast('Valor com desconto inválido.',{err:true});
  const any = sel[0]; const card = accById(any.accountId);
  const wasPre = !!any.preLimit;
  sel.forEach(t=>removeTx(t.id));
  const nums = sel.map(t=>t.inst.split('/')[0]).reverse(); const total = any.inst.split('/')[1];
  const t = addTx({ type:'expense', amount:pay, desc:any.desc, categoryId:any.categoryId, accountId:card.id, timestamp:Date.now(),
    groupId:gid, inst:`antecip. ${nums.length>1?nums[0]+'–'+nums[nums.length-1]:nums[0]}/${total}`, anticipated:true, discount:r2(orig-pay) });
  // compra de antes do cadastro: o limite já contava o valor cheio, então só libera o desconto
  if (wasPre) card.balance = r2(card.balance + orig);
  closeModal(); closeSheet(); commit(); confetti(90);
  toast(`⏩ ${n} parcela${n>1?'s':''} antecipada${n>1?'s':''}${orig>pay?` · economizou ${fmt(orig-pay)} 🎉`:''}`);
}

function delGroup(k){ (window._delGrp[k]||[]).forEach(id=>removeTx(id)); closeModal(); closeSheet(); commit(); toast('Excluído.'); }

/* pague-se primeiro: logo após uma entrada */
function payYourselfFirst(t){
  const pctv = S.settings.savePercent||0; if (!pctv || t.amount<20 || isReserveId(t.accountId)) return;
  const g = goalById(S.settings.focusGoalId); const r = S.accounts.find(isReserveAcc);
  const dest = (r && D.reservePct<100) ? { k:'acc:'+r.id, l:'🛡️ '+r.name } : (g&&!g.done) ? { k:'goal:'+g.id, l:g.emoji+' '+g.name } : r ? { k:'acc:'+r.id, l:'🛡️ '+r.name } : null;
  if (!dest) return;
  const sug = r2(t.amount*pctv/100);
  openModal(`<div class="center"><div style="font-size:3rem">💰</div><h3>Entrou ${fmt(t.amount)}!</h3>
    <p class="muted b small">Pague-se primeiro: separe agora, antes que o dinheiro vire gasto. Sua regra é guardar <b>${pctv}%</b>.</p>
    <div class="b num" style="font-size:2rem;margin:12px 0;color:var(--in)">${fmt(sug)}</div><p class="small b">→ ${esc(dest.l)}</p></div>
    <div class="acts" style="flex-direction:column"><button class="btn green" onclick="closeModal();doSave(${sug},'${t.accountId}','${dest.k}')">🐷 Guardar ${fmt(sug)} agora</button>
    <div class="row"><button class="btn line grow" onclick="closeModal();openSheet({mode:'save',amount:${sug},from:'${t.accountId}',to:'${dest.k}'})">Outro valor</button><button class="btn line grow" onclick="closeModal()">Agora não</button></div></div>`);
}
function doSave(amount, fromAcc, to){
  const before = progressSnapshot();
  const t = { type:'transfer', amount, accountId:fromAcc, desc:'Pague-se primeiro' };
  if (to.startsWith('goal:')) t.toGoalId=to.slice(5); else t.toAccountId=to.slice(4);
  addTx(t); commit(); afterNewTx(t, before);
}

/* marcos de progresso (efeito gradiente de meta) */
function progressSnapshot(){
  const snap = { reserve: pct(r2(S.accounts.filter(isReserveAcc).reduce((s,a)=>s+a.balance,0)), S.settings.reserveGoal), goals:{} };
  S.goals.forEach(g=>snap.goals[g.id]=pct(g.saved,g.target)); return snap;
}
function celebrateProgress(before){
  const now = progressSnapshot(); const crossed = (a,b)=>MILESTONES.filter(m=>a<m && b>=m).pop();
  const r = crossed(before.reserve, now.reserve);
  if (r) { confetti(160); return r===100 ? '🏰 RESERVA COMPLETA! Você construiu sua fortaleza!' : `🎯 Reserva bateu ${r}%! Marco desbloqueado.`; }
  for (const g of S.goals) { const m = crossed(before.goals[g.id]||0, now.goals[g.id]||0);
    if (m) { confetti(160); return m===100 ? `🎉 ${g.emoji} ${g.name} está pronta! Pode comprar sem culpa.` : `🎯 ${g.emoji} ${g.name} chegou a ${m}%!`; } }
  return null;
}

function payBill(id){
  const b = S.bills.find(x=>x.id===id); if (!b) return;
  const acc = accById(b.accountId) ? b.accountId : defaultAccId();
  const before = progressSnapshot();
  const t = addTx({ type:b.type==='income'?'income':'expense', amount:b.amount, categoryId:b.categoryId, accountId:acc, desc:b.name, billId:b.id });
  commit();
  const late = new Date().getDate() > b.day;
  toast(`${b.type==='income'?'↑ Recebido':'✓ Pago'}: ${b.name} ${fmt(b.amount)}${!late&&b.type!=='income'?' · +5 XP em dia':''}`, { action:{ label:'Desfazer', fn:()=>{ removeTx(t.id); commit(); } } });
  if (t.type==='income') setTimeout(()=>payYourselfFirst(t),350);
}
function markBillPaid(id){
  const b = S.bills.find(x=>x.id===id); if (!b) return; const mk=curMK();
  b.paidMarks = [...new Set([...(b.paidMarks||[]), mk])];
  commit();
  toast(`✓ ${b.name} marcada como ${b.type==='income'?'recebida':'paga'} (sem lançar valor)`, { action:{ label:'Desfazer', fn:()=>{ b.paidMarks=b.paidMarks.filter(x=>x!==mk); commit(); } } });
}
function unpayBill(id){
  const b = S.bills.find(x=>x.id===id); if (!b) return; const mk=curMK();
  if ((b.paidMarks||[]).includes(mk)) { b.paidMarks=b.paidMarks.filter(x=>x!==mk); commit(); toast('Marcação desfeita.'); return; }
  const t = billPaidTx(b, mk); if (!t) return;
  confirmBox({ icon:'↩️', title:'Desfazer pagamento?', text:`O lançamento de ${fmt(t.amount)} de "${b.name}" deste mês será removido.`, ok:'Desfazer' }, ()=>{ removeTx(t.id); commit(); });
}

function billType(t){ window._billType=t; $('bTypeE').classList.toggle('on',t==='expense'); $('bTypeI').classList.toggle('on',t==='income'); const s=$('bCat'); s.innerHTML = t==='income'?s.dataset.i:s.dataset.e; }
function saveBill(id){
  const name=$('bName').value.trim(), amount=r2(parseMoney($('bAmount').value)), day=Math.max(1,Math.min(31,parseInt($('bDay').value)||1));
  if (!name || !amount) return toast('Preencha nome e valor.',{err:true});
  const data = { name, amount, day, type:window._billType, categoryId:$('bCat').value, accountId:$('bAcc').value };
  if ($('bEnd').value==='inst') { const l=parseInt($('bLeft').value); const willBePaid = $('bPaidNow').checked;
    if (isNaN(l) || l<0 || (l===0 && !willBePaid)) return toast('Informe quantas parcelas ainda faltam.',{err:true}); }
  let b;
  if (id) { b=S.bills.find(x=>x.id===id); Object.assign(b,data); b.active = $('bActive') ? $('bActive').checked : true; }
  else { b={ id:uid(), createdAt:Date.now(), active:true, paidMarks:[], ...data }; S.bills.push(b); }
  const mk = curMK(); b.paidMarks = b.paidMarks||[];
  const pn = $('bPaidNow');
  if (pn && !pn.disabled) { if (pn.checked) { if(!b.paidMarks.includes(mk)) b.paidMarks.push(mk); } else b.paidMarks = b.paidMarks.filter(x=>x!==mk); }
  if ($('bEnd').value==='inst') {
    const left = parseInt($('bLeft').value);
    const paidNow = billPaid(b, mk);
    b.endMk = addMonths(mk, paidNow ? left : left-1);
  } else delete b.endMk;
  closeModal(); commit(); toast('Conta fixa salva ✓');
}
function deleteBill(id){ confirmBox({ title:'Excluir conta fixa?', text:'Os pagamentos já lançados continuam no extrato.', ok:'Excluir' }, ()=>{ S.bills=S.bills.filter(b=>b.id!==id); commit(); }); }

function coveredInvoice(closingDay, dueDay){
  const c = { closingDay, dueDay }; const openMk = invoiceFor(c, Date.now()); const prevMk = addMonths(openMk,-1);
  return isoFromTs(Date.now()) <= isoDay(dayIn(prevMk, dueDay)) ? prevMk : openMk;
}
function cardInvHint(){
  const l=$('cInvLbl'); if(!l) return; const cl=parseInt($('cClose').value), du=parseInt($('cDue').value);
  if (!(cl>=1&&cl<=31&&du>=1&&du<=31)) { l.textContent='Valor da fatura a pagar (a que vence primeiro)'; return; }
  const mk = coveredInvoice(cl,du); l.textContent = `Valor da fatura de ${mkLabel(mk,false)} (vence ${ddmm(dayIn(mk,du))})`;
}
function accType(t){
  window._accType=t;
  $('accBankF').classList.toggle('hidden',t==='card'); $('accResF').classList.toggle('hidden',t==='card'); $('accCardF').classList.toggle('hidden',t!=='card');
  if ($('atB')) { $('atB').classList.toggle('on',t==='bank'); $('atC').classList.toggle('on',t==='card');
    const e=$('aEmoji'); if (t==='card' && e.value==='🏦') e.value='💳'; if (t==='bank' && e.value==='💳') e.value='🏦'; }
}
function saveAccount(id){
  const name=$('aName').value.trim(); if (!name) return toast('Dê um nome à conta.',{err:true});
  if (window._accType==='card') {
    const limit=r2(parseMoney($('cLimit').value)||0), closingDay=parseInt($('cClose').value), dueDay=parseInt($('cDue').value);
    if (!limit || !(closingDay>=1&&closingDay<=31) || !(dueDay>=1&&dueDay<=31)) return toast('Preencha limite, dia de fechamento e de vencimento.',{err:true});
    const base = { name, emoji:$('aEmoji').value.trim()||'💳', color:$('aColor').value, limit, closingDay, dueDay, type:'card', isReserve:false };
    const availRaw = $('cAvail').value.trim(); const avail = r2(parseMoney(availRaw));
    if (!availRaw || isNaN(avail)) return toast('Informe o limite disponível agora.',{err:true});
    if (id) {
      const c = accById(id);
      S.transactions.filter(t=>t.accountId===id && t.type==='expense').forEach(t=>applyTx(t,-1));
      Object.assign(c, base);
      S.transactions.filter(t=>t.accountId===id && t.type==='expense').forEach(t=>{ finalizeTx(t); applyTx(t,+1); });
      c.balance = -r2(limit-avail);  // calibra pelo disponível informado
    } else {
      const c = { id:uid(), ...base, createdAt:Date.now(), openings:{}, availMode:true };
      c.coveredMk = c.startMk = coveredInvoice(closingDay, dueDay);
      const inv = r2(parseMoney($('cInv').value)||0);
      if (inv>0) c.openings[c.coveredMk] = inv;
      c.balance = -r2(limit-avail);
      S.accounts.push(c);
    }
    closeModal(); commit(); toast(`Cartão salvo 💳 · usado ${fmt(limit-avail)}`); return;
  }
  const data = { name, balance:r2(parseMoney($('aBal').value)||0), emoji:$('aEmoji').value.trim()||'🏦', color:$('aColor').value, isReserve:$('aRes').checked };
  if (id) Object.assign(accById(id), data); else S.accounts.push({ id:uid(), ...data });
  closeModal(); commit(); toast('Conta salva ✓');
}
function deleteAccount(id){
  if (!isCardId(id) && bankAccs().length<=1) return toast('Você precisa ter pelo menos uma conta.',{err:true});
  const a = accById(id);
  confirmBox({ title:`Excluir ${a.name}?`, text:'Os lançamentos antigos continuam no extrato como "conta excluída", mas o saldo sai do painel.', ok:'Excluir' }, ()=>{
    S.accounts=S.accounts.filter(x=>x.id!==id); S.bills.forEach(b=>{ if(b.accountId===id) b.accountId=(bankAccs()[0]||S.accounts[0]).id; }); commit(); });
}

const INV_TAG = { aberta:['', 'aberta'], fechada:['warn','fechada'], vencida:['bad','vencida'], paga:['ok','✓ paga'], vazia:['','sem gastos'] };

  s.pending.forEach(inv=>{
    h += `<div class="inv-alert ${inv.status==='vencida'?'bad':''}"><div class="grow"><b>Fatura de ${mkLabel(inv.mk,false)} ${inv.status==='vencida'?'VENCIDA':'fechada'}</b><div class="tiny">vence ${ddmm(inv.due)} · falta pagar ${fmt(inv.remaining)}</div></div>
      <button class="btn sm ${inv.status==='vencida'?'red':''}" onclick="openPayInvoice('${c.id}','${inv.mk}')">Pagar</button></div>`;
  });
  const cur = s.cur; const [tc,tl] = INV_TAG[cur.status];
  h += `<div class="row between mt8" style="align-items:flex-end"><div><div class="tiny muted b">Fatura de ${mkLabel(cur.mk,false)} <span class="pill-tag ${tc}">${tl}</span></div>
      <div class="b num" style="font-size:1.35rem">${fmt(cur.total)}</div></div>
      <div class="tiny muted b" style="text-align:right">fecha ${ddmm(cur.close)}<br>vence ${ddmm(cur.due)}${cur.paid>0?`<br>pago ${fmt(cur.paid)}`:''}</div></div>
    <div class="bar mt8 ${s.pct>=90?'red':s.pct>=70?'gold':''}" style="height:9px"><i style="width:${s.pct}%"></i></div>
    <div class="row between tiny b muted" style="margin-top:4px"><span>Usado ${fmt(s.used)}</span><span>Disponível <b style="color:${s.avail<0?'var(--bad)':'var(--text)'}">${fmt(s.avail)}</b></span></div>
    <div class="row mt8"><button class="btn sm line grow" onclick="openInvoiceView('${c.id}','${cur.mk}')">Ver fatura</button>${cur.remaining>0?`<button class="btn sm ghost grow" onclick="openPayInvoice('${c.id}','${cur.mk}')">Pagar fatura</button>`:''}</div></div>`;
  return h;
}

function doPayInvoice(cardId, mk){
  const amt = r2(parseMoney($('piAmt').value)); if (!amt||amt<=0) return toast('Valor inválido.',{err:true});
  const c = accById(cardId);
  const t = addTx({ type:'transfer', amount:amt, accountId:$('piFrom').value, toAccountId:cardId, invoiceMk:mk, timestamp:tsFromIso($('piDate').value), desc:`Fatura ${c.name} · ${mkLabel(mk,false)}` });
  closeModal(); commit(); confetti(60);
  toast(`💳 Fatura de ${mkLabel(mk,false)} paga: ${fmt(amt)}`, { action:{ label:'Desfazer', fn:()=>{ removeTx(t.id); commit(); } } });
}
function openInvoiceView(cardId, mk){
  const c = accById(cardId); const inv = invoiceInfo(c, mk); const [tc,tl] = INV_TAG[inv.status];
  const rows = [...inv.items].sort((a,b)=>b.timestamp-a.timestamp).map(t=>txRow(t).replace('onclick="openSheet(','onclick="closeModal();openSheet(')).join('');
  openModal(`<div class="month-nav"><button onclick="openInvoiceView('${cardId}','${addMonths(mk,-1)}')">‹</button>
      <div class="center"><h3 style="margin:0">${esc(c.name)} · ${mkLabel(mk,false)}/${mk.slice(2,4)}</h3><div class="tiny muted b">fecha ${ddmm(inv.close)} · vence ${ddmm(inv.due)} · <span class="pill-tag ${tc}">${tl}</span></div></div>
      <button onclick="openInvoiceView('${cardId}','${addMonths(mk,1)}')">›</button></div>
    <div class="sumline"><div><div class="k">Total</div><div class="v num">${fmt(inv.total)}</div></div><div><div class="k">Pago</div><div class="v num" style="color:var(--in)">${fmt(inv.paid)}</div></div><div><div class="k">Falta</div><div class="v num">${fmt(inv.remaining)}</div></div></div>

function togglePhase(id){
  const ph = S.phases.find(p=>p.id===id); const idx = S.phases.indexOf(ph); const done = S.settings.phasesDone;
  const isDone = phaseDone(ph,D);
  if (ph.auto && !done.includes(id)) {
    const k = ph.auto.kind==='reserve' ? `a reserva chegar a ${fmt(ph.auto.value)}` : `a reserva chegar a ${ph.auto.value}% da meta`;
    return toast(isDone?'✓ Fase concluída automaticamente.':`⚙️ Esta fase conclui sozinha quando ${k}.`);
  }
  if (isDone) {
    const after = S.phases.slice(idx+1).some(p=>done.includes(p.id));
    if (after) return toast('Desmarque primeiro as fases seguintes.',{err:true});
    return confirmBox({ icon:'↩️', title:'Desmarcar fase?', text:`"${ph.title}" volta a ficar pendente.`, ok:'Desmarcar' }, ()=>{ S.settings.phasesDone=done.filter(x=>x!==id); commit(); });
  }
  const pending = S.phases.slice(0,idx).find(p=>!phaseDone(p,D));
  if (pending) return toast(`Conclua antes: "${pending.title}". A jornada exige consistência!`,{err:true});
  done.push(id); commit(); confetti(120); toast(`🗺️ Fase concluída: ${ph.title}! +30 XP`);
}
function openPhasesEditor(){
  const rows = S.phases.map((p,i)=>`<div class="list-row"><div class="grow">
      <input class="inp" value="${esc(p.title)}" onchange="S.phases[${i}].title=this.value" style="padding:8px 12px;margin-bottom:4px">
      <input class="inp small" value="${esc(p.desc)}" onchange="S.phases[${i}].desc=this.value" style="padding:6px 12px;font-size:14px"></div>
      <div style="display:flex;flex-direction:column;gap:4px"><button class="ic-btn" onclick="movePhase(${i},-1)">▲</button><button class="ic-btn" onclick="movePhase(${i},1)">▼</button><button class="ic-btn" onclick="S.phases.splice(${i},1);openPhasesEditor()">🗑️</button></div></div>`).join('');
  openModal(`<h3>Editar fases da jornada</h3><p class="tiny muted b mb12">Fases ⚙️ (automáticas) mantêm a regra da reserva; o texto pode ser mudado.</p>${rows}

function movePhase(i,d){ const j=i+d; if(j<0||j>=S.phases.length) return; [S.phases[i],S.phases[j]]=[S.phases[j],S.phases[i]]; openPhasesEditor(); }

function checkRewards(){
  const st = S.settings; let changed=false;
  if (!st.achInit) { st.achievements = ACHIEVEMENTS.filter(a=>{ try{return a.c(D);}catch(e){return false;} }).map(a=>a.id); st.achInit=true; st.lastLevelSeen=D.level.n; changed=true; }
  else {
    const fresh = ACHIEVEMENTS.filter(a=>!st.achievements.includes(a.id) && (()=>{ try{return a.c(D);}catch(e){return false;} })());
    if (fresh.length) { fresh.forEach(a=>st.achievements.push(a.id)); changed=true;
      setTimeout(()=>{ confetti(180); toast(`🏆 Troféu: ${fresh.map(a=>a.e+' '+a.t).join(', ')}!`); }, 900); }
    if (D.level.n > st.lastLevelSeen) { st.lastLevelSeen=D.level.n; changed=true; setTimeout(()=>levelUp(D.level), 1600); }
    else if (D.level.n < st.lastLevelSeen) { st.lastLevelSeen=D.level.n; changed=true; }
  }
  if (changed) persist();
}

/* ---------------- BACKUP / CSV ---------------- */
const BK_NAME = 'financequest_backup.json';
const isMobile = () => /android|iphone|ipad/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent));
let backupHandle = null;
function idbGet(key){ return new Promise(res=>{ try { const rq=db.transaction('data','readonly').objectStore('data').get(key); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); } catch(e){ res(null); } }); }
function idbPut(key,val){ try { db.transaction('data','readwrite').objectStore('data').put(val,key); } catch(e){} }
async function savedHandle(){ if (!backupHandle) backupHandle = await idbGet('backupHandle'); return backupHandle; }
async function canUse(h, write){ try { const o={mode:write?'readwrite':'read'}; if (await h.queryPermission(o)==='granted') return true; return (await h.requestPermission(o))==='granted'; } catch(e){ return false; } }
const JSON_TYPES = [{ description:'Backup FinanceQuest', accept:{'application/json':['.json']} }];

async function exportBackup(forcePick){
  const json = JSON.stringify(S,null,2);
  try {
    const file = new File([json], BK_NAME, { type:'application/json' });
    if (window.showSaveFilePicker && !isMobile()) {
      // computador: lembra o arquivo e sobrescreve sempre o mesmo
      let h = forcePick ? null : await savedHandle();
      if (!h || !(await canUse(h,true))) {
        h = await showSaveFilePicker({ suggestedName:BK_NAME, startIn: backupHandle || 'documents', types:JSON_TYPES });
      }
      const w = await h.createWritable(); await w.write(json); await w.close();
      backupHandle = h; idbPut('backupHandle', h); S.settings.backupFileName = h.name;
    } else if (navigator.canShare && navigator.canShare({ files:[file] })) {
      // iPhone/Android: abre "Salvar em Arquivos" → escolha a pasta do iCloud e confirme "Substituir"
      await navigator.share({ files:[file], title:'Backup FinanceQuest' });
    } else {
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=BK_NAME; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    }
    S.settings.lastBackupAt = Date.now(); commit(); toast('💾 Backup salvo!');
  } catch(e) { if (e.name!=='AbortError') toast('Não consegui salvar o backup.',{err:true}); }
}
async function startImport(){
  if (window.showOpenFilePicker && !isMobile()) {
    try {
      const h = await savedHandle();
      const [fh] = await showOpenFilePicker({ startIn: h || 'documents', types:JSON_TYPES });
      importBackup(await fh.getFile());
      backupHandle = fh; idbPut('backupHandle', fh); S.settings.backupFileName = fh.name;
    } catch(e) { if (e.name!=='AbortError') $('fileImport').click(); }
  } else $('fileImport').click();
}
async function importFromSaved(){
  const h = await savedHandle();
  if (!h || !(await canUse(h,false))) return startImport();
  try { importBackup(await h.getFile()); } catch(e){ startImport(); }
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data.settings || !Array.isArray(data.accounts)) throw 0;
      confirmBox({ icon:'📂', title:'Restaurar backup?', text:`Isso substitui os dados atuais deste aparelho (${data.transactions?.length||0} lançamentos no arquivo).`, ok:'Restaurar' }, ()=>{
        S = migrate(data); S.settings.lastMonthSeen = S.settings.lastMonthSeen || curMK(); commit(); toast('Backup restaurado! Bem-vindo de volta.'); confetti(100); });
    } catch(e){ toast('Esse arquivo não parece um backup válido.',{err:true}); }
  };
  rd.readAsText(file);
}
function exportCSV(){
  const rows = [['Data','Tipo','Categoria','Descrição','Conta/Origem','Destino','Valor']];
  [...S.transactions].sort((a,b)=>a.timestamp-b.timestamp).forEach(t=>{
    const {c,where,title} = txLabels(t); const [o,d] = t.type==='transfer'?where.split(' → '):[where,''];
    rows.push([new Date(t.timestamp).toLocaleDateString('pt-BR'), {income:'Entrada',expense:'Gasto',transfer:'Movimento'}[t.type], t.type==='transfer'?'':c.name, title, o, d||'', (t.type==='expense'?-t.amount:t.amount).toFixed(2).replace('.',',')]);
  });
  const csv = '﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`financequest_lancamentos_${isoFromTs(Date.now())}.csv`; a.click();
  toast('CSV exportado (abre no Excel).');
}

let _imgTarget = null;

function resizeImage(file, max, cb){
  const rd = new FileReader();
  rd.onload = e => { const img=new Image(); img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL('image/jpeg',.82)); }; img.onerror=()=>toast('Não consegui ler a imagem.',{err:true}); img.src=e.target.result; };
  rd.readAsDataURL(file);
}

/* ---------------- MODAL / TOAST / CONFETE ---------------- */
function openModal(html){ $('modal').innerHTML=html; $('modalOv').classList.add('on'); }
function closeModal(){ $('modalOv').classList.remove('on'); }
let _confirmCb=null;
function confirmBox({icon='🗑️',title='Tem certeza?',text='',ok='Confirmar'},cb){
  _confirmCb=cb;
  openModal(`<div class="center"><div style="font-size:3rem">${icon}</div><h3>${esc(title)}</h3><p class="small muted b">${esc(text)}</p></div>
    <div class="acts"><button class="btn line" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="const f=_confirmCb;closeModal();f&&f()">${esc(ok)}</button></div>`);
}
let _toastT;
function toast(text, opt={}){
  const el=$('toast'); $('toastTxt').textContent=text; el.classList.toggle('err',!!opt.err);
  const b=$('toastBtn');
  if (opt.action) { b.textContent=opt.action.label; b.classList.remove('hidden'); b.onclick=()=>{ el.classList.remove('on'); opt.action.fn(); }; }
  else b.classList.add('hidden');
  el.classList.add('on'); clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove('on'), opt.action?5500:3500);
}
function confetti(n=100){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#657990','#0f9d76','#f59e0b','#e0644f','#4f46e5','#a0b2c6','#fbbf24'];
  const ps=Array.from({length:n},()=>({ x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*.6, vx:(Math.random()-.5)*14, vy:-Math.random()*16-6, s:Math.random()*7+4, c:cols[Math.random()*cols.length|0], r:Math.random()*6, vr:(Math.random()-.5)*.3 }));
  let f=0; (function step(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-f/110); ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }); if(++f<110) requestAnimationFrame(step); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

/* ---------------- PWA ---------------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e; const b=$('btnInstall'); if(b) b.classList.remove('hidden'); });
async function doInstall(){ if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; renderAjustes(); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------------- INÍCIO DO APP ---------------- */
async function boot(){
  try { await initDB(); const raw = await loadState(); S = raw ? migrate(raw) : freshState(); if (!raw) { S.settings.achInit=false; } persist(); }
  catch(e){ console.error(e); S = freshState(); toast('Não consegui abrir o banco local. Os dados não serão salvos.',{err:true}); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  renderAll();
  await setupServerSync();
  freshStartCheck();
  const q = new URLSearchParams(location.search).get('add');
  if (q) setTimeout(()=>openSheet({ mode: ['expense','income','save'].includes(q)?q:'expense' }), 300);
}

document.addEventListener('keydown', e=>{
  if (e.key==='Escape') { closeModal(); closeSheet(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!typing && (e.key==='n'||e.key==='N'||e.key==='+') && !$('sheetOv').classList.contains('on') && !$('modalOv').classList.contains('on')) { e.preventDefault(); openSheet(); }
  if (e.key==='Enter' && $('sheetOv').classList.contains('on') && (document.activeElement.id==='shAmount'||document.activeElement.id==='shDesc')) {
    e.preventDefault();
    if (SH.mode==='save' || SH.editId || SH.catId) commitSheet(); else toast('Agora toque na categoria 👇');
  }
});
$('shAmount').addEventListener('input', instPreview);
['sheetOv','modalOv'].forEach(id=>$(id).addEventListener('mousedown', e=>{ if (e.target.id===id) id==='sheetOv'?closeSheet():closeModal(); }));
$('fileImport').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=''; });
$('fileImage').addEventListener('change', e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if (_imgTarget==='avatar') resizeImage(f,256,url=>{ S.settings.avatarImage=url; commit(); toast('Foto atualizada ✓'); });
  else resizeImage(f,520,url=>{ _goalPhoto=url; const p=$('gPhPrev'); if(p) p.innerHTML=`<img src="${url}">`; });
});
boot();

</script>
