Listen 8798
<VirtualHost *:8798>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    # backups grandes (fotos) passam inteiros
    LimitRequestBody 0
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
