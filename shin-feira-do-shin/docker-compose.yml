version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<serviço>_1
      APP_HOST: shin-feira-do-shin_web_1
      APP_PORT: 8794

  web:
    image: ghcr.io/shinssa/feira-do-shin:1.0.0
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      HOST: 0.0.0.0
      PORT: 8794
      FEIRA_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
